const ACT_MS = { saluta: 2000, balla: 6000, salta: 1600 };
// Verso dell'omino: nelle stanze isometriche segue gli assi del rombo; in città (vista di tre
// quarti) di fronte quando scende o va di lato, di spalle quando sale.
const DIR_OF = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'SE' : 'NW') : (dy > 0 ? 'SW' : 'NE'));
const DIR_TOWN = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'SE' : 'SW') : (dy > 0 ? 'SE' : 'NE'));

class CityMap {
  constructor(canvas, { onTap, onCamera } = {}) {
    this.cv = canvas;
    this.g = canvas.getContext('2d');
    this.layer = document.createElement('canvas');   // strato fisso, a bassa risoluzione
    this.frame = document.createElement('canvas');   // fotogramma completo, a bassa risoluzione
    this.onTap = onTap;
    this.onCamera = onCamera;
    this.city = null;
    this.opts = { mode: 'browse', meId: null, friends: new Set(), online: new Set(), night: false, selected: null };
    this.cam = { x: 0, y: 900, z: 1 };
    this.born = new Map();
    this.avatars = new Map();
    this.scene = null;          // null = città, altrimenti l'id dell'abitante di cui si è in casa
    this.roomUI = {};           // { highlight, selectedUid } durante l'arredamento
    this.roomHits = [];
    this.objects = [];
    this.labels = [];
    this.dirty = true;
    this.lastAmbient = 0;
    this.interactUntil = 0;
    this.pointers = new Map();
    this.still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.bind();
    this.resize();
    new ResizeObserver(() => this.resize()).observe(canvas);
    // Durante un gesto si sposta l'ultima immagine pronta; a gesto finito lo zoom si aggancia
    // a un multiplo intero dei pixel (immagine nitida) e la città si ridisegna.
    const loop = (t) => {
      this.now = t;
      const interacting = this.pointers.size > 0 || t < this.interactUntil;
      if (!interacting && this.needSnap) { this.needSnap = false; this.snapZoom(); }
      const growing = this.animating(t);
      const walking = this.tickAvatars(t);
      if ((this.dirty || growing) && interacting && this.layerCam && !this.stale()) this.fast();
      else if (this.dirty || growing) { this.dirty = false; this.render(t, true); this.lastAmbient = t; }
      else if ((walking || this.bubbling(t) || this.acting(t)) && t - this.lastAmbient > 33) { this.render(t, false); this.lastAmbient = t; }
      else if (this.avatarsDirty || (!this.still && t - this.lastAmbient > 66)) { this.avatarsDirty = false; this.render(t, false); this.lastAmbient = t; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  levelOf(x, y) { return this.city ? levelAt(Math.round(x), Math.round(y), this.city.openDistricts) : 0; }

  /* Omini */
  setAvatars(list) {
    const ids = new Set(list.map((a) => a.id));
    for (const id of this.avatars.keys()) if (!ids.has(id)) this.avatars.delete(id);
    for (const a of list) {
      const cur = this.avatars.get(a.id);
      const room = a.pos[2] ?? null;
      const look = a.colors || avatarLook(a.name, a.look);
      if (cur) {
        cur.name = a.name; cur.me = a.me; cur.look = look; cur.ride = a.ride || null;
        if (cur.room !== room) Object.assign(cur, { room, x: a.pos[0], y: a.pos[1], path: [] });
        continue;
      }
      this.avatars.set(a.id, { id: a.id, x: a.pos[0], y: a.pos[1], room, path: [], dir: a.dir || 'SE', look, name: a.name, me: a.me, walked: 0, bubble: null, ride: a.ride || null });
    }
    this.avatarsDirty = true;
  }
  walk(id, tx, ty, room = null) {
    const a = this.avatars.get(id);
    if (!a || !this.city) return false;
    // Entrare o uscire di casa: l'omino compare direttamente dall'altra parte della porta.
    if ((a.room ?? null) !== (room ?? null)) { Object.assign(a, { room, x: tx, y: ty, path: [], dir: room ? 'SE' : 'SW' }); this.avatarsDirty = true; return true; }
    const from = [Math.round(a.x), Math.round(a.y)];
    const path = room ? roomPath(roomOf(this.city, room), from, [tx, ty]) : walkPath(this.city, from, [tx, ty]);
    if (!path) return false;
    a.path = path;
    if (path.length) { a.sit = null; a.wantSit = false; a.act = null; }
    this.avatarsDirty = true;
    return true;
  }
  say(id, text) {
    const a = this.avatars.get(id);
    if (!a) return;
    a.bubble = { text, t0: performance.now() };
    this.avatarsDirty = true;
  }
  bubbling(t) { for (const a of this.avatars.values()) if (a.bubble && t - a.bubble.t0 < 6500) return true; return false; }
  avatarOf(id) { return this.avatars.get(id); }
  avatarScreen(a) {
    if (a.room) { const [cx, cy] = roomCenter(a.x, a.y); return [cx, cy + 2]; }
    // In città i piedi stanno al centro della casella; sulle rampe si sale e si scende piano
    return [(a.x + 0.5) * TILE, (a.y + 0.5) * TILE - surfaceOf(this.city, a.x + 0.5, a.y + 0.5) + 4];
  }
  // In città l'omino è in scala con le case; in casa è grande come in Habbo.
  avatarScale() { return this.scene ? 1 : 0.62; }
  visibleAvatars() { const here = this.scene || null; return [...this.avatars.values()].filter((a) => (a.room ?? null) === here); }

  /* Dentro casa */
  enterRoom(ownerId) {
    if (!this.scene) this.townCam = { ...this.cam };
    this.scene = ownerId;
    this.roomUI = {};
    // La stanza riempie la larghezza dello schermo e sta nella metà alta, sopra i comandi.
    this.cam.z = Math.max(1, Math.round((Math.min(this.vw, this.vh * 1.2) * this.dpr) / 450)) / this.dpr;
    [this.cam.x, this.cam.y] = roomCenter(ROOM / 2 - 0.5, ROOM / 2 - 0.5);
    this.cam.y += (0.5 - 0.36) * this.vh / this.cam.z - 40;
    this.clamp();
    this.dirty = true;
  }
  exitRoom() {
    this.scene = null;
    this.roomUI = {};
    if (this.townCam) this.cam = { ...this.townCam };
    this.clamp();
    this.dirty = true;
  }
  setRoomUI(ui) { this.roomUI = { ...this.roomUI, ...ui }; this.dirty = true; }
  tickAvatars(t) {
    const dt = Math.min(0.1, (t - (this.lastTick || t)) / 1000);
    this.lastTick = t;
    let moving = false;
    for (const a of this.avatars.values()) {
      if (!a.path.length) continue;
      moving = true;
      // A passo d'uomo; con bici, monopattino o skate (solo in città) più svelti.
      const speed = (!a.room && rideById(a.ride)?.speed) || WALK_SPEED;
      let left = dt * speed;
      while (left > 0 && a.path.length) {
        const [nx, ny] = a.path[0];
        const dx = nx - a.x, dy = ny - a.y, d = Math.hypot(dx, dy);
        if (d > 0.001) a.dir = a.room ? DIR_OF(dx, dy) : DIR_TOWN(dx, dy);
        if (d <= left) { a.x = nx; a.y = ny; a.path.shift(); left -= d; } else { a.x += (dx / d) * left; a.y += (dy / d) * left; left = 0; }
      }
      if (!a.path.length) this.settle(a);
      a.walked += dt * speed;
      // La telecamera segue il proprio omino quando esce dal centro dello schermo.
      if (a.me && !this.scene && !this.pointers.size) {
        const [wx, wy] = this.avatarScreen(a);
        const sx = (wx - this.cam.x) * this.cam.z, sy = (wy - 24 - this.cam.y) * this.cam.z;
        const mx = this.vw * 0.28, my = this.vh * 0.2;
        if (Math.abs(sx) > mx || Math.abs(sy) > my) {
          this.cam.x += (sx - Math.sign(sx) * Math.min(Math.abs(sx), mx)) / this.cam.z * 0.12;
          this.cam.y += (sy - Math.sign(sy) * Math.min(Math.abs(sy), my)) / this.cam.z * 0.12;
          this.clamp();
          this.interactUntil = t + 200;
          this.dirty = true;
        }
      }
    }
    if (!moving && this.wasWalking) this.dirty = true;
    this.wasWalking = moving;
    return moving;
  }
  drawOneAvatar(g, a, night) {
    const [x, y] = this.avatarScreen(a);
    const step = a.path.length ? (Math.floor(a.walked * 2.6) % 2) + 1 : 0;
    const k = this.avatarScale();
    const t = (this.now || 0) - (a.act?.t0 || 0);
    const kind = a.act && t < ACT_MS[a.act.kind] ? a.act.kind : null;
    let lift = 0, pose = null;
    if (a.sit && !a.path.length) { pose = 'sit'; lift = a.sit.h / k - 15; } // il sedere sulla seduta
    else if (kind === 'salta') { lift = Math.abs(Math.sin((t / 800) * Math.PI)) * 9; }
    else if (kind === 'balla') { pose = 'dance'; lift = Math.floor(t / 260) % 2 ? 1 : 0; }
    else if (kind === 'saluta') pose = 'wave';
    g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(k, k);
    if (lift) g.translate(0, -Math.round(lift));
    drawAvatar(g, 0, 0, a.dir, step, a.look, { night, pose, t, ride: a.room || a.sit ? null : a.ride, flatRide: !a.room });
    g.restore();
  }
  // Gesti: saluta, balla, salta. Sedersi aspetta che l'omino arrivi sulla seduta.
  act(id, kind) {
    const a = this.avatars.get(id);
    if (!a) return;
    if (kind === 'siedi') { a.wantSit = true; this.settle(a); }
    else { a.act = { kind, t0: this.now || performance.now() }; a.sit = null; }
    this.avatarsDirty = true;
  }
  settle(a) {
    if (!a.wantSit || a.path.length || !this.city) return;
    a.wantSit = false;
    const seat = seatAt(this.city, a.room, Math.round(a.x), Math.round(a.y));
    if (seat) { a.sit = seat; if (seat.dir) a.dir = seat.dir; }
  }
  acting(t) { for (const a of this.avatars.values()) if (a.act && t - a.act.t0 < ACT_MS[a.act.kind]) return true; return false; }
  drawAvatars(g, night, occlude) {
    const list = this.visibleAvatars().sort((a, b) => a.y - b.y || a.x - b.x);
    for (const a of list) {
      const [x, y] = this.avatarScreen(a);
      this.drawOneAvatar(g, a, night);
      if (!occlude) continue;
      // Ciò che sta davanti all'omino (più in basso sullo schermo: case, alberi, negozi) lo ricopre.
      const depth = a.y + 0.5;
      for (const ob of this.objects) {
        if (ob.depth <= depth + 0.05) continue;
        const [x0, y0, x1, y1] = ob.box;
        if (x + 6 < x0 || x - 6 > x1 || y < y0 || y - 26 > y1) continue;
        this.cover(g, ob, [x - 14, y - 56, x + 14, y + 4]);
      }
    }
  }

  setCity(city, { animateNew = true } = {}) {
    if (this.city && animateNew) {
      for (const slot of Object.keys(city.houses)) {
        const was = this.city.houses[slot];
        if (!was || was.status !== city.houses[slot].status) this.born.set(slot, performance.now());
      }
    }
    this.city = city;
    this.dirty = true;
  }
  set(opts) { Object.assign(this.opts, opts); this.dirty = true; }
  animating(t) {
    for (const [slot, t0] of this.born) { if (t - t0 < 1400) return true; this.born.delete(slot); }
    return false;
  }

  /* Telecamera: cam.x, cam.y nel mondo (pixel d'arte), cam.z = pixel CSS per pixel d'arte */
  resize() {
    const r = this.cv.getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.vw = Math.max(1, r.width);
    this.vh = Math.max(1, r.height);
    this.cv.width = Math.round(this.vw * this.dpr);
    this.cv.height = Math.round(this.vh * this.dpr);
    if (!this.fitted && this.vw > 50) { this.fitted = true; this.fitCentro(); }
    this.clamp();
    this.dirty = true;
  }
  fitCentro({ wide = false } = {}) {
    // A grandezza naturale: due pixel dello schermo (o più) per pixel d'arte, centrati sulla piazza.
    // Per scegliere il lotto si guarda tutto il Centro dall'alto.
    this.cam.z = wide ? Math.max(1, Math.round((this.vw * this.dpr) / 700)) / this.dpr : Math.max(2, Math.round((this.vw * this.dpr) / 420)) / this.dpr;
    [this.cam.x, this.cam.y] = townCenter(40, 26, 1);
    this.clamp();
    this.dirty = true;
  }
  focus(slotOrXY) {
    const [x, y] = typeof slotOrXY === 'string' ? parseKey(slotOrXY) : slotOrXY;
    [this.cam.x, this.cam.y] = townCenter(x, y, this.levelOf(x, y));
    this.cam.y -= 16;
    if (this.cam.z * this.dpr < 2) this.cam.z = 2 / this.dpr;
    this.clamp();
    this.dirty = true;
  }
  zoomLimits() {
    const minZ = Math.max(this.vw / (WORLD.x1 - WORLD.x0 + 200), this.vh / (WORLD.y1 - WORLD.y0 + 200));
    return [minZ, Math.min(4 / this.dpr, 3)];
  }
  clamp() {
    if (this.scene) {
      this.cam.z = Math.max(0.5 / this.dpr, Math.min(4 / this.dpr, this.cam.z));
      const [cx, cy] = roomCenter(ROOM / 2 - 0.5, ROOM / 2 - 0.5);
      this.cam.x = Math.max(cx - 260, Math.min(cx + 260, this.cam.x));
      this.cam.y = Math.max(cy - 200, Math.min(cy + 60 + 0.3 * this.vh / this.cam.z, this.cam.y));
      return;
    }
    const [minZ, maxZ] = this.zoomLimits();
    this.cam.z = Math.max(minZ, Math.min(maxZ, this.cam.z));
    const hw = this.vw / 2 / this.cam.z, hh = this.vh / 2 / this.cam.z;
    this.cam.x = Math.max(Math.min(WORLD.x0 + hw - 100, 0), Math.min(Math.max(WORLD.x1 - hw + 100, 0), this.cam.x));
    this.cam.y = Math.max(WORLD.y0 + hh - 100, Math.min(WORLD.y1 - hh + 100, this.cam.y));
    this.onCamera?.(this.cam);
  }
  // Lo zoom si ferma su multipli interi dei pixel dello schermo: pixel d'arte nitidi, come in Habbo.
  snapZoom() {
    const n = this.cam.z * this.dpr;
    if (n >= 0.85) this.cam.z = Math.max(1, Math.round(n)) / this.dpr;
    else if (n >= 0.4) this.cam.z = 0.5 / this.dpr;
    this.clamp();
    this.dirty = true;
  }
  zoomStep(dir) {
    const steps = [0.25, 0.5, 1, 2, 3, 4];
    const n = this.cam.z * this.dpr;
    let i = steps.findIndex((s) => s >= n - 0.01);
    if (i < 0) i = steps.length - 1;
    i = Math.max(0, Math.min(steps.length - 1, i + (dir > 0 ? 1 : -1)));
    this.cam.z = steps[i] / this.dpr;
    this.clamp();
    this.dirty = true;
  }
  toWorld(sx, sy) { return [(sx - this.vw / 2) / this.cam.z + this.cam.x, (sy - this.vh / 2) / this.cam.z + this.cam.y]; }
  zoomAt(sx, sy, factor) {
    this.interactUntil = performance.now() + 160;
    this.needSnap = true;
    const [wx, wy] = this.toWorld(sx, sy);
    this.cam.z *= factor;
    this.clamp();
    const [nx, ny] = this.toWorld(sx, sy);
    this.cam.x += wx - nx; this.cam.y += wy - ny;
    this.clamp();
    this.dirty = true;
  }

  bind() {
    const cv = this.cv;
    cv.style.touchAction = 'none';
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
      if (this.pointers.size === 1) this.drag = { x: e.offsetX, y: e.offsetY, moved: 0 };
      else { this.drag = null; this.pinch = this.pinchInfo(); }
    });
    cv.addEventListener('pointermove', (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
      if (this.pinch && this.pointers.size === 2) {
        const p = this.pinchInfo();
        this.zoomAt(p.cx, p.cy, p.d / this.pinch.d);
        this.cam.x -= (p.cx - this.pinch.cx) / this.cam.z;
        this.cam.y -= (p.cy - this.pinch.cy) / this.cam.z;
        this.clamp();
        this.pinch = p;
      } else if (this.drag) {
        const dx = e.offsetX - this.drag.x, dy = e.offsetY - this.drag.y;
        this.drag.moved += Math.abs(dx) + Math.abs(dy);
        this.cam.x -= dx / this.cam.z; this.cam.y -= dy / this.cam.z;
        this.drag.x = e.offsetX; this.drag.y = e.offsetY;
        this.clamp();
      }
      this.dirty = true;
    });
    const up = (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.delete(e.pointerId);
      if (this.drag && this.drag.moved < 8 && e.type === 'pointerup') this.tap(e.offsetX, e.offsetY);
      this.drag = null;
      if (this.pointers.size < 2) this.pinch = null;
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', (e) => { e.preventDefault(); this.zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  }
  pinchInfo() {
    const [a, b] = [...this.pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
  }

  // Dal punto toccato alla cosa: prima gli omini, poi le case, poi il terreno più vicino a chi guarda.
  tap(sx, sy) {
    if (!this.city) return;
    const [wx, wy] = this.toWorld(sx, sy);
    let best = null;
    const ks = this.avatarScale();
    for (const a of this.visibleAvatars()) {
      const [x, y] = this.avatarScreen(a);
      if (wx > x - 10 * ks && wx < x + 10 * ks && wy > y - 50 * ks && wy < y + 3 && (!best || a.x + a.y > best.d)) best = { d: a.x + a.y, id: a.id };
    }
    if (best) return this.onTap?.({ kind: 'avatar', id: best.id });
    if (this.scene) {
      let hit = null;
      for (const h of this.roomHits) { const [x0, y0, x1, y1] = h.box; if (wx >= x0 && wx <= x1 && wy >= y0 && wy <= y1 && (!hit || h.d > hit.d)) hit = h; }
      const tx = Math.floor((wy / 16 + wx / 32) / 2), ty = Math.floor((wy / 16 - wx / 32) / 2);
      const onFloor = tx >= 0 && ty >= 0 && tx < ROOM && ty < ROOM;
      if (hit && (!onFloor || hit.d >= 0)) return this.onTap?.({ kind: 'furni', uid: hit.uid, x: tx, y: ty });
      if (onFloor) return this.onTap?.({ kind: 'floor', x: tx, y: ty });
      // La porta, sulla parete di sinistra
      const dc = roomCenter(-0.5, ROOM_DOOR[1]);
      if (Math.abs(wx - dc[0]) < 26 && wy < dc[1] && wy > dc[1] - 80) return this.onTap?.({ kind: 'door' });
      return this.onTap?.({ kind: 'none' });
    }
    let house = null;
    for (const ob of this.objects) {
      if (ob.type !== 'house' && ob.type !== 'shop') continue;
      const [x0, y0, x1, y1] = ob.box;
      if (wx >= x0 && wx <= x1 && wy >= y0 && wy <= y1 && (!house || ob.depth > house.depth)) house = ob;
    }
    const tile = townTileAt(this.city, wx, wy);
    if (house && (!tile || house.depth >= tile[1])) {
      if (house.type === 'shop') return this.onTap?.({ kind: 'shop', shop: house.shop });
      const [x, y] = parseKey(house.slot);
      return this.onTap?.({ kind: 'house', slot: house.slot, house: this.city.houses[house.slot], x, y });
    }
    if (!tile) return this.onTap?.({ kind: 'none' });
    const [x, y] = tile;
    const k = key(x, y);
    const at = { x, y };
    if (this.city.houses[k]) return this.onTap?.({ kind: 'house', slot: k, house: this.city.houses[k], ...at });
    if (shopAt(x, y)) return this.onTap?.({ kind: 'shop', shop: shopAt(x, y).id, ...at });
    if (inPiazza(x, y)) {
      const [ex, ey] = PIAZZA_DECOR.edicola;
      if (x === ex && y === ey) return this.onTap?.({ kind: 'giornale', ...at });
      if (PIAZZA_DECOR.muro.some(([mx, my]) => mx === x && my === y)) return this.onTap?.({ kind: 'muro', ...at });
      return this.onTap?.({ kind: 'piazza', ...at });
    }
    const d = districtAt(x, y);
    if (PLAN.lots.has(k) && d && d <= this.city.openDistricts) return this.onTap?.({ kind: 'lot', slot: k, ...at });
    if (d && d > this.city.openDistricts) return this.onTap?.({ kind: 'locked', district: d, ...at });
    this.onTap?.({ kind: 'none', ...at });
  }

  view(cam = this.cam) {
    const hw = this.vw / 2 / cam.z, hh = this.vh / 2 / cam.z;
    return { L: cam.x - hw, R: cam.x + hw, T: cam.y - hh, B: cam.y + hh };
  }
  stale() {
    const L = this.layerCam, c = this.cam;
    const s = c.z / L.z;
    const dx = Math.abs(L.x - c.x) * c.z, dy = Math.abs(L.y - c.y) * c.z;
    return s < 0.6 || s > 2.4 || dx > this.vw * 0.4 || dy > this.vh * 0.35;
  }
  // Pixel interi: il buffer è grande quanto lo schermo diviso per q, poi si ingrandisce di q senza sfumare.
  pixelScale() {
    const n = this.cam.z * this.dpr;
    const q = n >= 1 ? Math.max(1, Math.round(n)) : 1;
    return { q, s: n / q };
  }
  fast() {
    if (this.scene) return this.render(this.now, true);
    const L = this.layerCam, c = this.cam, d = this.dpr;
    const s = c.z / L.z;
    const g = this.g;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#a9d4e6'; g.fillRect(0, 0, this.cv.width, this.cv.height);
    g.imageSmoothingEnabled = false;
    g.setTransform(s, 0, 0, s, d * ((this.vw / 2) * (1 - s) + (L.x - c.x) * c.z), d * ((this.vh / 2) * (1 - s) + (L.y - c.y) * c.z));
    g.drawImage(this.layer, 0, 0, this.layer.width * L.q, this.layer.height * L.q);
    const layerT = g.getTransform();
    this.worldTransform(g, c.z * d);
    this.drawAvatars(g, this.opts.night, false);
    if (this.opts.night && this.lit) {
      nightTint(g, this.cv.width, this.cv.height);
      g.save(); g.setTransform(layerT); g.globalCompositeOperation = 'lighter';
      g.drawImage(this.nightLayer, 0, 0, this.nightLayer.width * L.q, this.nightLayer.height * L.q);
      g.restore();
    }
    drawClouds(g, c, this.vw, this.vh, d, this.still ? 0 : this.now, this.opts.night);
  }
  // Ridisegna una casa (o un albero, un negozio) sopra ciò che le passa dietro. La prima volta la
  // disegna in un ritaglio grande quanto basta, poi incolla il ritaglio: molto più leggero.
  // Si ridisegna solo dentro il riquadro di chi passa dietro (clip), così il resto della scena resta com'è.
  cover(g, ob, clip) {
    if (g.canvas !== this.frame) return ob.draw(g);
    const { s } = this.pixelScale();
    const bw = this.frame.width, bh = this.frame.height;
    const ox = Math.round(bw / 2 - this.cam.x * s), oy = Math.round(bh / 2 - this.cam.y * s);
    if (!ob.sprite) {
      const [x0, y0, x1, y1] = ob.box;
      const px0 = Math.floor((x0 - 6) * s + ox), py0 = Math.floor((y0 - 6) * s + oy);
      const px1 = Math.ceil((x1 + 6) * s + ox), py1 = Math.ceil((y1 + 6) * s + oy);
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, px1 - px0); cv.height = Math.max(1, py1 - py0);
      const cg = cv.getContext('2d');
      cg.setTransform(s, 0, 0, s, ox - px0, oy - py0);
      ob.draw(cg);
      // Di giorno il ritaglio prende la stessa luce calda dello strato fisso (poi si rimettono i bordi trasparenti).
      if (!this.opts.night) {
        const shape = document.createElement('canvas'); shape.width = cv.width; shape.height = cv.height;
        shape.getContext('2d').drawImage(cv, 0, 0);
        warmLight(cg, bw, bh, -px0, -py0);
        cg.save(); cg.setTransform(1, 0, 0, 1, 0, 0); cg.globalCompositeOperation = 'destination-in'; cg.drawImage(shape, 0, 0); cg.restore();
      }
      ob.sprite = { cv, px0, py0 };
    }
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    if (clip) {
      const cx0 = Math.floor(clip[0] * s + ox), cy0 = Math.floor(clip[1] * s + oy);
      const cx1 = Math.ceil(clip[2] * s + ox), cy1 = Math.ceil(clip[3] * s + oy);
      g.beginPath(); g.rect(cx0, cy0, cx1 - cx0, cy1 - cy0); g.clip();
    }
    g.drawImage(ob.sprite.cv, ob.sprite.px0, ob.sprite.py0);
    g.restore();
  }
  // Lo spostamento si arrotonda ai pixel interi: niente righine tra una casella e l'altra.
  worldTransform(g, scale, w = this.cv.width, h = this.cv.height) {
    g.setTransform(scale, 0, 0, scale, Math.round(w / 2 - this.cam.x * scale), Math.round(h / 2 - this.cam.y * scale));
  }

  renderRoom(t) {
    const { q, s } = this.pixelScale();
    const bw = Math.ceil(this.cv.width / q), bh = Math.ceil(this.cv.height / q);
    const fr = this.frame;
    if (fr.width !== bw || fr.height !== bh) { fr.width = bw; fr.height = bh; }
    const fg = fr.getContext('2d');
    fg.setTransform(1, 0, 0, 1, 0, 0);
    const bg = fg.createLinearGradient(0, 0, 0, bh);
    bg.addColorStop(0, '#20263a'); bg.addColorStop(1, '#0f1320');
    fg.fillStyle = bg; fg.fillRect(0, 0, bw, bh);
    this.worldTransform(fg, s, bw, bh);
    const night = this.opts.night;
    const avatars = this.visibleAvatars().map((a) => ({ x: a.x, y: a.y, d: a.sit?.d, draw: () => this.drawOneAvatar(fg, a, night) }));
    this.roomHits = drawRoom(fg, roomOf(this.city, this.scene), { night, avatars, ...this.roomUI });
    const g = this.g;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.imageSmoothingEnabled = false;
    g.drawImage(fr, 0, 0, bw * q, bh * q);
    this.overlay(g, t, { ...this.opts, selected: null });
  }

  render(t, full) {
    if (!this.city) return;
    if (this.scene) return this.renderRoom(t);
    const { q, s } = this.pixelScale();
    const bw = Math.ceil(this.cv.width / q), bh = Math.ceil(this.cv.height / q);
    for (const cv of [this.layer, this.frame]) if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; full = true; }
    const o = { ...this.opts, t, born: this.born, z: this.cam.z, detail: this.cam.z * this.dpr >= 0.75 };
    const view = this.view();
    if (full) {
      const lg = this.layer.getContext('2d');
      lg.setTransform(1, 0, 0, 1, 0, 0);
      const sky = lg.createLinearGradient(0, 0, 0, bh);
      sky.addColorStop(0, '#c7e7f2'); sky.addColorStop(1, '#9ccbe0'); // di notte lo scurisce il colore notturno
      lg.fillStyle = sky; lg.fillRect(0, 0, bw, bh);
      this.worldTransform(lg, s, bw, bh);
      const res = drawTown(lg, this.city, view, o);
      // La luce calda del giorno si stende una volta sola sullo strato fisso.
      if (!o.night) warmLight(lg, bw, bh);
      this.objects = res.objects;
      this.labels = res.labels;
      this.layerCam = { ...this.cam, q };
      // Di notte le luci fisse si preparano una volta sola, su uno strato trasparente.
      this.lit = !!o.night;
      if (o.night) {
        const nl = (this.nightLayer ||= document.createElement('canvas'));
        if (nl.width !== bw || nl.height !== bh) { nl.width = bw; nl.height = bh; }
        const ng = nl.getContext('2d');
        ng.setTransform(1, 0, 0, 1, 0, 0); ng.clearRect(0, 0, bw, bh);
        this.worldTransform(ng, s, bw, bh);
        ng.globalCompositeOperation = 'lighter';
        drawTownLights(ng, res.lights, res.lamps);
        ng.globalCompositeOperation = 'source-over';
      }
    }
    // Fotogramma: strato fisso, poi acqua, auto e omini nello stesso buffer (stessi pixel).
    const fg = this.frame.getContext('2d');
    fg.setTransform(1, 0, 0, 1, 0, 0);
    fg.drawImage(this.layer, 0, 0);
    this.worldTransform(fg, s, bw, bh);
    // Quello che sta davanti a un veicolo (case, alberi, negozi) lo copre.
    o.occlude = (depth, [bx0, by0, bx1, by1]) => {
      for (const ob of this.objects) {
        if (ob.depth <= depth + 0.05) continue;
        const [x0, y0, x1, y1] = ob.box;
        if (bx1 < x0 || bx0 > x1 || by1 < y0 || by0 > y1) continue;
        this.cover(fg, ob, [bx0, by0, bx1, by1]);
      }
    };
    o.glows = o.night ? [] : null;
    drawTownAmbient(fg, this.city, view, o, this.still ? 0 : t);
    if (this.opts.mode === 'choose') {
      const pulse = 0.5 + 0.5 * Math.sin(t / 300);
      fg.fillStyle = `rgba(255,236,160,${0.25 + pulse * 0.3})`;
      const v = townVisible(view);
      for (let y = v.y0; y <= v.y1; y++) for (let x = v.x0; x <= v.x1; x++) {
        const k = key(x, y);
        if (!PLAN.lots.has(k) || this.city.houses[k] || districtAt(x, y) > this.city.openDistricts) continue;
        fg.fillRect(x * TILE + 3, y * TILE - townElev(this.levelOf(x, y)) + 3, TILE - 6, TILE - 6);
      }
    }
    this.drawAvatars(fg, o.night, true);
    if (o.night && this.lit) {
      // Una sola passata di colore notturno su tutto, poi le luci fisse e i fari delle auto
      nightTint(fg, bw, bh);
      fg.save(); fg.setTransform(1, 0, 0, 1, 0, 0); fg.globalCompositeOperation = 'lighter'; fg.drawImage(this.nightLayer, 0, 0); fg.restore();
      fg.save(); fg.globalCompositeOperation = 'lighter';
      for (const [x, y] of o.glows) glow(fg, x, y, 16, 0.4, '255,240,180');
      fg.restore();
    }
    // Sullo schermo: ingrandimento a pixel interi, poi scritte e nuvole a piena risoluzione.
    const g = this.g;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.imageSmoothingEnabled = false;
    g.drawImage(this.frame, 0, 0, bw * q, bh * q);
    this.overlay(g, t, o);
    drawClouds(g, this.cam, this.vw, this.vh, this.dpr, this.still ? 0 : t, o.night);
  }

  // Etichette, selezione, nuvolette e scintille: a piena risoluzione, sopra i pixel.
  overlay(g, t, o) {
    this.worldTransform(g, this.cam.z * this.dpr);
    g.imageSmoothingEnabled = true;
    const z = this.cam.z;
    if (o.selected) {
      const [x, y] = parseKey(o.selected);
      g.save(); g.lineWidth = 2.5 / z; g.strokeStyle = this.city.houses[o.selected] ? '#ffd34d' : '#d4462f';
      g.strokeRect(x * TILE + 1, y * TILE - townElev(this.levelOf(x, y)) + 1, TILE - 2, TILE - 2); g.restore();
    }
    // Come in Habbo i nomi stanno sugli omini; sulle case solo su quella selezionata.
    for (const l of this.labels) if (l.slot === o.selected) label(g, l.x, l.y + 4, l.text, l.me, z);
    const k = this.avatarScale();
    for (const a of this.visibleAvatars()) {
      const [x, y] = this.avatarScreen(a);
      const head = y - 52 * k;
      if (a.me) {
        const bob = Math.sin(t / 300) * 1.5;
        const s = Math.max(k, 0.7);
        g.fillStyle = '#ffd34d'; g.strokeStyle = 'rgba(60,40,0,0.6)'; g.lineWidth = 1 / z;
        g.beginPath(); g.moveTo(x - 4 * s, head - 8 * s + bob); g.lineTo(x + 4 * s, head - 8 * s + bob); g.lineTo(x, head - 2 * s + bob); g.closePath(); g.fill(); g.stroke();
      }
      if (a.name && (a.me || this.scene || z * this.dpr >= 3)) label(g, x, y + 8 * k, a.name, a.me, z);
      if (a.bubble) {
        const age = t - a.bubble.t0;
        if (age > 6500) { a.bubble = null; continue; }
        bubble(g, x, head - 12 * k - Math.min(age / 900, 1) * 4, a.name, a.bubble.text, z, age > 5800 ? 1 - (age - 5800) / 700 : 1, this.view());
      }
    }
    for (const [slot, t0] of this.born) {
      const [x, y] = parseKey(slot);
      if (t - t0 < 1400) { const [cx, cy] = townCenter(x, y, this.levelOf(x, y)); sparkle(g, cx, cy - 30, t - t0); }
    }
  }
}

// Nomi a dimensione fissa sullo schermo, accorciati per non sovrapporsi.
function label(g, x, y, text, mine, z = 1) {
  g.save();
  const fs = 11 / z;
  g.font = `800 ${fs}px Nunito, "Trebuchet MS", sans-serif`;
  const maxW = 84 / z;
  let t = text;
  if (g.measureText(t).width > maxW) { while (t.length > 3 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1); t += '…'; }
  const w = g.measureText(t).width + fs, hgt = fs * 1.5;
  g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.roundRect(x - w / 2, y - hgt / 2 + 1 / z, w, hgt, 3 / z); g.fill();
  g.fillStyle = mine ? '#ffd34d' : 'rgba(255,255,255,0.95)'; g.beginPath(); g.roundRect(x - w / 2, y - hgt / 2, w, hgt, 3 / z); g.fill();
  g.strokeStyle = 'rgba(30,22,16,0.7)'; g.lineWidth = 1 / z; g.stroke();
  g.fillStyle = '#1f1f1f'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(t, x, y + fs * 0.05);
  g.restore();
}
// Nuvoletta alla Habbo: riquadro bianco con bordo nero, nome in grassetto e messaggio.
function bubble(g, x, y, name, text, z, alpha, view) {
  g.save();
  g.globalAlpha = Math.max(0, alpha);
  const fs = 12 / z;
  g.font = `800 ${fs}px Nunito, sans-serif`;
  const nw = g.measureText(name + ': ').width;
  g.font = `600 ${fs}px Nunito, sans-serif`;
  let t = text;
  const maxW = Math.min(220 / z, view ? view.R - view.L - 16 / z : Infinity);
  if (nw + g.measureText(t).width > maxW) { while (t.length > 2 && nw + g.measureText(t + '…').width > maxW) t = t.slice(0, -1); t += '…'; }
  const w = nw + g.measureText(t).width + fs * 1.4, hgt = fs * 2;
  // La nuvoletta resta dentro lo schermo; la punta continua a indicare chi parla.
  const bx = view ? Math.max(view.L + 8 / z, Math.min(view.R - 8 / z - w, x - w / 2)) : x - w / 2, by = y - hgt;
  g.fillStyle = '#ffffff'; g.strokeStyle = '#1f1f1f'; g.lineWidth = 1.5 / z;
  g.beginPath(); g.roundRect(bx, by, w, hgt, 5 / z); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x - 4 / z, by + hgt - 0.8 / z); g.lineTo(x, by + hgt + 6 / z); g.lineTo(x + 4 / z, by + hgt - 0.8 / z); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(x - 4 / z, by + hgt); g.lineTo(x, by + hgt + 6 / z); g.lineTo(x + 4 / z, by + hgt); g.stroke();
  g.textBaseline = 'middle'; g.fillStyle = '#1f1f1f';
  g.font = `800 ${fs}px Nunito, sans-serif`; g.fillText(name + ':', bx + fs * 0.7, by + hgt / 2);
  g.font = `600 ${fs}px Nunito, sans-serif`; g.fillText(t, bx + fs * 0.7 + nw, by + hgt / 2);
  g.restore();
}
function sparkle(g, x, y, age) {
  const p = age / 1400;
  g.save(); g.globalAlpha = 1 - p;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + p, r = 8 + p * 30;
    g.fillStyle = i % 2 ? '#fff3b0' : '#ffffff';
    g.fillRect(x + Math.cos(a) * r - 1.5, y + Math.sin(a) * r * 0.6 - 1.5, 3, 3);
  }
  g.restore();
}
function easeOutBack(p) { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }

/* Anteprima della casa e cartoline per Instagram -------------------------- */

function drawPreview(canvas, style, { cantiere = false } = {}) {
  const g = canvas.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#d7eef7'); sky.addColorStop(1, '#b6dcea');
  g.fillStyle = sky; g.fillRect(0, 0, canvas.width, canvas.height);
  const s = Math.max(1, Math.floor(Math.min(canvas.width / 120, (canvas.height * 0.74) / 86))); // la casa intera, tetto compreso
  g.imageSmoothingEnabled = false;
  g.setTransform(s, 0, 0, s, canvas.width / 2, canvas.height * 0.78);
  // Il giardino, il marciapiede davanti e la casa vista di fronte
  g.fillStyle = '#86c457'; g.fillRect(-56, -52, 112, 52);
  for (let k = 0; k < 60; k++) { g.fillStyle = k % 2 ? 'rgba(40,90,25,0.35)' : 'rgba(255,255,210,0.3)'; g.fillRect(-54 + ih(k, 1, 7) * 106, -50 + ih(k, 2, 7) * 48, 1, 2); }
  g.fillStyle = '#ddd4c2'; g.fillRect(-56, 0, 112, 6);
  g.fillStyle = '#a39b8e'; g.fillRect(-56, 6, 112, 14);
  drawHouse3(g, style, 0, -1, { cantiere });
}

async function renderPoster(city, news, format = 'post') {
  try { await Promise.all([document.fonts.load('400 80px "Abril Fatface"'), document.fonts.load('700 40px Nunito'), document.fonts.load('600 40px Fredoka')]); } catch { /* caratteri di riserva */ }
  const Wp = 1080, Hp = format === 'story' ? 1920 : 1350;
  const cv = document.createElement('canvas');
  cv.width = Wp; cv.height = Hp;
  const g = cv.getContext('2d');
  const ink = '#1f2a26', red = '#b8322a';
  g.fillStyle = '#f6f1e3'; g.fillRect(0, 0, Wp, Hp);
  const top = format === 'story' ? 150 : 60;
  g.fillStyle = ink; g.textAlign = 'center';
  g.font = '400 96px "Abril Fatface", Georgia, serif';
  g.fillText(CITY.toUpperCase(), Wp / 2, top + 90);
  g.fillStyle = red; g.fillRect(70, top + 118, Wp - 140, 6);
  g.fillStyle = ink; g.font = '700 30px Nunito, sans-serif';
  const date = new Date(news.at).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  g.fillText(`${PAPER.toUpperCase()}  ·  ${date.toUpperCase()}`, Wp / 2, top + 166);
  g.fillRect(70, top + 190, Wp - 140, 2);
  const mapY = top + 220, mapH = format === 'story' ? 900 : 640, mapX = 70, mapW = Wp - 140;
  const [fx, fy] = news.slot ? parseKey(news.slot) : PIAZZA_DECOR.fountain;
  const z = 2;
  const [cx, cy] = townCenter(fx, fy, levelAt(fx, fy, city.openDistricts));
  g.save();
  g.beginPath(); g.rect(mapX, mapY, mapW, mapH); g.clip();
  const sky = g.createLinearGradient(0, mapY, 0, mapY + mapH);
  sky.addColorStop(0, '#c7e7f2'); sky.addColorStop(1, '#9ccbe0');
  g.fillStyle = sky; g.fillRect(mapX, mapY, mapW, mapH);
  g.setTransform(z, 0, 0, z, mapX + mapW / 2 - cx * z, mapY + mapH / 2 - (cy - 10) * z);
  const view = { L: cx - mapW / 2 / z, R: cx + mapW / 2 / z, T: cy - mapH / 2 / z, B: cy + mapH / 2 / z };
  const o = { selected: null, t: 0, detail: true };
  drawTown(g, city, view, o);
  drawTownAmbient(g, city, view, o, 4200);
  g.restore();
  g.strokeStyle = ink; g.lineWidth = 4; g.strokeRect(mapX, mapY, mapW, mapH);
  const f = formatNews(news, city);
  g.textAlign = 'left'; g.fillStyle = ink;
  g.font = '400 64px "Abril Fatface", Georgia, serif';
  let y = wrap(g, f.title, 70, mapY + mapH + 100, Wp - 140, 74);
  g.font = '600 36px Nunito, sans-serif'; g.fillStyle = '#3b4642';
  y = wrap(g, f.text, 70, y + 30, Wp - 140, 50);
  g.fillStyle = red; g.fillRect(0, Hp - (format === 'story' ? 210 : 110), Wp, format === 'story' ? 210 : 110);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = '700 38px Fredoka, Nunito, sans-serif';
  g.fillText('Vieni ad abitare qui · link in bio', Wp / 2, Hp - (format === 'story' ? 130 : 45));
  return cv;
}
function wrap(g, text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t;
  }
  if (line) g.fillText(line, x, y);
  return y;
}

// ---- store.js ----
// Due archivi con la stessa interfaccia:
// - RemoteStore: il server vero (server/server.js), una sola città per tutti.
// - LocalStore: demo nel browser. La città vive solo in questo browser e le email sono finte.


class Base {
  constructor() { this.listeners = new Set(); this.city = null; this.me = null; this.online = new Set(); this.avatars = {}; }
  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit(kind, data) { for (const fn of this.listeners) fn(kind, data); }
}

/* Server ------------------------------------------------------------------ */

class RemoteStore extends Base {
  constructor() { super(); this.mode = 'server'; }

  async call(method, p, body) {
    let res;
    try {
      res = await fetch(p, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-VI': '1' }, body: body ? JSON.stringify(body) : undefined });
    } catch {
      throw new DomainError('network', 'Connessione assente: controlla internet e riprova.');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new DomainError(data.code || 'validation', data.error || 'Qualcosa non ha funzionato. Riprova.');
    return data;
  }

  async init() {
    const s = await this.call('GET', '/api/session');
    this.me = s.me;
    this.devMail = s.devMail;
    await this.refresh();
    this.listen();
  }
  async refresh() {
    const d = await this.call('GET', '/api/city');
    this.take(d);
  }
  take(d) {
    if (d.city) this.city = d.city;
    if (d.online) this.online = new Set(d.online);
    if (d.avatars) this.avatars = d.avatars;
    this.emit('city');
  }
  listen() {
    this.es?.close();
    this.es = new EventSource('/api/events');
    this.es.addEventListener('city', (e) => {
      const d = JSON.parse(e.data);
      this.online = new Set(d.online);
      if (!this.city || d.rev !== this.city.rev) this.refresh().catch(() => {});
      else this.emit('online');
    });
    this.es.addEventListener('say', (e) => this.emit('say', JSON.parse(e.data)));
    this.es.addEventListener('act', (e) => this.emit('act', JSON.parse(e.data)));
    this.es.addEventListener('move', (e) => {
      const d = JSON.parse(e.data);
      this.avatars[d.id] = [d.x, d.y, d.room ?? null];
      this.emit('move', d);
    });
  }
  async afterAuth(d) {
    this.me = d.me ?? (await this.call('GET', '/api/session')).me;
    await this.refresh();
    this.listen();
    this.emit('me');
  }

  async register(form) { const d = await this.call('POST', '/api/register', form); await this.afterAuth(d); return d; }
  async confirm(token) { const d = await this.call('POST', '/api/confirm', { token }); await this.afterAuth(d); return d; }
  resend() { return this.call('POST', '/api/resend'); }
  async login(login, password) { const d = await this.call('POST', '/api/login', { login, password }); await this.afterAuth(d); return d; }
  async logout() { await this.call('POST', '/api/logout'); this.me = null; await this.refresh(); this.listen(); this.emit('me'); }
  requestReset(email) { return this.call('POST', '/api/reset/request', { email }); }
  async resetPassword(token, password) { const d = await this.call('POST', '/api/reset', { token, password }); await this.afterAuth({}); return d; }
  async op(op) { const d = await this.call('POST', '/api/op', { op }); this.take(d); return d.result; }
  exportData() { return this.call('GET', '/api/me/export'); }
  async deleteAccount(password) { await this.call('POST', '/api/me/delete', { password }); this.me = null; await this.refresh(); this.emit('me'); }
  admin() { return this.call('GET', '/api/admin'); }
  // Il proprio omino: si muove subito qui, il server lo racconta agli altri.
  move(x, y, room = null) {
    if (!this.me) return;
    this.avatars[this.me.id] = [x, y, room];
    this.emit('move', { id: this.me.id, x, y, room });
    this.call('POST', '/api/move', { x, y, room }).catch(() => {});
  }
  say(text) { checkSay(text); return this.call('POST', '/api/say', { text }); }
  act(act) { return this.call('POST', '/api/act', { act }).catch(() => {}); }
}

/* Demo nel browser ---------------------------------------------------------- */

const KEY = 'virtual-italy-demo-v1';
const localBox = () => { try { return window.localStorage; } catch { return null; } };
function load() { try { return JSON.parse(localBox()?.getItem(KEY) || 'null'); } catch { return null; } }
function save(v) { try { localBox()?.setItem(KEY, JSON.stringify(v)); } catch { /* demo senza memoria */ } }

class LocalStore extends Base {
  constructor() { super(); this.mode = 'demo'; this.devMail = true; }

  async init() {
    const saved = load();
    this.db = saved?.version === 1 ? saved : this.fresh();
    this.me = this.db.session ? this.meView(this.db.session) : null;
    // A settimana finita il giornale annuncia la Casa della settimana.
    if (applyOp(this.db.state, { type: 'weekly' }, { system: true, now: Date.now() }).result.changed) this.apply({ type: 'weekly' }, { system: true });
    this.publish();
    // Qualche abitante finto entra ed esce, per vedere le finestre accese di sera, e passeggia.
    this.timer = setInterval(() => this.shuffleOnline(), 15000);
    this.walker = setInterval(() => this.wander(), 2200);
  }
  fresh() {
    const now = Date.now();
    const state = seedResidents(emptyState(now - 6 * 86400000), 14, now);
    // Qualche cuore già dato in settimana, così la classifica delle case non parte vuota.
    const ids = Object.keys(state.residents);
    ids.forEach((owner, i) => {
      const n = (i * 5) % 4;
      for (let k = 1; k <= n; k++) (state.hearts[owner] ||= {})[ids[(i + k) % ids.length]] = now - k * 3600000;
    });
    // Case dei vicini già arredate, così le visite hanno qualcosa da vedere.
    const LAYOUTS = [
      [['tappeto', 2, 2, 0, 1], ['divano', 2, 1, 0, 1], ['tavolino', 3, 3], ['tv', 3, 5], ['lampada', 0, 0], ['libreria', 4, 0], ['pianta', 7, 7], ['letto', 7, 1]],
      [['tavolo', 3, 3], ['sedia', 3, 2, 0, 2], ['sedia', 4, 2, 0, 2], ['cucina', 5, 0], ['frigo', 7, 0], ['vaso', 3, 4, 0, 5], ['pianta', 0, 0], ['camino', 1, 7]],
      [['letto', 6, 2, 0, 4], ['armadio', 7, 0], ['scrivania', 2, 0], ['sedia', 2, 1, 0, 6], ['tappeto', 3, 4, 0, 3], ['pouf', 4, 5, 0, 5], ['acquario', 0, 0], ['jukebox', 7, 7]],
    ];
    const floors = ['parquet', 'piastrelle', 'cotto', 'marmo', 'moquette'];
    Object.values(state.houses).forEach((h, i) => {
      if (h.status !== 'casa') return;
      state.rooms[h.residentId] = {
        floor: floors[i % floors.length], wall: ['#efe6d2', '#f3d6c3', '#d7e6ef', '#dcebd2', '#f4e7b8'][i % 5], access: 'tutti',
        items: LAYOUTS[i % LAYOUTS.length].map(([t, x, y, r = 0, c = 0], k) => ({ uid: `demo${i}-${k}`, t, x, y, r, c })),
      };
    });
    return { version: 1, state, accounts: {}, tokens: {}, session: null, inbox: [] };
  }
  persist() { save(this.db); }
  meView(id) {
    const a = this.db.accounts[id];
    if (!a) return null;
    return { id, email: a.email, username: this.db.state.residents[id]?.username, emailConfirmed: a.confirmed, admin: true };
  }
  shuffleOnline() {
    const ids = Object.keys(this.db.state.residents).filter((id) => id.startsWith(DEMO_TAG));
    this.online = new Set(ids.filter((id, i) => (i * 7 + Math.floor(Date.now() / 15000)) % 3 === 0));
    if (this.me) this.online.add(this.me.id);
    for (const id of this.online) if (!this.avatars[id]) this.avatars[id] = spawnPoint(this.db.state, id);
    for (const id of Object.keys(this.avatars)) if (!this.online.has(id)) delete this.avatars[id];
    this.emit('online');
  }
  publish() {
    this.city = publicView(this.db.state, this.me?.id, true);
    if (!this.online.size) this.shuffleOnline();
    this.emit('city');
  }
  apply(op, ctx) {
    const r = applyOp(this.db.state, op, { now: Date.now(), ...ctx });
    this.db.state = r.state;
    this.persist();
    this.publish();
    return r.result;
  }
  mail(to, subject, body, action) {
    this.db.inbox.unshift({ id: uid('m'), to, subject, body, action, at: Date.now() });
    this.db.inbox.length = Math.min(this.db.inbox.length, 30);
  }

  async register(f) {
    if (f.website || Number(f.elapsed) < 2500) throw new DomainError('validation', 'Non siamo riusciti a completare l\'iscrizione: riprova tra qualche secondo.');
    const email = checkEmail(f.email);
    const username = checkUsername(f.username);
    checkPassword(f.password);
    if (!f.accept) throw new DomainError('validation', 'Per iscriverti devi accettare il regolamento e l\'informativa privacy.');
    if (!f.adult) throw new DomainError('validation', 'Per iscriverti devi avere almeno 14 anni.');
    if (Object.values(this.db.accounts).some((a) => a.email === email)) throw new DomainError('validation', 'Esiste già un abitante con questa email: prova ad accedere.');
    const id = 'u_' + uid('');
    this.apply({ type: 'join', id, username }, { system: true });
    this.db.accounts[id] = { email, password: f.password, confirmed: false, source: f.source || 'diretto', createdAt: Date.now() };
    const token = uid('t');
    this.db.tokens[token] = { id, kind: 'confirm' };
    this.mail(email, 'Conferma la tua casa a Virtual-Italy', `Ciao ${username}, per finire la tua casa conferma l'indirizzo email entro 24 ore.`, { kind: 'confirm', token });
    this.db.session = id;
    this.me = this.meView(id);
    this.persist();
    this.publish();
    this.emit('me');
    return { ok: true, devToken: token };
  }
  async confirm(token) {
    const t = this.db.tokens[token];
    if (!t || t.kind !== 'confirm') throw new DomainError('validation', 'Il link di conferma non è valido o è già stato usato.');
    delete this.db.tokens[token];
    this.db.accounts[t.id].confirmed = true;
    const r = this.apply({ type: 'confirm', id: t.id }, { system: true });
    this.db.session = t.id;
    this.me = this.meView(t.id);
    this.persist();
    this.emit('me');
    return { ok: true, number: r.number };
  }
  async resend() {
    const id = this.me?.id;
    const token = uid('t');
    this.db.tokens[token] = { id, kind: 'confirm' };
    this.mail(this.me.email, 'Conferma la tua casa a Virtual-Italy', 'Nuovo link di conferma.', { kind: 'confirm', token });
    this.persist();
    return { ok: true, devToken: token };
  }
  async login(login, password) {
    const l = String(login || '').trim().toLowerCase();
    const id = Object.keys(this.db.accounts).find((k) => this.db.accounts[k].email === l || usernameKey(this.db.state.residents[k]?.username || '') === l);
    if (!id || this.db.accounts[id].password !== password) throw new DomainError('auth', 'Email, nome utente o password errati.');
    this.db.session = id;
    this.me = this.meView(id);
    this.persist();
    this.publish();
    this.emit('me');
    return { ok: true };
  }
  async logout() { this.db.session = null; this.me = null; this.persist(); this.publish(); this.emit('me'); }
  async requestReset(email) {
    const id = Object.keys(this.db.accounts).find((k) => this.db.accounts[k].email === String(email).trim().toLowerCase());
    let token;
    if (id) {
      token = uid('t');
      this.db.tokens[token] = { id, kind: 'reset' };
      this.mail(this.db.accounts[id].email, 'Nuova password per Virtual-Italy', 'Apri il link per scegliere una nuova password.', { kind: 'reset', token });
      this.persist();
    }
    return { ok: true, devToken: token };
  }
  async resetPassword(token, password) {
    checkPassword(password);
    const t = this.db.tokens[token];
    if (!t || t.kind !== 'reset') throw new DomainError('validation', 'Il link non è valido o è scaduto: chiedine uno nuovo.');
    delete this.db.tokens[token];
    this.db.accounts[t.id].password = password;
    return this.login(this.db.accounts[t.id].email, password);
  }
  async op(op) {
    if (op.type === 'leave') throw new DomainError('validation', 'Per cancellare l\'account usa le impostazioni.');
    return this.apply(op, { user: { id: this.me?.id, admin: true } });
  }
  async exportData() {
    const id = this.me.id, a = this.db.accounts[id], s = this.db.state;
    return { esportatoIl: new Date().toISOString(), account: { email: a.email, nomeUtente: s.residents[id]?.username, provenienza: a.source },
      abitante: s.residents[id], casa: residentHouse(s, id), amici: friendsOf(s, id).map((x) => s.residents[x]?.username) };
  }
  async deleteAccount(password) {
    const id = this.me.id;
    if (this.db.accounts[id].password !== password) throw new DomainError('validation', 'La password non è corretta.');
    this.apply({ type: 'leave', id }, { system: true });
    delete this.db.accounts[id];
    this.db.session = null;
    this.me = null;
    this.persist();
    this.publish();
    this.emit('me');
  }
  async admin() {
    const sources = {};
    for (const a of Object.values(this.db.accounts)) {
      const s = (sources[a.source] ||= { source: a.source, n: 0, confirmed: 0 });
      s.n++; if (a.confirmed) s.confirmed++;
    }
    return { sources: Object.values(sources), outbox: this.db.inbox.map((m) => ({ to: m.to, subject: m.subject, body: m.body, at: m.at })), mailConfigured: false };
  }

  move(x, y, room = null) {
    if (!this.me) return;
    this.avatars[this.me.id] = [x, y, room];
    this.emit('move', { id: this.me.id, x, y, room });
  }
  async say(text) { checkSay(text); return { ok: true }; }
  async act() { return { ok: true }; }
  // Gli abitanti finti in città fanno due passi qua e là, e ogni tanto salutano.
  wander() {
    if (Math.random() < 0.18) {
      const talkers = [...this.online].filter((x) => x.startsWith(DEMO_TAG) && this.avatars[x]);
      if (talkers.length) this.emit('say', { id: talkers[Math.floor(Math.random() * talkers.length)], text: SAY_PRESETS[Math.floor(Math.random() * SAY_PRESETS.length)] });
    }
    const fakes = [...this.online].filter((x) => x.startsWith(DEMO_TAG) && this.avatars[x] && !this.avatars[x][2]);
    if (fakes.length && Math.random() < 0.08) this.emit('act', { id: fakes[Math.floor(Math.random() * fakes.length)], act: Math.random() < 0.5 ? 'saluta' : 'balla' });
    // Ogni tanto un vicino passa da casa tua e firma il libro degli ospiti.
    if (this.me && Math.random() < 0.03) {
      const guest = fakes[Math.floor(Math.random() * fakes.length)];
      if (guest) {
        try { this.apply({ type: 'sign', owner: this.me.id, text: ['Bella casa!', 'Che bel salotto', 'Passavo di qui 👋', 'Torno presto!'][Math.floor(Math.random() * 4)] }, { user: { id: guest } }); } catch { /* casa non finita o già firmato oggi */ }
      }
    }
    const s = this.db.state;
    const ids = [...this.online].filter((id) => id.startsWith(DEMO_TAG) && this.avatars[id] && !this.avatars[id][2]);
    if (!ids.length) return;
    const id = ids[Math.floor(Math.random() * ids.length)];
    const [x, y] = this.avatars[id];
    for (let i = 0; i < 12; i++) {
      const tx = Math.max(0, Math.min(W - 1, x + Math.round((Math.random() - 0.5) * 14)));
      const ty = Math.max(0, Math.min(SEA_Y, y + Math.round((Math.random() - 0.5) * 10)));
      const p = walkPath(s, [x, y], [tx, ty], 1500);
      if (p && p.length > 2 && p.length < 22) { this.avatars[id] = [tx, ty]; this.emit('move', { id, x: tx, y: ty }); return; }
    }
  }

  // Solo demo: la casella email finta, nuovi abitanti finti, ripartenza.
  inbox() { return this.db.inbox; }
  addResidents(n) {
    this.db.state = seedResidents(this.db.state, n, Date.now(), Date.now());
    this.persist();
    this.publish();
  }
  knock() {
    // Un vicino finto bussa alla porta dell'utente della demo.
    if (!this.me) return false;
    const s = this.db.state;
    const from = Object.keys(s.residents).find((id) => id.startsWith(DEMO_TAG) && !s.requests.some((q) => q.from === id) && !s.friendships.some((f) => f.a === id || f.b === id));
    if (!from) return false;
    this.apply({ type: 'friendRequest', to: this.me.id }, { user: { id: from } });
    return true;
  }
  reset() { this.db = this.fresh(); this.me = null; this.persist(); this.publish(); this.emit('me'); }
}

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

function toast(text, kind = 'ok') {
  const el = h('div', { class: `toast ${kind}`, role: 'status' }, text);
  const box = $('#toasts');
  box.append(el);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => el.classList.add('out'), kind === 'err' ? 4200 : 2800);
  setTimeout(() => el.remove(), kind === 'err' ? 4700 : 3300);
}
const errText = (e) => (e instanceof DomainError || e?.message ? e.message : 'Qualcosa non ha funzionato. Riprova.');

async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(errText(e), 'err'); return undefined; } finally { if (btn) btn.disabled = false; }
}

function renderTicker() {

  const items = city.news.slice(0, 5);
  if (!items.length) return;
  ui.tick = ((ui.tick ?? -1) + 1) % items.length;

  void el.offsetWidth;
  el.textContent = f.title;
  el.classList.add('in');

  const city = store.city;
  if (!city) return;
  const built = builtCount(city);
  $('#count').textContent = `${built} ${built === 1 ? 'abitante' : 'abitanti'} · ${city.openDistricts} ${city.openDistricts === 1 ? 'quartiere' : 'quartieri'}`;
  if (ui.newsTop !== city.news[0]?.id) { ui.newsTop = city.news[0]?.id; ui.tick = -1; renderTicker(); }

  const badge = $('#mail-badge');
  badge.hidden = !incoming;
  badge.textContent = incoming;
  $('#btn-mail').hidden = !mine;
  $('#btn-missions').hidden = !mine;

    mode: ui.mode, meId: mine?.id || null, night, online: store.online,

    notice.hidden = false;

      h('span', { class: 'notice-ico' }, icon('mail')),

        DEMO ? h('button', { class: 'btn small primary', onclick: openDemoInbox }, 'Apri l\'email') : null,
        h('button', { class: 'btn small', onclick: (e) => run(e.currentTarget, async () => { const r = await store.resend(); devLinkToast(r); toast('Ti abbiamo mandato un nuovo link.'); }) }, 'Invia di nuovo')));
  } else notice.hidden = true;

  // Barra in basso (non si tocca mentre si sta scrivendo un messaggio).

      h('span', { class: 'goal-ico' }, icon('pin')),

// Ad ogni aggiornamento: badge delle missioni, missioni appena completate, nuove firme in casa.
function watchProgress(city, id) {
  const st = missionStatus(city, id, Date.now());
  const ready = (st.welcomeReady ? 1 : 0) + (st.daily.done && !st.daily.claimed ? 1 : 0);
  const mb = $('#missions-badge');
  mb.hidden = !ready; mb.textContent = ready ? '!' : '';
  const done = new Set([...st.welcome.filter((m) => m.done).map((m) => 'w:' + m.id), ...(st.daily.done ? ['d:' + dayKey(Date.now())] : [])]);
  if (ui.missionsSeen && ui.missionsFor === id) {
    for (const k of done) {
      if (ui.missionsSeen.has(k)) continue;
      const label = k.startsWith('w:') ? st.welcome.find((m) => 'w:' + m.id === k).label : st.daily.label;
      toast(`Missione completata: ${label} ✓`);
    }
  }
  ui.missionsSeen = done; ui.missionsFor = id;
  const gb = city.guestbook?.[id] || [];
  const last = gb[gb.length - 1];
  if (ui.gbLast && last && last.at > ui.gbLast && ui.room !== id) toast(`${city.residents[last.by]?.username || 'Un vicino'} ha firmato il tuo libro degli ospiti${last.text ? `: “${last.text}”` : ''}`);
  ui.gbLast = last?.at || ui.gbLast || 1;
}
// Segna una volta al giorno una cosa fatta con l'omino (serve alle missioni).
function markOnce(what) {
  const mine = me();
  if (!mine || !store.city.residents[mine.id]) return;
  const t = progressOf(store.city, mine.id).marks[what];
  if (t && dayKey(t) === dayKey(Date.now())) return;
  store.op({ type: 'mark', what }).catch(() => {});
}
function openMissions() {
  const mine = me();
  if (!mine) return openLogin();
  const city = store.city;
  const st = missionStatus(city, mine.id, Date.now());
  const claim = (what) => (e) => run(e.currentTarget, async () => {
    const r = await store.op({ type: 'claim', what });
    if (r.prize) toast(`Premio: ${furniById(r.prize).label}! La trovi in casa, nel pannello Arreda.`);
    else toast(r.streak > 1 ? `Fatto! Sono ${r.streak} giorni di fila 🔥` : 'Fatto! Torna domani per la prossima missione 🔥');
    openMissions(); update();
  });
  const n = st.welcome.filter((m) => m.done).length;
  const welcome = st.welcomeClaimed ? null : h('section', { class: 'missions' },
    h('div', { class: 'missions-head' }, h('h3', {}, 'Benvenuto in città'), h('span', { class: 'tag' }, `${n}/${st.welcome.length}`)),
    h('ul', { class: 'mission-list' }, st.welcome.map((m) => h('li', { class: 'mission' + (m.done ? ' done' : '') },
      h('span', { class: 'mission-tick', 'aria-hidden': 'true' }, m.done ? '✓' : ''),
      h('span', { class: 'mission-body' }, h('strong', {}, m.label), m.done ? null : h('span', { class: 'small' }, m.hint))))),
    h('p', { class: 'small' }, `Premio finale: ${furniById(WELCOME_PRIZE).label.toLowerCase()} da mettere in casa, solo per chi le completa tutte.`),
    st.welcomeReady ? h('button', { class: 'btn primary big', onclick: claim('welcome') }, 'Ritira il premio') : null);
  const daily = h('section', { class: 'missions daily' },
    h('div', { class: 'missions-head' }, h('h3', {}, 'Missione del giorno'), h('span', { class: 'tag gold' }, `🔥 ${st.streak} ${st.streak === 1 ? 'giorno' : 'giorni'} di fila`)),
    h('div', { class: 'mission' + (st.daily.done ? ' done' : '') }, h('span', { class: 'mission-tick', 'aria-hidden': 'true' }, st.daily.done ? '✓' : ''), h('span', { class: 'mission-body' }, h('strong', {}, st.daily.label))),
    st.daily.claimed ? h('p', { class: 'small' }, 'Fatta! Domani ne arriva un\'altra: non perdere la serie.')
      : st.daily.done ? h('button', { class: 'btn primary', onclick: claim('daily') }, 'Segna come fatta')
        : h('p', { class: 'small' }, 'Ogni giorno una missione nuova, uguale per tutti. Completale di fila per allungare la serie.'));
  openSheet('Missioni', h('div', { class: 'stack' }, welcome, daily, st.welcomeClaimed ? h('p', { class: 'small' }, 'Missioni di benvenuto completate: sei un abitante a tutti gli effetti!') : null));
}

async function setRide(id) {

  if (ok) { syncAvatars(); update(); }
}
// Sedersi: si cammina fino alla seduta, poi ci si siede.
function sitOn(x, y, room = null) {
  const mine = me();
  if (!mine || !map.avatarOf(mine.id)) return false;
  if (!map.walk(mine.id, x, y, room)) return false;
  store.move(x, y, room);
  map.act(mine.id, 'siedi');

// Cosa arriva al prossimo traguardo, detto in breve per la barra in basso.
function goalText(built, target) {
  const what = target === 25 ? 'l\'acqua nella fontana' : `quota ${target} abitanti`;
  const left = Math.max(0, target - built);
  return left ? `Ancora ${left} ${left === 1 ? 'abitante' : 'abitanti'} per ${what}` : 'Traguardo raggiunto!';
}

// Barra per parlare, come in Habbo: quello che scrivi compare in una nuvoletta sopra il tuo omino.
function chatBar() {
  const input = h('input', { id: 'chat-input', class: 'chat-input', maxlength: SAY_MAX, placeholder: 'Scrivi qualcosa…', autocomplete: 'off', enterkeyhint: 'send', 'aria-label': 'Messaggio da dire' });

    h('div', { class: 'sheet-body' }, body));
  sheet.setAttribute('aria-labelledby', 'sheet-title');

function neighbours(slot, radius = 3) {
  const [x, y] = parseKey(slot);
  return Object.values(store.city.houses).filter((hh) => {
    const [hx, hy] = parseKey(hh.slot);
    return hh.slot !== slot && Math.abs(hx - x) <= radius && Math.abs(hy - y) <= radius;
  }).map((hh) => store.city.residents[hh.residentId]).filter(Boolean);
}

function openLot(slot) {
  map.set({ selected: slot });
  const d = districtById(districtAt(...parseKey(slot)));
  const near = neighbours(slot);
  const canBuild = me() && !myHouse();
  openSheet(`Lotto libero · ${d.name}`, h('div', { class: 'stack' },
    h('p', {}, near.length ? 'I tuoi vicini sarebbero:' : 'Qui intorno non abita ancora nessuno: saresti il primo della via.'),
    near.length ? h('ul', { class: 'chips' }, near.slice(0, 12).map((r) => h('li', { class: 'chip' }, r.username))) : null,
    canBuild ? h('button', { class: 'btn primary big', onclick: () => openBuild(slot) }, 'Costruisci qui')
      : !me() ? h('button', { class: 'btn primary big', onclick: openRegister }, 'Iscriviti per costruire qui')
        : h('p', { class: 'small' }, 'Hai già una casa: questo lotto resta per un nuovo abitante.')),
    { onClose: () => { if (ui.mode !== 'choose') map.set({ selected: null }); } });
}

function swatches(name, list, value, onPick, colorOf) {
  return h('div', { class: 'swatches', role: 'radiogroup' }, list.map((o) => h('button', {
    type: 'button', class: 'swatch' + (o.id === value ? ' on' : '') + (colorOf ? ' color' : ''), role: 'radio', 'aria-checked': String(o.id === value),
    'aria-label': o.label, title: o.label, style: colorOf ? `--sw:${o.color}` : null,
    onclick: () => onPick(o.id),
  }, colorOf ? null : o.label)));
}

function openBuild(slot, { restyle = false } = {}) {
  const current = restyle ? myHouse().style : makeStyle(slot);
  const choice = { roof: current.roof, door: current.door, garden: current.garden, deco: current.deco };
  const preview = h('canvas', { class: 'preview', width: 640, height: 480, 'aria-label': 'Anteprima della casa' });
  const groups = h('div', { class: 'stack' });
  const paint = () => {
    drawPreview(preview, makeStyle(slot, choice));
    groups.replaceChildren(
      h('div', {}, h('p', { class: 'field-label' }, 'Tetto'), swatches('roof', ROOFS, choice.roof, (v) => { choice.roof = v; paint(); }, true)),
      h('div', {}, h('p', { class: 'field-label' }, 'Porta'), swatches('door', DOORS, choice.door, (v) => { choice.door = v; paint(); }, true)),
      h('div', {}, h('p', { class: 'field-label' }, 'Giardino'), swatches('garden', GARDENS, choice.garden, (v) => { choice.garden = v; paint(); })),
      h('div', {}, h('p', { class: 'field-label' }, 'Davanti casa'), swatches('deco', DECOS, choice.deco, (v) => { choice.deco = v; paint(); })));
  };
  paint();
  const d = districtById(districtAt(...parseKey(slot)));
  const btn = h('button', { class: 'btn primary big', onclick: (e) => run(e.currentTarget, async () => {
    if (restyle) {
      await store.op({ type: 'restyle', style: choice });
      closeSheet();
      toast('Casa rinnovata');
      return;
    }
    const r = await store.op({ type: 'chooseSlot', slot, style: choice });
    ui.mode = 'browse';
    closeSheet();
    map.focus(slot, 2);
    if (map.avatarOf(me().id)) walkTo(...frontOf(store.city, slot));
    if (r.status === 'casa') toast(`Benvenuto a ${CITY}, abitante n°${myResident().number}!`);
    else toast('Cantiere aperto! Conferma l\'email per finire la casa.');
    update();
  }) }, restyle ? 'Salva le modifiche' : 'Costruisci la casa');
  openSheet(restyle ? 'Rinnova la casa' : 'La tua casa', h('div', { class: 'build' },
    h('div', { class: 'build-preview' }, preview, h('p', { class: 'small' }, `Le forme e i muri seguono lo stile del quartiere ${d.name}.`)),
    h('div', { class: 'stack' }, groups, btn)), { wide: true });
}

/* Editor del personaggio ------------------------------------------------- */

function openCharacter({ first = false } = {}) {
  const r = myResident();
  if (!r) return openLogin();
  const look = cleanLook(r.look, r.username);
  const preview = h('canvas', { class: 'avatar-preview', width: 360, height: 360, 'aria-label': 'Anteprima del tuo personaggio' });
  const groups = h('div', { class: 'stack' });
  // L'omino cammina sul posto e si gira nelle quattro direzioni.
  const t0 = performance.now();
  const animate = (t) => {
    if (!preview.isConnected) return;
    drawAvatarPreview(preview, avatarLook(r.username, look), t - t0);
    requestAnimationFrame(animate);
  };
  const colorRow = (label, key, list) => h('div', {}, h('p', { class: 'field-label' }, label),
    h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': label }, list.map((c, i) => h('button', {
      type: 'button', class: 'swatch color' + (look[key] === i ? ' on' : ''), style: `--sw:${c}`, role: 'radio',
      'aria-checked': String(look[key] === i), 'aria-label': `${label} ${i + 1}`, onclick: () => { look[key] = i; paint(); },
    }))));
  const idRow = (label, key, list) => h('div', {}, h('p', { class: 'field-label' }, label),
    h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': label }, list.map((o) => h('button', {
      type: 'button', class: 'swatch' + (look[key] === o.id ? ' on' : ''), role: 'radio', 'aria-checked': String(look[key] === o.id),
      onclick: () => { look[key] = o.id; paint(); },
    }, o.label))));
  // Nei vestiti compare solo quello che si ha: i capi base più quelli presi alla Sartoria.
  const owned = (slot) => WEAR.filter((w) => w.slot === slot && ownsWear(store.city, r.id, w.id));
  const paint = () => groups.replaceChildren(
    colorRow('Carnagione', 'skin', LOOK.skin),
    idRow('Pettinatura', 'style', LOOK.style),
    colorRow('Colore dei capelli', 'hair', LOOK.hair),
    idRow('Maglia', 'top', owned('top')),
    colorRow('Colore della maglia', 'shirt', LOOK.shirt),
    idRow('Sotto', 'bottom', owned('bottom')),
    colorRow('Colore di pantaloni e gonne', 'pants', LOOK.pants),
    idRow('Accessorio', 'extra', owned('extra')),
    WEAR.some((w) => !ownsWear(store.city, r.id, w.id)) ? h('p', { class: 'small' }, 'Altri vestiti e accessori ti aspettano alla Sartoria Moda, accanto alla piazza.') : null);
  const shuffle = () => {
    const pick = (n) => Math.floor(Math.random() * n);
    const any = (list) => list[pick(list.length)].id;
    Object.assign(look, { skin: pick(LOOK.skin.length), hair: pick(LOOK.hair.length), style: LOOK.style[pick(LOOK.style.length)].id,
      shirt: pick(LOOK.shirt.length), pants: pick(LOOK.pants.length), extra: any(owned('extra')), top: any(owned('top')), bottom: any(owned('bottom')) });
    paint();
  };
  paint();
  const save = h('button', { class: 'btn primary big', onclick: (e) => run(e.currentTarget, async () => {
    await store.op({ type: 'look', look });
    if (first) { toast('Che stile! Ora scegli dove costruire casa.'); startChoosing(); }
    else { closeSheet(); toast('Personaggio aggiornato'); }
  }) }, first ? 'Avanti: scegli il lotto' : 'Salva il personaggio');
  openSheet(first ? 'Come sei?' : 'Il mio personaggio', h('div', { class: 'stack' },
    h('div', { class: 'avatar-head' }, preview,
      h('div', { class: 'stack' },
        h('p', { class: 'small' }, first ? `Questo è ${r.username}: così ti vedranno gli altri abitanti mentre passeggi.` : 'Così ti vedono gli altri abitanti mentre passeggi.'),
        h('button', { class: 'btn small', onclick: shuffle }, 'A caso'))),
    groups, save), { wide: true, onClose: first ? () => { if (!myHouse() && ui.mode !== 'choose') startChoosing(); } : undefined });
  requestAnimationFrame(animate);
}

function openHouse(slot) {
  const city = store.city;
  const house = city.houses[slot];
  const r = house && city.residents[house.residentId];
  if (!r) return;
  map.set({ selected: slot });
  const mine = me();
  const isMe = mine && mine.id === r.id;
  const d = districtById(districtAt(...parseKey(slot)));
  const badges = h('div', { class: 'badges' },
    r.number ? h('span', { class: 'tag' }, `Abitante n°${r.number}`) : null,
    isFounder(r) ? h('span', { class: 'tag gold' }, 'Fondatore') : null,
    house.status === 'cantiere' ? h('span', { class: 'tag warn' }, 'Cantiere') : null,
    store.online.has(r.id) ? h('span', { class: 'tag live' }, 'In città ora') : null,
    city.news.some((n) => n.kind === 'casaSettimana' && n.residentId === r.id && weekKey(n.at) === weekKey(Date.now())) ? h('span', { class: 'tag gold' }, '🏆 Casa della settimana') : null,
    heartsThisWeek(city, r.id, Date.now()) ? h('span', { class: 'tag' }, `❤️ ${heartsThisWeek(city, r.id, Date.now())} questa settimana`) : null,
    (() => { const st = missionStatus(city, r.id, Date.now()).streak; return st > 1 ? h('span', { class: 'tag' }, `🔥 ${st} giorni di fila`) : null; })(),
    r.suspended ? h('span', { class: 'tag warn' }, 'Sospeso') : null);
  const facts = h('dl', { class: 'facts-list' },
    h('div', {}, h('dt', {}, 'Quartiere'), h('dd', {}, d.name)),
    h('div', {}, h('dt', {}, 'Arrivato il'), h('dd', {}, fmtDate(house.builtAt || house.reservedAt))),
    r.instagram ? h('div', {}, h('dt', {}, 'Instagram'), h('dd', {}, h('a', { href: `https://instagram.com/${r.instagram}`, target: '_blank', rel: 'noopener noreferrer' }, '@' + r.instagram))) : null);
  const actions = h('div', { class: 'stack' });
  if (house.status === 'casa' && mine && (isMe || canVisit(city, mine.id, r.id))) {
    actions.append(h('button', { class: 'btn primary', onclick: () => enterHouse(r.id) }, icon('home'), isMe ? 'Entra in casa' : `Entra da ${r.username}`));
  } else if (house.status === 'casa' && mine && !isMe) {
    actions.append(h('p', { class: 'small' }, roomOf(city, r.id).access === 'amici' ? 'Fa entrare solo gli amici.' : 'In questo momento non fa entrare visite.'));
  }
  if (isMe) {
    actions.append(
      h('button', { class: 'btn', onclick: () => openBuild(slot, { restyle: true }) }, 'Rinnova la casa'),
      h('button', { class: 'btn', onclick: openProfile }, 'Modifica il profilo'));
  } else if (!mine) {
    actions.append(h('button', { class: 'btn primary', onclick: openRegister }, 'Iscriviti per bussare alla porta'));
  } else {
    const out = city.requests.find((q) => q.from === mine.id && q.to === r.id);
    const inc = city.requests.find((q) => q.to === mine.id && q.from === r.id);
    if (areFriends(city, mine.id, r.id)) {
      actions.append(h('p', { class: 'friends-line' }, `Tu e ${r.username} siete amici.`),
        h('button', { class: 'btn ghost small', onclick: (e) => run(e.currentTarget, async () => { await store.op({ type: 'unfriend', id: r.id }); openHouse(slot); }) }, 'Rimuovi amicizia'));
    } else if (inc) {
      actions.append(h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, async () => { await store.op({ type: 'friendRespond', id: inc.id, accept: true }); toast(`Ora tu e ${r.username} siete amici`); openHouse(slot); }) }, `${r.username} ha bussato: apri la porta`));
    } else if (out) {
      actions.append(h('button', { class: 'btn', disabled: true }, 'Hai bussato: aspetta la risposta'));
    } else {
      actions.append(h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, async () => {
        const res = await store.op({ type: 'friendRequest', to: r.id });
        toast(res.friends ? `Avevate bussato entrambi: ora siete amici!` : `Hai bussato alla porta di ${r.username}`);
        openHouse(slot);
      }) }, 'Bussa alla porta'));
    }
    actions.append(h('button', { class: 'link-btn', onclick: () => openReport(r) }, 'Segnala questo abitante'));
  }
  openSheet(r.username, h('div', { class: 'stack' },
    badges,
    r.bio ? h('p', { class: 'bio' }, `“${r.bio}”`) : isMe ? h('p', { class: 'small' }, 'Aggiungi una frase di presentazione dal tuo profilo.') : null,
    facts, actions));
}

function openMailbox() {
  const city = store.city;
  const mine = me();

    outgoing.length ? h('h3', {}, 'In attesa di risposta') : null,

function openLocked(id) {
  const d = districtById(id);
  const open = store.city.openDistricts;
  const total = lotsOpen(open);
  const taken = Object.keys(store.city.houses).filter((k) => districtAt(...parseKey(k)) <= open).length;
  const need = Math.max(0, Math.ceil(total * UNLOCK_RATIO) - taken);
  openSheet(d.name, h('div', { class: 'stack' },
    id === open + 1
      ? h('p', {}, `È il prossimo quartiere ad aprire: mancano ${need} ${need === 1 ? 'casa' : 'case'} nei quartieri aperti. Avrà ${PLAN.lotsByDistrict.get(id).length} lotti e una nuova strada principale.`)
      : h('p', {}, `Per ora è campagna. Aprirà dopo gli altri quartieri, con ${PLAN.lotsByDistrict.get(id).length} lotti.`),
    h('p', { class: 'small' }, 'Le linee tratteggiate bianche sono le strade principali già previste dal piano regolatore.')));

/* Tocchi sulla mappa ------------------------------------------------------- */

function onTap(t) {
  if (ui.mode === 'choose') {
    if (t.kind === 'lot') return openLot(t.slot);
    if (t.kind === 'locked') return toast('Questo quartiere non è ancora aperto: scegli un lotto tratteggiato.', 'err');
    if (t.kind === 'house') return toast('Questo lotto è già occupato.', 'err');
    return;
  }
  if (t.kind === 'avatar' && t.id.startsWith('npc:')) return onNpcTap(t.id);
  if (t.kind === 'avatar') return openSay(t.id);
  if (ui.room) return onRoomTap(t);
  // Con il proprio omino in città, ogni tocco è anche una passeggiata.
  const walker = me() && map.avatarOf(me().id);
  const go = (x, y) => walker && walkTo(x, y);
  if (t.kind === 'shop') { const sh = shopById(t.shop); go(...sh.front); return openShop(sh); }
  if (t.kind === 'house') { go(...frontOf(store.city, t.slot)); return openHouse(t.slot); }
  if (t.kind === 'lot') { go(t.x, t.y); return openLot(t.slot); }
  if (t.kind === 'giornale') { go(t.x, t.y + 1); return openGiornale(); }
  if (t.kind === 'muro') { go(t.x, t.y + 1); return openMuro(); }
  if (t.kind === 'piazza') {
    if (walker && seatAt(store.city, null, t.x, t.y)) { closeSheet(); return sitOn(t.x, t.y); }
    if (walker) { closeSheet(); return go(t.x, t.y); }
    return openMuro();
  }
  if (t.kind === 'locked' && !walker) return openLocked(t.district);
  closeSheet();
  if (walker && !go(t.x, t.y)) toast('Da qui non si passa: prova a seguire le strade.', 'err');
}

// Muove il proprio omino e lo racconta agli altri abitanti.
function walkTo(x, y) {
  const ok = map.walk(me().id, x, y);
  if (ok) store.move(x, y);
  return ok;
}

/* Dentro casa ---------------------------------------------------------------- */

// Si entra in una casa (id del padrone) o in un negozio ('shop:…'): stessa stanza isometrica.
function enterHouse(ownerId) {
  const mine = me();
  if (!mine) return openLogin();
  const city = store.city;
  if (!canVisit(city, mine.id, ownerId)) return toast('Il padrone di casa non fa entrare visite.', 'err');
  if (!map.avatarOf(mine.id)) syncAvatars();
  closeSheet();
  ui.room = ownerId;
  ui.edit = false; ui.placing = null; ui.sel = null; ui.moving = null; ui.shopTab = null;
  map.walk(mine.id, ...ROOM_DOOR, ownerId);
  store.move(...ROOM_DOOR, ownerId);
  map.enterRoom(ownerId);
  const shop = shopById(ownerId);
  if (shop) setTimeout(() => map.say('npc:' + shop.id, shop.kind === 'wear' ? `Ciao ${mine.username}! Tocca un manichino o il catalogo.` : `Benvenuto ${mine.username}! Tocca un mobile per prenderlo.`), 350);
  update();
}
function exitHouse() {
  const owner = ui.room;
  ui.room = null; ui.edit = false; ui.placing = null; ui.sel = null; ui.moving = null;
  const shop = shopById(owner);
  const house = shop ? null : residentHouse(store.city, owner);
  const [x, y] = shop ? shop.front : house ? frontOf(store.city, house.slot) : spawnPoint(store.city, me().id);
  map.walk(me().id, x, y, null);
  store.move(x, y, null);
  map.exitRoom();
  if (house) map.focus(house.slot);
  if (shop) map.focus([shop.x0 + 1, shop.y0 + 1]);
  update();
}
// Dalla stanza al Mobilificio: si esce e si va a piedi fino alla sua porta.
function goToShop(id) {
  const shop = shopById(id);
  if (ui.room) exitHouse();
  map.focus([shop.x0 + 1, shop.y0 + 1]);
  if (me() && map.avatarOf(me().id)) walkTo(...shop.front);
  openShop(shop);
}

const isMyRoom = () => me() && ui.room === me().id;

async function onRoomTap(t) {
  if (t.kind === 'door') return exitHouse();
  const room = roomOf(store.city, ui.room);
  const shop = shopById(ui.room);
  if (shop && t.kind === 'furni') {
    // In negozio la merce esposta si compra; appendiabiti e bancone aprono il reparto vestiti.
    const it = room.items.find((x) => x.uid === t.uid);
    if (shop.kind === 'furni' && it) return buyFurni(it.t);
    if (shop.kind === 'ride' && it?.t === 'espositore') return openRide(RIDES[it.c % 3]); // l'ordine degli espositori è quello di RIDES
    if (it && (it.t === 'stender' || it.t === 'specchio')) { ui.shopTab = it.t === 'specchio' ? 'extra' : 'top'; return update(); }
  }
  if (ui.edit && isMyRoom()) {
    if (t.kind === 'floor' && ui.placing) {
      const p = ui.placing;
      const ok = await run(null, async () => { await store.op({ type: 'furni', act: 'add', t: p.t, x: t.x, y: t.y, r: p.r, c: p.c }); return true; });
      if (ok) { ui.placing = null; toast(`${furniById(p.t).label}: al suo posto`); }
      return update();
    }
    if (t.kind === 'floor' && ui.moving) {
      const uid = ui.moving;
      const ok = await run(null, async () => { await store.op({ type: 'furni', act: 'move', uid, x: t.x, y: t.y }); return true; });
      if (ok) ui.moving = null;
      map.setRoomUI({ selectedUid: ui.sel });
      return update();
    }
    if (t.kind === 'furni') { ui.sel = t.uid; ui.moving = null; ui.placing = null; map.setRoomUI({ selectedUid: t.uid }); return update(); }
    if (t.kind === 'floor') { ui.sel = null; map.setRoomUI({ selectedUid: null }); return update(); }
    return;
  }
  // Su sedie, poltrone, divani e pouf ci si siede.
  if (t.kind === 'furni') {
    const it = room.items.find((x) => x.uid === t.uid);
    if (it && seatAt(store.city, ui.room, it.x, it.y)) {
      const f = footprint(it);
      const sx = Math.max(f.x0, Math.min(f.x1, t.x)), sy = Math.max(f.y0, Math.min(f.y1, t.y));
      if (!sitOn(sx, sy, ui.room)) toast('Non si arriva a quella seduta.', 'err');
      return;
    }
  }
  // Fuori dalla modalità arredo ogni tocco è una passeggiata (verso il mobile o la casella).
  if (t.kind === 'floor' || t.kind === 'furni') {
    if (!map.walk(me().id, t.x, t.y, ui.room)) return;
    store.move(t.x, t.y, ui.room);
  }
  void room;
}
