<title>Virtual-Italy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Virtual-Italy · la mappa è la pagina: i comandi galleggiano sopra, le schede salgono dal basso
   (sul computer diventano un pannello a destra). Verde bottiglia, giallo Vespa, carta di giornale. */
:root {
  --bg: #fbf8f1;
  --surface: #f2ecdf;
  --ink: #23302b;
  --muted: #66716b;
  --line: rgba(35, 48, 43, 0.14);
  --brand: #2f5d50;
  --brand-ink: #ffffff;
  --accent: #f2b632;
  --accent-ink: #3a2a00;
  --red: #b8322a;
  --gold: #b88a12;
  --warn: #a55a12;
  --live: #2f7d4f;
  --glass: rgba(251, 248, 241, 0.92);
  --shadow: 0 10px 30px rgba(20, 30, 26, 0.18);
  --sea: #5aa6c9;
  --f-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --f-paper: 'Abril Fatface', Georgia, 'Times New Roman', serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b2321; --surface: #24302c; --ink: #ece6d8; --muted: #a2aca6; --line: rgba(236, 230, 216, 0.14);
    --brand: #7fc2ab; --brand-ink: #10201b; --accent: #f2b632; --accent-ink: #2a1e00; --red: #e86b5f;
    --gold: #e2bd4f; --warn: #f0a35b; --live: #6fd39a; --glass: rgba(27, 35, 33, 0.9); --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b2321; --surface: #24302c; --ink: #ece6d8; --muted: #a2aca6; --line: rgba(236, 230, 216, 0.14);
  --brand: #7fc2ab; --brand-ink: #10201b; --accent: #f2b632; --accent-ink: #2a1e00; --red: #e86b5f;
  --gold: #e2bd4f; --warn: #f0a35b; --live: #6fd39a; --glass: rgba(27, 35, 33, 0.9); --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--sea); color: var(--ink); font: 16px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--brand); font-weight: 700; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#map:active { cursor: grabbing; }

/* Barra in alto */
.top {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand {
  display: flex; align-items: baseline; gap: 10px; min-width: 0;
  background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 999px; padding: 8px 14px 8px 16px;
  box-shadow: var(--shadow); cursor: pointer;
}
.brand-name { font: 700 1.25rem/1 var(--f-display); letter-spacing: 0.01em; white-space: nowrap; }
.brand-dash { color: var(--accent); }
.brand-count { font: 800 0.75rem/1 var(--f-body); opacity: 0.85; white-space: nowrap; font-variant-numeric: tabular-nums; }
.top-actions { display: flex; gap: 6px; }
.round {
  position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  border: 0; background: var(--glass); color: var(--ink); box-shadow: var(--shadow); cursor: pointer;
  backdrop-filter: blur(6px);
}
.round.small { width: 38px; height: 38px; }
.round.ghost { box-shadow: none; background: transparent; }
.ico { display: grid; place-items: center; }
.badge {
  position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: var(--red); color: #fff; font: 800 0.72rem/20px var(--f-body); text-align: center;
}

.demobar {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 62px); width: min(760px, calc(100% - 24px));
  display: flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 0.8rem; font-weight: 800;
  box-shadow: var(--shadow);
}
.demobar-label { flex: none; }
.demobar-actions { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.demobar-actions::-webkit-scrollbar { display: none; }
.demobar button { flex: none; border: 1px solid rgba(58, 42, 0, 0.35); background: rgba(255, 255, 255, 0.4); color: inherit; border-radius: 999px; padding: 4px 10px; font-weight: 800; cursor: pointer; white-space: nowrap; }

.notice {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 64px); width: min(560px, calc(100% - 24px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  background: var(--glass); border: 2px solid var(--accent); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); font-size: 0.9rem;
}
.demobar ~ .notice { top: calc(env(safe-area-inset-top, 0px) + 106px); }
.notice-actions { display: flex; gap: 6px; }

.zoom { position: absolute; z-index: 3; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); display: grid; gap: 8px; }
@media (pointer: coarse) { .zoom { display: none; } }

/* Barra in basso */
.bottom {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.bar {
  pointer-events: auto; width: min(560px, 100%);
  display: grid; gap: 10px; background: var(--glass); border-radius: 20px; padding: 12px; box-shadow: var(--shadow); backdrop-filter: blur(8px);
}
.bar.choose { grid-template-columns: 1fr auto; align-items: center; border: 2px solid var(--accent); font-size: 0.92rem; }
.goal { display: grid; gap: 6px; background: none; border: 0; padding: 0 2px; text-align: left; cursor: pointer; font-size: 0.88rem; font-weight: 700; color: var(--muted); }
.goal-track { display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.goal-track.big { height: 12px; border-radius: 6px; }
.goal-fill { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.6s ease; }

/* Bottoni */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  font-weight: 800; cursor: pointer; text-decoration: none; text-align: center;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.big { min-height: 52px; font: 600 1.1rem/1.1 var(--f-display); letter-spacing: 0.01em; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; border-radius: 10px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { background: var(--red); color: #fff; border-color: transparent; }
.danger-text { color: var(--red); }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--brand); font-weight: 700; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.link-btn.strong { font-size: 1rem; text-decoration: none; }

/* Schede */
.scrim { position: absolute; inset: 0; z-index: 8; background: rgba(15, 22, 19, 0.28); }
.sheet {
  position: absolute; z-index: 9; left: 0; right: 0; bottom: 0; max-height: min(86%, 760px); overflow: auto;
  background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding: 6px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(18px, env(safe-area-inset-left, 0px));
  animation: rise 0.22s ease-out;
}
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
@media (min-width: 860px) {
  .sheet { left: auto; top: calc(env(safe-area-inset-top, 0px) + 70px); right: 14px; bottom: 14px; width: 420px; max-height: none; border-radius: 20px; }
  .sheet.wide { width: 520px; }
  .scrim { background: transparent; pointer-events: none; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .toast { animation: none; } .goal-fill { transition: none; } }
.sheet-head { position: sticky; top: -6px; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg); padding: 10px 0 6px; }
.sheet-head h2 { margin: 0; font: 600 1.35rem/1.15 var(--f-display); text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.sheet-body { display: grid; gap: 14px; }
.sheet h3 { margin: 6px 0 0; font: 600 1.02rem/1.2 var(--f-display); }
.sheet p { margin: 0; }
.stack { display: grid; gap: 12px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.small { font-size: 0.86rem; color: var(--muted); }
.small.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.center { text-align: center; }

.welcome { display: grid; gap: 14px; padding-bottom: 4px; }
.eyebrow { font: 800 0.75rem/1 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); }
.welcome-title { margin: 0; font: 700 clamp(1.9rem, 7vw, 2.5rem)/1.05 var(--f-display); text-wrap: balance; }
.welcome-title span { color: var(--brand); }
.lead { font-size: 1.05rem; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts li { background: var(--surface); border-radius: 12px; padding: 10px; font-size: 0.8rem; color: var(--muted); line-height: 1.2; }
.facts strong { display: block; font: 600 1.5rem/1.1 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }

/* Moduli */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field-label { font-weight: 800; font-size: 0.9rem; margin: 0; }
.field-hint { font-size: 0.8rem; color: var(--muted); }
.field-hint.bad { color: var(--red); font-weight: 700; }
.field input, .field textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  font-size: 1rem; /* 16px: su iPhone niente zoom automatico */
}
.field textarea { resize: vertical; min-height: 70px; }
.field input:focus, .field textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; }
.check input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--brand); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.form-error { color: var(--red); font-weight: 700; font-size: 0.9rem; }
.danger-zone { border: 1.5px solid var(--red); border-radius: var(--r); padding: 12px; }

/* Costruzione */
.build { display: grid; gap: 14px; }
.build-preview { display: grid; gap: 6px; justify-items: center; }
.preview { width: 100%; max-width: 280px; aspect-ratio: 4 / 3; border-radius: var(--r); image-rendering: auto; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.swatch {
  min-height: 38px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 0.86rem; cursor: pointer;
}
.swatch.color { width: 38px; padding: 0; background: var(--sw); border: 3px solid var(--bg); box-shadow: 0 0 0 1.5px var(--line); }
.swatch.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 16%, var(--surface)); }
.swatch.color.on { box-shadow: 0 0 0 3px var(--brand); background: var(--sw); }

/* Abitanti */
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--surface); font-size: 0.8rem; font-weight: 800; }
.tag.gold { background: color-mix(in srgb, var(--gold) 22%, var(--bg)); color: var(--gold); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, var(--bg)); color: var(--warn); }
.tag.live { background: color-mix(in srgb, var(--live) 18%, var(--bg)); color: var(--live); }
.bio { font-size: 1.05rem; font-style: italic; }
.facts-list { margin: 0; display: grid; gap: 6px; }
.facts-list div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.facts-list dt { color: var(--muted); }
.facts-list dd { margin: 0; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.friends-line { font-weight: 800; color: var(--live); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 0; font-weight: 700; font-size: 0.88rem; cursor: pointer; color: var(--ink); }
.chip.muted { color: var(--muted); cursor: default; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.row.col { display: grid; gap: 6px; justify-content: stretch; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.goal-card { display: grid; gap: 8px; background: var(--surface); border-radius: var(--r); padding: 14px; }
.wall { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.wall li { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--gold) 12%, var(--bg)); font-weight: 700; font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.wall .num { font: 600 0.8rem/1 var(--f-display); color: var(--gold); min-width: 2ch; font-variant-numeric: tabular-nums; }
.code { margin: 0; max-height: 280px; overflow: auto; background: var(--surface); padding: 12px; border-radius: 12px; font: 0.78rem/1.4 ui-monospace, Menlo, Consolas, monospace; }
.table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.table th, .table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.table td + td, .table th + th { text-align: right; }
.prose ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

/* Il giornale */
.paper { display: grid; gap: 14px; }
.masthead { text-align: center; border-bottom: 4px double var(--ink); padding-bottom: 10px; }
.mast-name { font: 400 clamp(2rem, 8vw, 2.8rem)/1 var(--f-paper); text-transform: uppercase; letter-spacing: 0.02em; }
.mast-sub { margin-top: 6px !important; font: 800 0.72rem/1 var(--f-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); }
.news { list-style: none; margin: 0; padding: 0; display: grid; }
.news-item { display: grid; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.news-date { font: 800 0.72rem/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.news-title { margin: 2px 0 0 !important; font: 400 1.35rem/1.15 var(--f-paper) !important; text-wrap: balance; }
.poster { width: 100%; border-radius: 8px; box-shadow: var(--shadow); }

/* Avvisi */
.toasts { position: absolute; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); display: grid; gap: 8px; width: min(440px, calc(100% - 24px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-weight: 700; box-shadow: var(--shadow); animation: rise 0.2s ease-out; transition: opacity 0.4s; }
.toast.err { background: var(--red); color: #fff; }
.toast.out { opacity: 0; }

@media (max-width: 420px) {
  .brand-name { font-size: 1.08rem; }
  .brand { padding: 8px 12px; gap: 8px; }
  .round { width: 40px; height: 40px; }
  .top-actions { gap: 4px; }
}
@media (max-width: 360px) { .brand-count { display: none; } }

</style>

<script type="module">
// ---- core.js ----
// Regole di Virtual-Italy: piano regolatore, lotti, strade automatiche, abitanti, amicizie, notizie.
// Codice puro, senza DOM: lo usano il browser (demo e disegno della mappa) e il server,
// così le regole sono scritte una volta sola.

const CITY = 'Virtual-Italy';
const PAPER = 'Virtual-Italy IG';
const W = 84;
const H = 60;
const MAIN_Y = 30;                                  // la strada principale attraversa tutta la mappa
const SEA_Y = 52;                                   // da qui in giù c'è il mare
const PIAZZA = { x0: 37, y0: 27, x1: 44, y1: 29 };  // estremi inclusi, a nord della strada principale
const RESERVE_MS = 24 * 3600000;                    // un cantiere senza email confermata dura 24 ore
const UNLOCK_RATIO = 0.8;                           // un nuovo quartiere si apre all'80% di occupazione
const FOUNDERS = 100;
const FRIEND_REQUESTS_PER_DAY = 20;
const FOUNTAIN_AT = 25;
const MILESTONES = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000];

// Il tracciato delle vie segue una griglia di passo 3: le righe e colonne multiple di 3 sono
// corsie percorribili, gli altri riquadri 2×2 sono lotti. Così ogni lotto tocca sempre una corsia
// e ogni corsia porta a una strada: nessuna casa può restare isolata.
// Le strade principali future (dorsali) stanno anch'esse sulla griglia delle corsie.
const DISTRICTS = [
  { id: 1, name: 'Centro', rect: [33, 27, 50, 33], dorsal: null,
    walls: ['#e8b86a', '#d98b5f', '#f0d39a', '#e3a27a'] },
  { id: 2, name: 'Borgo Est', rect: [51, 24, 69, 36], dorsal: { x: 60, y0: 18, y1: 42 },
    walls: ['#f3d6d0', '#d7e6ef', '#f4e7b8', '#dcebd2'] },
  { id: 3, name: 'Borgo Ovest', rect: [15, 24, 32, 36], dorsal: { x: 24, y0: 18, y1: 42 },
    walls: ['#d8cfc0', '#c9bba4', '#e6dccb', '#bfb5a6'] },
  { id: 4, name: 'Collina Nord', rect: [15, 12, 69, 26], dorsal: { y: 18, x0: 15, x1: 68 },
    walls: ['#c99a6b', '#b98a5e', '#e0c49e', '#a8794f'] },
  { id: 5, name: 'Marina Sud', rect: [15, 34, 69, 51], dorsal: { y: 42, x0: 15, x1: 68 },
    walls: ['#f5f3ee', '#dbe8f1', '#f7efe0', '#e5eef0'] },
];

const ROOFS = [
  { id: 'coppi', label: 'Coppi', color: '#b5523b' },
  { id: 'ardesia', label: 'Ardesia', color: '#4b5563' },
  { id: 'verde', label: 'Rame verde', color: '#4f8a72' },
  { id: 'blu', label: 'Blu', color: '#3f6aa1' },
  { id: 'senape', label: 'Senape', color: '#c99a2e' },
  { id: 'prugna', label: 'Prugna', color: '#7a4a6b' },
];
const DOORS = [
  { id: 'noce', label: 'Noce', color: '#6b4428' },
  { id: 'verde', label: 'Verde', color: '#2f6b4f' },
  { id: 'rosso', label: 'Rosso', color: '#b3362f' },
  { id: 'blu', label: 'Blu', color: '#2d5b8c' },
  { id: 'giallo', label: 'Giallo', color: '#e0a92a' },
  { id: 'bianco', label: 'Bianco', color: '#f1ede4' },
];
const GARDENS = [
  { id: 'prato', label: 'Prato' },
  { id: 'fiori', label: 'Fiori' },
  { id: 'orto', label: 'Orto' },
  { id: 'ulivo', label: 'Ulivo' },
  { id: 'nessuno', label: 'Ghiaia' },
];
const DECOS = [
  { id: 'nessuno', label: 'Niente' },
  { id: 'vespa', label: 'Vespa' },
  { id: 'bici', label: 'Bicicletta' },
  { id: 'panchina', label: 'Panchina' },
  { id: 'limoni', label: 'Vaso di limoni' },
  { id: 'cane', label: 'Cuccia' },
];
const SHAPES = ['casa', 'villetta', 'torretta'];

class DomainError extends Error {
  constructor(code, message) {
    super(message);
    this.code = code; // validation | conflict | forbidden | notfound | auth
  }
}
const invalid = (msg) => new DomainError('validation', msg);
const forbidden = (msg) => new DomainError('forbidden', msg);

/* Piano regolatore --------------------------------------------------- */

const key = (x, y) => x + ',' + y;
const parseKey = (k) => k.split(',').map(Number);

function inRect([x0, y0, x1, y1], x, y) {
  return x >= x0 && x <= x1 && y >= y0 && y <= y1;
}
function inPiazza(x, y) {
  return x >= PIAZZA.x0 && x <= PIAZZA.x1 && y >= PIAZZA.y0 && y <= PIAZZA.y1;
}
function dorsalTiles(d) {
  const out = [];
  if (!d) return out;
  if (d.x !== undefined) for (let y = d.y0; y <= d.y1; y++) out.push(key(d.x, y));
  else for (let x = d.x0; x <= d.x1; x++) out.push(key(x, d.y));
  return out;
}

// Il piano è calcolato una volta: per ogni casella il quartiere, e l'elenco dei lotti.
const PLAN = (() => {
  const district = new Int8Array(W * H);
  const lots = new Set();
  const lotsByDistrict = new Map(DISTRICTS.map((d) => [d.id, []]));
  const futureRoads = new Map(); // casella → id del quartiere che la attiva
  for (const d of DISTRICTS) for (const k of dorsalTiles(d.dorsal)) if (!futureRoads.has(k)) futureRoads.set(k, d.id);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const d = DISTRICTS.find((q) => inRect(q.rect, x, y));
      if (!d || y >= SEA_Y) continue;
      district[y * W + x] = d.id;
      const k = key(x, y);
      if (x % 3 === 0 || y % 3 === 0 || y === MAIN_Y || inPiazza(x, y) || futureRoads.has(k)) continue;
      lots.add(k);
      lotsByDistrict.get(d.id).push(k);
    }
  }
  return { district, lots, lotsByDistrict, futureRoads };
})();

const districtAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? 0 : PLAN.district[y * W + x]);
const isLot = (k) => PLAN.lots.has(k);
const districtById = (id) => DISTRICTS.find((d) => d.id === id);

function lotsOpen(openDistricts) {
  let n = 0;
  for (let id = 1; id <= openDistricts; id++) n += PLAN.lotsByDistrict.get(id).length;
  return n;
}

/* Strade automatiche ------------------------------------------------- */

// Rete di base: strada principale, piazza e dorsali dei quartieri aperti.
function baseNetwork(openDistricts) {
  const net = new Map();
  for (let x = 0; x < W; x++) net.set(key(x, MAIN_Y), 'main');
  for (let y = PIAZZA.y0; y <= PIAZZA.y1; y++) for (let x = PIAZZA.x0; x <= PIAZZA.x1; x++) net.set(key(x, y), 'piazza');
  for (const d of DISTRICTS) {
    if (d.id > openDistricts) continue;
    for (const k of dorsalTiles(d.dorsal)) if (!net.has(k)) net.set(k, 'dorsal');
  }
  return net;
}

const STEPS = [[0, 1], [0, -1], [1, 0], [-1, 0]];

// Percorso più breve (ricerca in ampiezza: ogni passo costa uguale, quindi coincide con A*)
// dal lotto alla casella di rete più vicina, passando solo su corsie dei quartieri aperti.
// I vialetti già tracciati fanno parte della rete, così le case vicine li condividono.
function routeFrom(lotKey, net, openDistricts) {
  const [sx, sy] = parseKey(lotKey);
  const prev = new Map([[lotKey, null]]);
  const queue = [[sx, sy]];
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    for (const [dx, dy] of STEPS) {
      const nx = x + dx, ny = y + dy;
      const nk = key(nx, ny);
      if (prev.has(nk)) continue;
      if (net.has(nk)) {
        const path = [];
        for (let k = key(x, y); k !== lotKey; k = prev.get(k)) path.push(k);
        return { path: path.reverse(), reach: nk };
      }
      const dId = districtAt(nx, ny);
      if (!dId || dId > openDistricts || PLAN.lots.has(nk)) continue;
      prev.set(nk, key(x, y));
      queue.push([nx, ny]);
    }
  }
  return null;
}

// Ricostruisce tutta la rete in ordine di arrivo: deterministica, e quando una dorsale si attiva
// le case vicine si ricollegano da sole a quella, se è più vicina.
function computeRoads(houses, openDistricts) {
  const net = baseNetwork(openDistricts);
  const doors = {};
  const ordered = Object.values(houses).sort((a, b) => a.reservedAt - b.reservedAt || (a.slot < b.slot ? -1 : 1));
  for (const h of ordered) {
    const r = routeFrom(h.slot, net, openDistricts);
    if (!r) continue;
    for (const k of r.path) net.set(k, 'lane');
    const first = r.path[0] || r.reach;
    const [hx, hy] = parseKey(h.slot);
    const [fx, fy] = parseKey(first);
    doors[h.slot] = fx > hx ? 'E' : fx < hx ? 'W' : fy > hy ? 'S' : 'N';
  }
  return { roads: Object.fromEntries(net), doors };
}

function canReach(lotKey, houses, openDistricts) {
  const { roads } = computeRoads(houses, openDistricts);
  return !!routeFrom(lotKey, new Map(Object.entries(roads)), openDistricts);
}

/* Nomi, frasi e filtri ------------------------------------------------ */

const BAD_WORDS = ['cazz', 'merd', 'stronz', 'puttan', 'troia', 'vaffanc', 'fancul', 'coglion', 'frocio', 'froci',
  'negro', 'ricchion', 'porcodio', 'diocane', 'dioporco', 'mignott', 'zoccol', 'bastard',
  'fuck', 'shit', 'bitch', 'nigg', 'faggot', 'cunt', 'whore', 'nazist', 'hitler', 'pedofil', 'stupr'];
// Parole innocue che contengono una delle precedenti.
const ALLOWED = ['negroni'];
const RESERVED = ['admin', 'amministratore', 'amministrazione', 'sindaco', 'giornale', 'virtualitaly', 'virtualitalyig',
  'redazione', 'moderatore', 'moderazione', 'staff', 'comune', 'support', 'supporto', 'assistenza', 'sistema', 'ufficiale'];

function squash(s) {
  return String(s).toLowerCase()
    .replace(/[0]/g, 'o').replace(/[1!|]/g, 'i').replace(/3/g, 'e').replace(/[4@]/g, 'a').replace(/5/g, 's').replace(/7/g, 't')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z]/g, '');
}
function isOffensive(s) {
  let q = squash(s);
  for (const a of ALLOWED) q = q.split(a).join('');
  return BAD_WORDS.some((w) => q.includes(w));
}

function checkUsername(raw) {
  const u = String(raw ?? '').trim();
  if (!/^[A-Za-z0-9._]{3,20}$/.test(u)) throw invalid('Il nome utente deve avere da 3 a 20 caratteri: lettere, numeri, punto o trattino basso.');
  if (/^[._]|[._]$/.test(u) || /[._]{2}/.test(u)) throw invalid('Il nome utente non può iniziare o finire con punto o trattino basso, né averne due di fila.');
  const q = squash(u);
  if (RESERVED.some((r) => q === r || q.startsWith(r))) throw invalid('Questo nome utente è riservato: scegline un altro.');
  if (isOffensive(u)) throw invalid('Questo nome utente non è ammesso: scegline un altro.');
  return u;
}
const usernameKey = (u) => String(u).trim().toLowerCase();

function checkEmail(raw) {
  const e = String(raw ?? '').trim().toLowerCase();
  if (e.length > 120 || !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(e)) throw invalid("L'indirizzo email non sembra valido.");
  return e;
}

function checkPassword(p) {
  if (typeof p !== 'string' || p.length < 8) throw invalid('La password deve avere almeno 8 caratteri.');
  if (p.length > 200) throw invalid('La password è troppo lunga.');
  return p;
}

function cleanBio(raw) {
  const b = String(raw ?? '').replace(/\s+/g, ' ').trim();
  if (b.length > 120) throw invalid('La frase di presentazione può avere al massimo 120 caratteri.');
  if (b && isOffensive(b)) throw invalid('La frase contiene parole non ammesse.');
  return b;
}

function cleanInstagram(raw) {
  let s = String(raw ?? '').trim();
  if (!s) return '';
  s = s.replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/[/?#].*$/, '');
  if (!/^[A-Za-z0-9._]{1,30}$/.test(s)) throw invalid('Il nome Instagram può contenere solo lettere, numeri, punto e trattino basso.');
  return s.toLowerCase();
}

function pick(list, id, fallback) {
  return list.some((o) => o.id === id) ? id : fallback;
}
// Lo stile della casa: colori scelti dall'abitante, forma e muri dal quartiere (stabili per lotto).
function makeStyle(slot, choice = {}) {
  const [x, y] = parseKey(slot);
  const d = districtById(districtAt(x, y)) || DISTRICTS[0];
  const h = hash(slot);
  return {
    roof: pick(ROOFS, choice.roof, ROOFS[h % ROOFS.length].id),
    door: pick(DOORS, choice.door, DOORS[(h >>> 3) % DOORS.length].id),
    garden: pick(GARDENS, choice.garden, 'prato'),
    deco: pick(DECOS, choice.deco, 'nessuno'),
    wall: d.walls[(h >>> 6) % d.walls.length],
    shape: SHAPES[(h >>> 9) % SHAPES.length],
  };
}

function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* Stato della città -------------------------------------------------- */

function emptyState(now = Date.now()) {
  const s = {
    rev: 1,
    createdAt: now,
    nextNumber: 1,
    openDistricts: 1,
    residents: {},     // id → { id, username, number, joinedAt, bio, instagram, confirmed, suspended }
    houses: {},        // lotto → { slot, residentId, style, status, reservedAt, builtAt }
    roads: {},
    doors: {},
    requests: [],      // { id, from, to, at }
    friendships: [],   // { a, b, since }
    sentLog: {},       // id → istanti delle richieste inviate nelle ultime 24 ore
    reports: [],       // { id, from, target, reason, at, resolved }
    news: [],          // { id, kind, at, residentId?, n?, district?, slot? }
    milestones: [],
  };
  addNews(s, { kind: 'founding', at: now });
  return refresh(s);
}

let seq = 0;
const uid = (p) => p + Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 6);

function addNews(s, n) {
  s.news.unshift({ id: uid('n'), ...n });
  if (s.news.length > 500) s.news.length = 500;
}

const residentHouse = (s, residentId) => Object.values(s.houses).find((h) => h.residentId === residentId) || null;
const builtCount = (s) => Object.values(s.houses).filter((h) => h.status === 'casa').length;
const isFounder = (r) => !!r && r.number !== null && r.number <= FOUNDERS;
const areFriends = (s, a, b) => s.friendships.some((f) => (f.a === a && f.b === b) || (f.a === b && f.b === a));
const friendsOf = (s, id) => s.friendships.filter((f) => f.a === id || f.b === id).map((f) => (f.a === id ? f.b : f.a));

// Dopo ogni modifica alle case: quartieri da aprire, traguardi, strade.
function refresh(s, now = Date.now()) {
  while (s.openDistricts < DISTRICTS.length) {
    const taken = Object.values(s.houses).filter((h) => districtAt(...parseKey(h.slot)) <= s.openDistricts).length;
    if (taken < lotsOpen(s.openDistricts) * UNLOCK_RATIO) break;
    s.openDistricts++;
    addNews(s, { kind: 'district', at: now, district: s.openDistricts });
  }
  const built = builtCount(s);
  for (const m of MILESTONES) {
    if (built >= m && !s.milestones.includes(m)) {
      s.milestones.push(m);
      addNews(s, { kind: 'milestone', at: now, n: m });
    }
  }
  const r = computeRoads(s.houses, s.openDistricts);
  s.roads = r.roads;
  s.doors = r.doors;
  return s;
}

function needResident(s, ctx) {
  const r = ctx.user && s.residents[ctx.user.id];
  if (!r) throw new DomainError('auth', 'Accedi per continuare.');
  if (r.suspended) throw forbidden('Il tuo account è sospeso.');
  return r;
}
function needAdmin(ctx) {
  if (!ctx.user?.admin) throw forbidden('Riservato alla redazione.');
}

function finishHouse(s, r, h, now) {
  h.status = 'casa';
  h.builtAt = now;
  addNews(s, { kind: 'welcome', at: now, residentId: r.id, slot: h.slot });
}

// Ogni operazione restituisce un nuovo stato; quello vecchio resta intatto se c'è un errore.
function applyOp(state, op, ctx) {
  const s = structuredClone(state);
  const now = ctx.now ?? Date.now();
  const result = OPS[op?.type]?.(s, op, ctx, now);
  if (result === undefined) throw invalid('Operazione sconosciuta.');
  s.rev++;
  return { state: s, result };
}

const OPS = {
  // Server: nuovo account creato (email non ancora confermata).
  join(s, op, ctx, now) {
    if (!ctx.system) throw forbidden('Operazione interna.');
    const username = checkUsername(op.username);
    if (Object.values(s.residents).some((r) => usernameKey(r.username) === usernameKey(username))) throw invalid('Questo nome utente è già preso.');
    s.residents[op.id] = { id: op.id, username, number: null, joinedAt: now, bio: '', instagram: '', confirmed: false, suspended: false };
    return { id: op.id };
  },

  // Server: email confermata. Il numero di abitante si assegna qui, così i bot non lo consumano.
  confirm(s, op, ctx, now) {
    if (!ctx.system) throw forbidden('Operazione interna.');
    const r = s.residents[op.id];
    if (!r) throw new DomainError('notfound', 'Abitante non trovato.');
    if (r.confirmed) return { already: true };
    r.confirmed = true;
    r.number = s.nextNumber++;
    const h = residentHouse(s, r.id);
    if (h && h.status === 'cantiere') finishHouse(s, r, h, now);
    refresh(s, now);
    return { number: r.number };
  },

  chooseSlot(s, op, ctx, now) {
    const r = needResident(s, ctx);
    if (residentHouse(s, r.id)) throw invalid('Hai già una casa a Virtual-Italy.');
    const slot = String(op.slot || '');
    if (!isLot(slot)) throw invalid('Qui non si può costruire: scegli uno dei lotti liberi.');
    if (districtAt(...parseKey(slot)) > s.openDistricts) throw invalid('Questo quartiere non è ancora aperto.');
    if (s.houses[slot]) throw new DomainError('conflict', 'Qualcuno ha appena preso questo lotto: scegline un altro.');
    const h = { slot, residentId: r.id, style: makeStyle(slot, op.style), status: 'cantiere', reservedAt: now, builtAt: null };
    s.houses[slot] = h;
    if (r.confirmed) finishHouse(s, r, h, now);
    refresh(s, now);
    return { slot, status: h.status };
  },

  restyle(s, op, ctx) {
    const r = needResident(s, ctx);
    const h = residentHouse(s, r.id);
    if (!h) throw invalid('Non hai ancora una casa.');
    h.style = makeStyle(h.slot, { ...h.style, ...op.style });
    return { ok: true };
  },

  profile(s, op, ctx) {
    const r = needResident(s, ctx);
    if (op.bio !== undefined) r.bio = cleanBio(op.bio);
    if (op.instagram !== undefined) r.instagram = cleanInstagram(op.instagram);
    return { ok: true };
  },

  friendRequest(s, op, ctx, now) {
    const r = needResident(s, ctx);
    if (!r.confirmed) throw forbidden('Conferma la tua email prima di bussare alle porte.');
    const to = s.residents[op.to];
    if (!to || to.id === r.id) throw new DomainError('notfound', 'Abitante non trovato.');
    if (areFriends(s, r.id, to.id)) throw invalid(`Tu e ${to.username} siete già amici.`);
    if (s.requests.some((q) => q.from === r.id && q.to === to.id)) throw invalid('Hai già bussato: aspetta la risposta.');
    const back = s.requests.find((q) => q.from === to.id && q.to === r.id);
    if (back) {
      s.requests = s.requests.filter((q) => q !== back);
      s.friendships.push({ a: to.id, b: r.id, since: now });
      return { friends: true };
    }
    const log = (s.sentLog[r.id] || []).filter((t) => now - t < 86400000);
    if (log.length >= FRIEND_REQUESTS_PER_DAY) throw forbidden(`Puoi bussare al massimo ${FRIEND_REQUESTS_PER_DAY} volte al giorno. Riprova domani.`);
    s.sentLog[r.id] = [...log, now];
    s.requests.push({ id: uid('q'), from: r.id, to: to.id, at: now });
    return { sent: true };
  },

  friendRespond(s, op, ctx, now) {
    const r = needResident(s, ctx);
    const q = s.requests.find((x) => x.id === op.id && x.to === r.id);
    if (!q) throw new DomainError('notfound', 'Richiesta non trovata.');
    s.requests = s.requests.filter((x) => x !== q);
    if (op.accept && s.residents[q.from] && !areFriends(s, q.from, r.id)) s.friendships.push({ a: q.from, b: r.id, since: now });
    return { accepted: !!op.accept };
  },

  unfriend(s, op, ctx) {
    const r = needResident(s, ctx);
    s.friendships = s.friendships.filter((f) => !((f.a === r.id && f.b === op.id) || (f.b === r.id && f.a === op.id)));
    return { ok: true };
  },

  report(s, op, ctx, now) {
    const r = needResident(s, ctx);
    if (!s.residents[op.target] || op.target === r.id) throw new DomainError('notfound', 'Abitante non trovato.');
    const reason = String(op.reason || '').trim().slice(0, 300);
    if (!reason) throw invalid('Scrivi brevemente il motivo della segnalazione.');
    s.reports.unshift({ id: uid('s'), from: r.id, target: op.target, reason, at: now, resolved: false });
    return { ok: true };
  },

  // L'account viene cancellato: la casa torna lotto libero, le notizie restano senza nome.
  leave(s, op, ctx, now) {
    const id = ctx.system ? op.id : needResident(s, ctx).id;
    if (!s.residents[id]) throw new DomainError('notfound', 'Abitante non trovato.');
    delete s.residents[id];
    for (const [slot, h] of Object.entries(s.houses)) if (h.residentId === id) delete s.houses[slot];
    s.requests = s.requests.filter((q) => q.from !== id && q.to !== id);
    s.friendships = s.friendships.filter((f) => f.a !== id && f.b !== id);
    delete s.sentLog[id];
    refresh(s, now);
    return { ok: true };
  },

  // Cantieri di chi non ha confermato l'email entro 24 ore: il lotto torna libero.
  expire(s, op, ctx, now) {
    if (!ctx.system) throw forbidden('Operazione interna.');
    let n = 0;
    for (const [slot, h] of Object.entries(s.houses)) {
      if (h.status === 'cantiere' && now - h.reservedAt > RESERVE_MS) { delete s.houses[slot]; n++; }
    }
    if (n) refresh(s, now);
    return { freed: n };
  },

  suspend(s, op, ctx) {
    needAdmin(ctx);
    const r = s.residents[op.id];
    if (!r) throw new DomainError('notfound', 'Abitante non trovato.');
    r.suspended = !!op.on;
    return { ok: true };
  },

  resolveReport(s, op, ctx) {
    needAdmin(ctx);
    const rep = s.reports.find((x) => x.id === op.id);
    if (!rep) throw new DomainError('notfound', 'Segnalazione non trovata.');
    rep.resolved = true;
    return { ok: true };
  },
};

/* Cosa vede chi guarda ------------------------------------------------ */

// Le richieste, le amicizie e le segnalazioni restano private: ognuno vede solo le sue.
function publicView(s, viewerId, admin = false) {
  const residents = {};
  for (const r of Object.values(s.residents)) {
    residents[r.id] = r.suspended
      ? { id: r.id, username: r.username, number: r.number, joinedAt: r.joinedAt, bio: '', instagram: '', confirmed: r.confirmed, suspended: true }
      : { ...r };
  }
  const v = {
    rev: s.rev, createdAt: s.createdAt, openDistricts: s.openDistricts, residents, houses: s.houses,
    roads: s.roads, doors: s.doors, news: s.news.slice(0, 120), milestones: s.milestones,
    requests: viewerId ? s.requests.filter((q) => q.from === viewerId || q.to === viewerId) : [],
    friendships: viewerId ? s.friendships.filter((f) => f.a === viewerId || f.b === viewerId) : [],
    reports: [],
  };
  if (admin) {
    v.reports = s.reports.slice(0, 100);
    v.news = s.news;
  }
  return v;
}

/* Notizie ------------------------------------------------------------- */

function formatNews(n, s) {
  const r = n.residentId && s.residents[n.residentId];
  const who = r ? r.username : 'un abitante';
  const d = n.slot ? districtById(districtAt(...parseKey(n.slot))) : null;
  switch (n.kind) {
    case 'founding':
      return { title: `Nasce ${CITY}`, text: 'Una piazza, una strada principale e tanti lotti liberi. La città aspetta i suoi primi abitanti: il link per entrare è nella bio.' };
    case 'welcome':
      return {
        title: r ? `Benvenuto a ${who}, abitante n°${r.number}` : 'Un nuovo abitante è arrivato in città',
        text: `Ha costruito casa nel quartiere ${d ? d.name : 'Centro'}.${r && isFounder(r) ? ' È uno dei primi cento: il suo nome è sul Muro dei Fondatori.' : ''}`,
      };
    case 'district': {
      const q = districtById(n.district);
      return { title: `Apre il quartiere ${q.name}`, text: `Il Centro è quasi pieno: da oggi si può costruire anche a ${q.name}. Nuovi lotti e una nuova strada principale.` };
    }
    case 'milestone':
      return {
        title: `${CITY} ha ${n.n} abitanti`,
        text: n.n === FOUNTAIN_AT ? 'Traguardo raggiunto: in piazza è arrivata la fontana. Grazie a tutti!' : `Un nuovo traguardo per la città. ${nextGoal({ milestones: [] }, n.n)}`,
      };
    default:
      return { title: 'Notizia', text: '' };
  }
}

// Il prossimo obiettivo collettivo, per la barra in piazza.
function nextGoal(s, built) {
  if (built < FOUNTAIN_AT) return `Mancano ${FOUNTAIN_AT - built} abitanti alla fontana in piazza.`;
  const m = MILESTONES.find((x) => x > built);
  return m ? `Prossimo traguardo: ${m} abitanti.` : 'Siamo una vera città!';
}
function goalProgress(built) {
  const target = built < FOUNTAIN_AT ? FOUNTAIN_AT : MILESTONES.find((x) => x > built) || built;
  const from = built < FOUNTAIN_AT ? 0 : [0, ...MILESTONES].filter((x) => x <= built).pop();
  return { target, from, ratio: target === from ? 1 : (built - from) / (target - from) };
}

const BIOS = ['Amo il mare e la pizza napoletana', 'Ciclista della domenica', 'Caffè sempre, domande poche', '',
  'Fotografo di tramonti', 'Nonna mi ha insegnato le tagliatelle', '', 'Fan della Vespa dal 1998', 'Leggo in piazza',

const DEMO_TAG = 'demo_';

function seedResidents(state, n, now = Date.now(), salt = 0) {
  let s = state;
  const sys = { system: true, now };
  const taken = new Set(Object.values(s.residents).map((r) => usernameKey(r.username)));
  for (let i = 0; i < n; i++) {
    let name = NAMES.find((u) => !taken.has(u));
    if (!name) name = 'abitante.' + (taken.size + 1);
    taken.add(name);
    const id = DEMO_TAG + hash(name + salt).toString(36);
    const t = now - (n - i) * 3600000 * 3;
    s = applyOp(s, { type: 'join', id, username: name }, { ...sys, now: t }).state;
    s = applyOp(s, { type: 'confirm', id }, { ...sys, now: t }).state;
    const slot = pickSlot(s, hash(name + 'slot' + salt));
    if (!slot) break;
    const h = hash(name);
    const style = { roof: ROOFS[h % 6].id, door: DOORS[(h >>> 4) % 6].id, garden: GARDENS[(h >>> 8) % GARDENS.length].id, deco: DECOS[(h >>> 12) % DECOS.length].id };
    s = applyOp(s, { type: 'chooseSlot', slot, style }, { user: { id }, now: t }).state;
    s = applyOp(s, { type: 'profile', bio: BIOS[h % BIOS.length] }, { user: { id }, now: t }).state;
  }
  return s;
}

// Lotto libero vicino alla piazza, con un po' di casualità: la città cresce dal centro.
function pickSlot(s, seed = 0) {
  const cx = (PIAZZA.x0 + PIAZZA.x1) / 2, cy = PIAZZA.y1;
  let best = null, bestScore = Infinity;
  for (const k of PLAN.lots) {
    if (s.houses[k]) continue;
    const [x, y] = parseKey(k);
    if (districtAt(x, y) > s.openDistricts) continue;
    const score = Math.hypot(x - cx, (y - cy) * 1.4) + ((hash(k + seed) % 1000) / 1000) * 9;
    if (score < bestScore) { bestScore = score; best = k; }
  }
  return best;
}

// ---- render.js ----
// Disegno della città su canvas, tutto vettoriale così resta nitido a ogni zoom: campagna a campi,
// strade con marciapiedi e sampietrini, case in vista tre quarti con persiane e tetti in coppi,
// alberi italiani, piazza, mare. Uno strato fisso si ridisegna solo quando cambia qualcosa;
// sopra, uno strato leggero anima onde, fontana, barche e automobili.

const T = 32; // lato di una casella in unità del mondo
const PS = 6;        // risoluzione delle trame: pixel per unità del mondo
const BAR_AT = 50;   // al traguardo dei 50 abitanti in piazza arrivano i tavolini del bar

const roofColor = (id) => (ROOFS.find((r) => r.id === id) || ROOFS[0]).color;
const doorColor = (id) => (DOORS.find((r) => r.id === id) || DOORS[0]).color;

/* Colori e rumore ------------------------------------------------------- */

function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
}
function toHex([r, g, b]) {
  const f = (c) => Math.max(0, Math.min(255, Math.round(c)));
  return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
}
function mix(a, b, t) {
  const x = rgb(a), y = rgb(b);
  return toHex([x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t]);
}
function shade(hex, amt) {
  const c = rgb(hex);
  return toHex(c.map((v) => v + amt * 255));
}
// Hash intero veloce e rumore morbido, per variazioni naturali e sempre uguali.
function ih(a, b, s = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = ih(xi, yi, s), b = ih(xi + 1, yi, s), c = ih(xi, yi + 1, s), d = ih(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const clamp01 = (v) => Math.max(0, Math.min(1, v));

/* Trame (create una volta per contesto, ad alta risoluzione) ----------- */

const patternCache = new WeakMap();
function makePattern(g, w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * PS);
  cv.height = Math.round(h * PS);
  const c = cv.getContext('2d');
  c.scale(PS, PS);
  draw(c, w, h);
  const p = g.createPattern(cv, 'repeat');
  if (p && typeof p.setTransform === 'function') p.setTransform(new DOMMatrix([1 / PS, 0, 0, 1 / PS, 0, 0]));
  return p;
}
function pats(g) {
  let p = patternCache.get(g);
  if (p) return p;
  p = {};
  p.grass = makePattern(g, 32, 32, (c) => {
    for (let i = 0; i < 46; i++) {
      const x = ih(i, 1, 9) * 32, y = ih(i, 2, 9) * 32, l = 1.2 + ih(i, 3, 9) * 1.6;
      c.strokeStyle = ih(i, 4, 9) > 0.5 ? 'rgba(40,90,30,0.22)' : 'rgba(255,255,220,0.2)';
      c.lineWidth = 0.45;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + (ih(i, 5, 9) - 0.5) * 1.2, y - l); c.stroke();
    }
  });
  p.asphalt = makePattern(g, 24, 24, (c) => {
    for (let i = 0; i < 70; i++) {
      c.fillStyle = ih(i, 7, 3) > 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)';
      c.fillRect(ih(i, 8, 3) * 24, ih(i, 9, 3) * 24, 0.5 + ih(i, 1, 3) * 0.6, 0.5 + ih(i, 2, 3) * 0.6);
    }
  });
  // Sampietrini: file sfalsate di pietre arrotondate.
  p.cobble = makePattern(g, 12, 6, (c) => {
    c.fillStyle = '#a9946f'; c.fillRect(0, 0, 12, 6);
    for (let r = 0; r < 2; r++) {
      for (let k = -1; k < 4; k++) {
        const x = k * 3.2 + (r ? 1.6 : 0) + 0.2, y = r * 3 + 0.25;
        const t = ih(k + 5, r, 11);
        c.fillStyle = mix('#d9c8a3', '#c3ad85', t);
        c.beginPath(); c.roundRect(x, y, 2.8, 2.5, 0.9); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(x + 0.5, y + 0.4, 1.4, 0.45);
      }
    }
  });
  // Lastricato della piazza: lastre grandi sfalsate.
  p.paving = makePattern(g, 32, 20, (c) => {
    c.fillStyle = '#cdbd9f'; c.fillRect(0, 0, 32, 20);
    for (let r = 0; r < 2; r++) {
      for (let k = -1; k < 4; k++) {
        const x = k * 10 + (r ? 5 : 0) + 0.3, y = r * 10 + 0.3;
        c.fillStyle = mix('#ece1cb', '#dccfb4', ih(k + 3, r, 21));
        c.fillRect(x, y, 9.4, 9.4);
        c.fillStyle = 'rgba(255,255,255,0.2)'; c.fillRect(x, y, 9.4, 0.6);
      }
    }
  });
  p.sand = makePattern(g, 16, 16, (c) => {
    for (let i = 0; i < 40; i++) {
      c.fillStyle = ih(i, 3, 5) > 0.5 ? 'rgba(160,120,60,0.18)' : 'rgba(255,255,255,0.3)';
      c.fillRect(ih(i, 1, 5) * 16, ih(i, 2, 5) * 16, 0.5, 0.5);
    }
  });
  p.water = makePattern(g, 48, 24, (c) => {
    c.strokeStyle = 'rgba(255,255,255,0.13)';
    c.lineWidth = 0.6;
    for (let i = 0; i < 7; i++) {
      const x = ih(i, 1, 13) * 48, y = ih(i, 2, 13) * 24;
      c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 3, y - 1.2, x + 6, y); c.stroke();
    }
  });
  p.stucco = makePattern(g, 10, 10, (c) => {
    for (let i = 0; i < 18; i++) {
      c.fillStyle = ih(i, 3, 17) > 0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.08)';
      c.fillRect(ih(i, 1, 17) * 10, ih(i, 2, 17) * 10, 0.6, 0.6);
    }
  });
  // Tetto in coppi: file di tegole curve, da sovrapporre al colore del tetto.
  p.roof = makePattern(g, 3, 2.2, (c) => {
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(0, 1.75, 3, 0.45);
    c.strokeStyle = 'rgba(0,0,0,0.16)'; c.lineWidth = 0.25;
    c.beginPath(); c.moveTo(1.5, 0); c.lineTo(1.5, 1.8); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(0.2, 0.15, 1, 0.5); c.fillRect(1.7, 0.15, 1, 0.5);
  });
  // Campi: file di coltivazione orizzontali o verticali.
  for (const [crop, base, row, extra] of [
    ['wheat', '#e3c76d', '#cfae4f', 'rgba(255,240,180,0.35)'],
    ['vine', '#c8b285', '#5f8f3c', '#7aa94f'],
    ['green', '#b8d074', '#97b556', 'rgba(255,255,255,0.15)'],
    ['plow', '#b98f66', '#9b724d', 'rgba(255,230,200,0.15)'],
  ]) {
    for (const dir of ['h', 'v']) {
      p[`${crop}-${dir}`] = makePattern(g, 16, 16, (c) => {
        c.fillStyle = base; c.fillRect(0, 0, 16, 16);
        if (dir === 'v') { c.translate(16, 0); c.rotate(Math.PI / 2); }
        for (let r = 0; r < 4; r++) {
          const y = r * 4 + 1.2;
          if (crop === 'vine') {
            c.fillStyle = 'rgba(90,60,30,0.35)'; c.fillRect(0, y + 1.2, 16, 0.35);
            for (let k = 0; k < 6; k++) { c.fillStyle = k % 2 ? row : extra; c.beginPath(); c.arc(k * 2.7 + 1.3, y + 1, 1.15, 0, 7); c.fill(); }
          } else {
            c.fillStyle = row; c.fillRect(0, y, 16, 1.5);
            c.fillStyle = extra; c.fillRect(0, y + 1.6, 16, 0.6);
            if (crop === 'wheat') for (let k = 0; k < 8; k++) { c.fillStyle = 'rgba(160,120,40,0.35)'; c.fillRect(k * 2 + 0.5, y - 0.6, 0.35, 0.8); }
            if (crop === 'green') for (let k = 0; k < 5; k++) { c.fillStyle = '#7fa646'; c.beginPath(); c.arc(k * 3.2 + 1.6, y + 0.7, 0.9, 0, 7); c.fill(); }
          }
        }
      });
    }
  }
  patternCache.set(g, p);
  return p;
}

/* Terreno e alberi (calcolati una volta per numero di quartieri aperti) --- */

const CROPS = ['wheat', 'wheat', 'vine', 'green', 'plow', 'olive', 'wheat', 'vine'];
const groundCache = new Map();

function getGround(open) {
  if (groundCache.has(open)) return groundCache.get(open);
  const kind = new Uint8Array(W * H);  // 0 erba quartiere, 1 prato, 2 campo, 3 spiaggia, 4 mare, 5 uliveto
  const color = new Array(W * H);
  const crop = new Array(W * H);
  const parcel = new Int32Array(W * H);
  const trees = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const d = districtAt(x, y);
      const n = vnoise(x / 7, y / 7, 1);
      const j = (ih(x, y, 2) - 0.5) * 0.08;
      if (y > SEA_Y) {
        kind[i] = 4;
        color[i] = mix('#86cfe2', '#3c8cbb', clamp01((y - SEA_Y - 1) / 6 + (vnoise(x / 5, y / 3, 4) - 0.5) * 0.25));
      } else if (y === SEA_Y) {
        kind[i] = 3;
        color[i] = mix('#f1dea9', '#e8d197', ih(x, y, 3));
      } else if (d && d <= open) {
        kind[i] = 0;
        color[i] = mix('#b6d987', '#90bf68', clamp01(n + j));
      } else if (d) {
        // Campagna dei quartieri futuri: appezzamenti a mosaico.
        const px = Math.floor((x + (Math.floor(y / 4) % 2) * 3) / 6), py = Math.floor(y / 4);
        const c = CROPS[Math.floor(ih(px, py, 7) * CROPS.length)];
        parcel[i] = px * 1000 + py;
        crop[i] = c === 'olive' ? 'olive' : `${c}-${ih(px, py, 8) > 0.5 ? 'h' : 'v'}`;
        kind[i] = c === 'olive' ? 5 : 2;
        color[i] = c === 'olive' ? mix('#c3d394', '#aac07c', n) : { wheat: '#e3c76d', vine: '#c8b285', green: '#b8d074', plow: '#b98f66' }[c];
        if (c === 'olive' && x % 2 === 0 && y % 2 === 1 && !PLAN.futureRoads.has(key(x, y))) {
          trees.push({ x: x * T + 16 + (ih(x, y, 9) - 0.5) * 8, y: y * T + 26, kind: 'ulivo', s: 0.8 + ih(x, y, 10) * 0.25 });
        }
      } else {
        kind[i] = 1;
        color[i] = mix('#a9d27a', '#7fae58', clamp01(n + j));
      }
    }
  }
  // Boschi e filari fuori dal piano regolatore.
  for (let y = 0; y < SEA_Y; y++) {
    for (let x = 0; x < W; x++) {
      if (districtAt(x, y) || Math.abs(y - MAIN_Y) <= 0) continue;
      const tx = x * T + 16 + (ih(x, y, 11) - 0.5) * 14, ty = y * T + 20 + (ih(x, y, 12) - 0.5) * 12;
      if (Math.abs(y - MAIN_Y) === 1) {
        // Cipressi lungo la strada principale, come nelle strade di campagna toscane.
        if (x % 2 === 0) trees.push({ x: x * T + 16, y: y === MAIN_Y - 1 ? y * T + 27 : y * T + 30, kind: 'cipresso', s: 0.95 + ih(x, y, 13) * 0.2 });
        continue;
      }
      const forest = vnoise(x / 5, y / 5, 6);
      const p = forest > 0.58 ? 0.8 : 0.07;
      if (ih(x, y, 14) > p) continue;
      const kindT = y >= SEA_Y - 6 ? 'pino' : ih(x, y, 15) > 0.78 ? 'cipresso' : 'tondo';
      trees.push({ x: tx, y: ty, kind: kindT, s: 0.85 + ih(x, y, 16) * 0.4 });
    }
  }
  // Pini marittimi sulla costa della Marina, fuori dai lotti.
  for (let x = 0; x < W; x += 1) {
    const y = SEA_Y - 1;
    if (districtAt(x, y) && districtAt(x, y) <= open) continue;
    if (ih(x, y, 17) > 0.35) continue;
    trees.push({ x: x * T + 16, y: y * T + 28, kind: 'pino', s: 0.9 + ih(x, y, 18) * 0.3 });
  }
  const gcache = { kind, color, crop, parcel, trees };
  groundCache.set(open, gcache);
  return gcache;
}

function drawGround(g, G, view, det) {
  const P = det ? pats(g) : null;
  const { x0, y0, x1, y1 } = view;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = y * W + x;
      const px = x * T, py = y * T;
      g.fillStyle = G.color[i];
      g.fillRect(px, py, T + (P ? 0.5 : 2), T + (P ? 0.5 : 2));
      if (!P) continue;
      const k = G.kind[i];
      if (k === 0 || k === 1 || k === 5) {
        g.fillStyle = P.grass; g.fillRect(px, py, T, T);
        if (k !== 5 && ih(x, y, 20) > 0.86) flowers(g, px, py, ih(x, y, 21));
      } else if (k === 2) {
        g.fillStyle = P[G.crop[i]]; g.fillRect(px, py, T, T);
      } else if (k === 3) {
        g.fillStyle = P.sand; g.fillRect(px, py, T, T);
        g.fillStyle = 'rgba(190,160,100,0.35)'; g.fillRect(px, py + T - 7, T, 3);
      } else if (k === 4) {
        g.fillStyle = P.water; g.fillRect(px, py, T, T);
      }
    }
  }
  if (!P) return;
  // Siepi tra un campo e l'altro.
  g.fillStyle = '#6f9a4f';
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = y * W + x;
      if (G.kind[i] !== 2 && G.kind[i] !== 5) continue;
      if (x + 1 < W && (G.kind[i + 1] === 2 || G.kind[i + 1] === 5) && G.parcel[i + 1] !== G.parcel[i]) hedge(g, x * T + T - 1.5, y * T, 3, T);
      if (y + 1 < H && (G.kind[i + W] === 2 || G.kind[i + W] === 5) && G.parcel[i + W] !== G.parcel[i]) hedge(g, x * T, y * T + T - 1.5, T, 3);
    }
  }
}
function hedge(g, x, y, w, h) {
  g.fillStyle = '#5f8d44'; g.beginPath(); g.roundRect(x, y, w, h, 1.5); g.fill();
  g.fillStyle = 'rgba(160,210,110,0.4)';
  g.fillRect(x + (w > h ? 0 : 0.5), y + (w > h ? 0.4 : 0), w > h ? w : 1, w > h ? 0.8 : h);
}
function flowers(g, px, py, r) {
  const cols = ['#ffffff', '#f6d84a', '#e86b8a', '#b48be0'];
  for (let k = 0; k < 4; k++) {
    g.fillStyle = cols[(k + Math.floor(r * 4)) % 4];
    g.beginPath(); g.arc(px + 6 + ih(k, r * 100, 1) * 20, py + 6 + ih(k, r * 100, 2) * 20, 0.9, 0, 7); g.fill();
  }
}

/* Alberi ------------------------------------------------------------------ */

function treeShadow(g, x, y, rx) {
  g.fillStyle = 'rgba(30,50,20,0.22)';
  g.beginPath(); g.ellipse(x + 4, y + 0.5, rx, rx * 0.36, 0, 0, Math.PI * 2); g.fill();
}
function drawTree(g, t, det) {
  const { x, y, s } = t;
  if (t.kind === 'cipresso') {
    treeShadow(g, x + 2, y, 5 * s);
    g.fillStyle = '#2c5537';
    g.beginPath(); g.ellipse(x, y - 14 * s, 4.4 * s, 14.5 * s, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#3d7049';
    g.beginPath(); g.ellipse(x - 1.3 * s, y - 15 * s, 2.3 * s, 12.5 * s, 0, 0, Math.PI * 2); g.fill();
    if (det) { g.fillStyle = 'rgba(160,220,140,0.25)'; g.beginPath(); g.ellipse(x - 1.8 * s, y - 19 * s, 0.9 * s, 6 * s, 0, 0, 7); g.fill(); }
  } else if (t.kind === 'pino') {
    treeShadow(g, x + 5, y, 10 * s);
    g.strokeStyle = '#6b4a2f'; g.lineWidth = 2.2 * s; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 1 * s, y - 10 * s, x + 2.5 * s, y - 17 * s); g.stroke();
    g.fillStyle = '#365f36';
    g.beginPath(); g.ellipse(x + 2.5 * s, y - 19 * s, 12 * s, 5.8 * s, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#4f8248';
    g.beginPath(); g.ellipse(x + 1 * s, y - 20.5 * s, 8.5 * s, 3.6 * s, 0, 0, Math.PI * 2); g.fill();
    if (det) { g.fillStyle = 'rgba(190,230,150,0.3)'; g.beginPath(); g.ellipse(x - 1 * s, y - 21.5 * s, 4 * s, 1.4 * s, 0, 0, 7); g.fill(); }
  } else if (t.kind === 'ulivo') {
    treeShadow(g, x, y, 7 * s);
    g.strokeStyle = '#76604a'; g.lineWidth = 1.8 * s; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 2 * s, y - 4 * s, x - 0.5 * s, y - 8 * s); g.moveTo(x + 0.6 * s, y - 3 * s); g.lineTo(x + 3 * s, y - 7 * s); g.stroke();
    for (const [dx, dy, r, c] of [[-2.5, -10, 5, '#8fa36e'], [3, -10.5, 4.6, '#8fa36e'], [0, -13, 5, '#9db37c'], [-1.5, -13.8, 2.6, '#bccb9d']]) {
      g.fillStyle = c; g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill();
    }
  } else if (t.kind === 'cespuglio') {
    treeShadow(g, x, y, 5 * s);
    for (const [dx, dy, r, c] of [[-2.5, -3, 3.6, '#4f8a45'], [2.5, -3, 3.4, '#4f8a45'], [0, -5, 3.8, '#62a052'], [-1, -6.4, 1.6, '#86bd6c']]) {
      g.fillStyle = c; g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill();
    }
  } else {
    treeShadow(g, x, y, 9 * s);
    g.fillStyle = '#76533a'; g.fillRect(x - 1.4 * s, y - 8 * s, 2.8 * s, 8 * s);

/* Strade ------------------------------------------------------------------ */

// Ogni tipo ha un bordo (marciapiede o cordolo) e una superficie.
const ROAD = {
  main: { side: 0.96, surf: 0.66, sideColor: '#d8d1c3', surfColor: '#5b5f66' },
  dorsal: { side: 0.8, surf: 0.54, sideColor: '#d8d1c3', surfColor: '#62666d' },
  lane: { side: 0.42, surf: 0.34, sideColor: '#a8936d', surfColor: '#d6c49f' },
};

function roadPass(g, roads, view, types, layer, fill) {
  const { x0, y0, x1, y1 } = view;
  g.fillStyle = fill;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const t = roads[key(x, y)];
      if (!types.includes(t)) continue;
      const w = ROAD[t][layer] * T;
      const cx = x * T + T / 2, cy = y * T + T / 2;
      g.beginPath();
      g.roundRect(cx - w / 2, cy - w / 2, w, w, t === 'lane' ? w / 3 : 2);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = roads[key(x + dx, y + dy)];
        if (!n || n === 'piazza') { if (n === 'piazza' && t === 'lane') g.rect(dx ? (dx > 0 ? cx : cx - T / 2) : cx - w / 2, dy ? (dy > 0 ? cy : cy - T / 2) : cy - w / 2, dx ? T / 2 : w, dy ? T / 2 : w); continue; }
        const aw = Math.min(w, ROAD[n][layer] * T);
        if (dx) g.rect(dx > 0 ? cx : cx - T / 2 - 0.3, cy - aw / 2, T / 2 + 0.3, aw);
        else g.rect(cx - aw / 2, dy > 0 ? cy : cy - T / 2 - 0.3, aw, T / 2 + 0.3);
      }
      g.fill();
    }
  }
}

function drawRoads(g, roads, view, det) {
  const P = det ? pats(g) : null;
  roadPass(g, roads, view, ['lane'], 'side', ROAD.lane.sideColor);
  roadPass(g, roads, view, ['lane'], 'surf', P ? P.cobble : ROAD.lane.surfColor);
  roadPass(g, roads, view, ['dorsal', 'main'], 'side', '#c9c1b1');
  if (P) { g.save(); g.translate(0, -0.8); roadPass(g, roads, view, ['dorsal', 'main'], 'side', ROAD.main.sideColor); g.restore(); }
  roadPass(g, roads, view, ['dorsal', 'main'], 'surf', ROAD.main.surfColor);
  if (P) roadPass(g, roads, view, ['dorsal', 'main'], 'surf', P.asphalt);
  // Segnaletica: tratteggio centrale, linee di bordo, strisce pedonali dove arriva una via.
  const { x0, y0, x1, y1 } = view;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const t = roads[key(x, y)];
      if (t !== 'main' && t !== 'dorsal') continue;
      const horiz = roads[key(x - 1, y)] === t || roads[key(x + 1, y)] === t;
      const vert = roads[key(x, y - 1)] === t || roads[key(x, y + 1)] === t;
      const cx = x * T + T / 2, cy = y * T + T / 2, hw = (ROAD[t].surf * T) / 2;
      g.fillStyle = 'rgba(255,255,255,0.85)';
      if (horiz && !vert) {
        g.fillRect(x * T + 7, cy - 0.6, 16, 1.2);
        if (det) { g.fillStyle = 'rgba(255,255,255,0.45)'; g.fillRect(x * T, cy - hw + 1.2, T, 0.6); g.fillRect(x * T, cy + hw - 1.8, T, 0.6); }
        // Strisce pedonali dove la strada si attraversa davvero, e davanti alla piazza.
        const side = (dy) => ['lane', 'dorsal'].includes(roads[key(x, y + dy)]);
        if (det && t === 'main' && ((side(-1) && side(1)) || x === PIAZZA.x0 + 3)) {
          g.fillStyle = 'rgba(255,255,255,0.9)';
          for (let k = 0; k < 5; k++) g.fillRect(cx - 5, cy - hw + 1.5 + k * ((hw * 2 - 3) / 5), 10, 2.2);
        }
      } else if (vert && !horiz) {
        g.fillRect(cx - 0.6, y * T + 7, 1.2, 16);
      }
    }
  }
}

function drawFutureRoads(g, openDistricts, view) {
  g.save();
  g.strokeStyle = 'rgba(255,255,255,0.85)';
  g.lineWidth = 2.4;
  g.setLineDash([7, 6]);
  g.lineCap = 'round';
  for (const d of DISTRICTS) {
    if (!d.dorsal || d.id <= openDistricts) continue;
    const r = d.dorsal;
    g.beginPath();
    if (r.x !== undefined) { if (r.x < view.x0 - 1 || r.x > view.x1 + 1) continue; g.moveTo(r.x * T + T / 2, r.y0 * T); g.lineTo(r.x * T + T / 2, (r.y1 + 1) * T); }
    else { if (r.y < view.y0 - 1 || r.y > view.y1 + 1) continue; g.moveTo(r.x0 * T, r.y * T + T / 2); g.lineTo((r.x1 + 1) * T, r.y * T + T / 2); }
    g.stroke();
  }
  g.restore();
}

// Oggetti della piazza che hanno profondità: ordinati insieme a case e alberi.

  const [ex, ey] = PIAZZA_SPOTS.edicola;

  const [mx, my] = PIAZZA_SPOTS.muro[0];
  out.push({ y: my * T + 22, draw: (g, det) => muro(g, mx * T, my * T, founders, det) });

  for (const [px, py] of [[PIAZZA.x0 + 0.35, PIAZZA.y1 + 0.72], [PIAZZA.x1 + 0.65, PIAZZA.y1 + 0.72], [PIAZZA.x0 + 2.6, PIAZZA.y0 + 0.62]]) {
    out.push({ y: py * T + 3, draw: (g) => planter(g, px * T, py * T) });
  }
  for (const lx of [PIAZZA.x0 + 2.5, PIAZZA.x1 - 1.5]) out.push({ y: (PIAZZA.y1 + 0.95) * T, lamp: true, x: lx * T, draw: (g) => lampPost(g, lx * T, (PIAZZA.y1 + 0.95) * T) });

}

function wallFace(c, x, y, w, h) {
  const { g, wall, P } = c;
  const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, shade(wall, 0.04)); gr.addColorStop(1, shade(wall, -0.05));
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  if (P) { g.fillStyle = P.stucco; g.fillRect(x, y, w, h); }
  g.fillStyle = shade(wall, -0.2); g.fillRect(x, y + h - 1.6, w, 1.6);
}
function sideFace(c, pts) {
  const { g, wall } = c;
  poly(g, pts); g.fillStyle = shade(wall, -0.17); g.fill();
  g.fillStyle = shade(wall, -0.3); g.fillRect(pts[3][0], pts[3][1] - 1.6, pts[2][0] - pts[3][0], 1.6);
}

  const { g, P } = c;
  poly(g, pts); g.fillStyle = color; g.fill();
  if (P) { g.fillStyle = P.roof; g.fill(); }
  g.strokeStyle = shade(color, -0.25); g.lineWidth = 0.7; g.lineJoin = 'round'; g.stroke();
}

  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
}

  const gr = g.createLinearGradient(0, y, 0, y + 2.6);
  gr.addColorStop(0, 'rgba(40,25,10,0.32)'); gr.addColorStop(1, 'rgba(40,25,10,0)');
  g.fillStyle = gr; g.fillRect(x, y, w, 2.6);
}
function windowAt(c, x, y, w, h, { shutters = true, arch = false } = {}) {
  const { g, door, lit, night, detail } = c;
  if (shutters && detail) {
    const sc = door === '#f1ede4' ? '#e6e1d5' : door;
    for (const sx of [x - 1.65, x + w + 0.15]) {
      g.fillStyle = sc; g.fillRect(sx, y - 0.2, 1.5, h + 0.4);
      g.fillStyle = 'rgba(0,0,0,0.18)';
      for (let k = 0.7; k < h; k += 1) g.fillRect(sx + 0.15, y + k, 1.2, 0.25);

    g.fillStyle = 'rgba(246,241,230,0.95)'; g.fillRect(x + w / 2 - 0.25, y, 0.5, h); g.fillRect(x, y + h * 0.45, w, 0.45);
    if (!lit && !night) { g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.moveTo(x + 0.3, y + h - 0.5); g.lineTo(x + 0.3, y + 0.4); g.lineTo(x + w * 0.4, y + 0.4); g.closePath(); g.fill(); }

    g.fillStyle = '#d8b34a'; g.beginPath(); g.arc(x + w * 0.72, y + h * 0.62, 0.38, 0, 7); g.fill();

  g.fillStyle = '#cfc6b2'; g.fillRect(x - 1.4, y + h - 0.2, w + 2.8, 1.2);
}
function chimney(c, x, y) {
  const { g, wall } = c;
  g.fillStyle = shade(wall, -0.12); g.fillRect(x, y, 3, 5.5);
  g.fillStyle = shade(wall, -0.25); g.fillRect(x + 2, y, 1, 5.5);
  g.fillStyle = '#8c4a35'; g.fillRect(x - 0.6, y - 1, 4.2, 1.3);
}

const SHAPES_DRAW = {
  casa(c) {
    const { g } = c;
    sideFace(c, [[26, 14.5], [29.2, 12.8], [29.2, 26.4], [26, 28]]);
    wallFace(c, 6, 14.5, 20, 13.5);
    roofPoly(c, [[16, 3.2], [19.4, 1.6], [30.8, 12.9], [27.7, 14.9]], shade(c.roof, -0.12));
    chimney(c, 21.5, 2.6);
    roofPoly(c, [[4.3, 14.9], [16, 3.2], [27.7, 14.9]], c.roof);
    eaveShadow(g, 6, 14.9, 20);

    windowAt(c, 20, 17.4, 3.9, 4.4);
    doorAt(c, 13.9, 19.4, 4.2, 8.6);
    c.plaque = [11.2, 23.4];
  },
  villetta(c) {
    const { g } = c;

    doorAt(c, 13.4, 20, 4.2, 8);

    c.plaque = [10.8, 23.6];
  },
  torretta(c) {
    const { g } = c;

    windowAt(c, 20.6, 16.6, 3.8, 4.4);
    // Balconcino con ringhiera
    g.fillStyle = '#e8e0cf'; g.fillRect(19.2, 21.6, 6.6, 1);
    if (c.detail) { g.fillStyle = '#3b3f45'; for (let k = 0; k < 7; k++) g.fillRect(19.4 + k * 1.05, 19.6, 0.3, 2); g.fillRect(19.2, 19.4, 6.6, 0.4); }
    windowAt(c, 6.9, 18.6, 3.6, 4.2);
    doorAt(c, 12.9, 20, 4.2, 8);
    c.plaque = [10.3, 24.2];

};

function yard(g, garden, P) {
  if (garden === 'nessuno') {
    g.fillStyle = '#e2d4b2'; g.beginPath(); g.roundRect(1, 27, 30, 4.6, 1.5); g.fill();
    if (P) { g.fillStyle = P.sand; g.fillRect(1, 27, 30, 4.6); }
  } else if (garden === 'prato') {
    g.fillStyle = 'rgba(200,235,150,0.45)'; g.beginPath(); g.roundRect(1.5, 27.6, 29, 4, 1.5); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.18)'; for (let k = 0; k < 5; k++) g.fillRect(2 + k * 6, 27.8, 3, 3.6);
  }
}
function frontGarden(c, garden, deco) {
  const { g } = c;
  if (garden === 'fiori') {
    const cols = ['#e85d75', '#f2c14e', '#ffffff', '#b07cd8', '#ff8a5c'];
    const bed = (x, w) => {
      g.fillStyle = '#7a5a3c'; g.beginPath(); g.roundRect(x, 27.3, w, 3.6, 1.4); g.fill();
      g.fillStyle = '#4f8a45'; for (let k = 0; k < w / 1.6; k++) { g.beginPath(); g.arc(x + 0.8 + k * 1.6, 28.4 + (k % 2) * 1.2, 0.9, 0, 7); g.fill(); }
      for (let k = 0; k < w / 1.4; k++) { g.fillStyle = cols[k % cols.length]; g.beginPath(); g.arc(x + 0.7 + k * 1.4, 28 + ((k * 7) % 3) * 0.9, 0.6, 0, 7); g.fill(); }
    };
    bed(0.8, 5);
    if (deco === 'nessuno') bed(26.2, 5);
    // Vasi di gerani sotto le finestre al piano terra
    for (const [x, y, w, h] of c.wins) {
      if (y < 15) continue;
      g.fillStyle = '#b8643d'; g.fillRect(x - 0.5, y + h + 1.5, w + 1, 1.1);
      for (let k = 0; k < 4; k++) { g.fillStyle = k % 2 ? '#e83f4f' : '#4f8a45'; g.beginPath(); g.arc(x + 0.3 + k * (w / 3.3), y + h + 1.3, 0.7, 0, 7); g.fill(); }
    }
  } else if (garden === 'orto') {
    g.fillStyle = '#7a5a3c'; g.beginPath(); g.roundRect(0.4, 21, 4.8, 9.8, 1); g.fill();
    g.fillStyle = '#5b3f28'; g.fillRect(0.4, 30.2, 4.8, 0.6);
    for (let r = 0; r < 4; r++) for (let k = 0; k < 2; k++) { g.fillStyle = r % 2 ? '#7fbf4a' : '#5f9e3a'; g.beginPath(); g.arc(1.7 + k * 2.2, 22.4 + r * 2.2, 0.95, 0, 7); g.fill(); }
    g.fillStyle = '#d8442f'; g.beginPath(); g.arc(3.9, 24.6, 0.5, 0, 7); g.arc(1.6, 28.9, 0.5, 0, 7); g.fill();
  } else if (garden === 'ulivo') {
    drawTree(g, { x: 3.2, y: 29.5, kind: 'ulivo', s: 0.62 }, c.detail);
  }
}

    g.fillStyle = '#f6d533'; for (const [x, y] of [[26, 22.2], [28.8, 21], [27.6, 23.2], [29.2, 22.8]]) { g.beginPath(); g.ellipse(x, y, 0.7, 0.55, 0.3, 0, 7); g.fill(); }
  } else if (deco === 'cane') {

    g.fillStyle = '#b5523b'; g.beginPath(); g.moveTo(22.3, 25.9); g.lineTo(25.7, 22.8); g.lineTo(29.1, 25.9); g.closePath(); g.fill();
    g.fillStyle = '#3d2a1c'; g.beginPath(); g.moveTo(24.7, 30); g.lineTo(24.7, 27.6); g.arc(25.7, 27.6, 1, Math.PI, 0); g.lineTo(26.7, 30); g.closePath(); g.fill();
    // Il cane, seduto accanto
    g.fillStyle = '#e8c48f'; g.beginPath(); g.ellipse(29.8, 29, 1.5, 1.4, 0, 0, 7); g.fill();

    g.fillStyle = '#8a5a32'; g.beginPath(); g.ellipse(29.5, 26.9, 0.45, 0.8, -0.4, 0, 7); g.fill();
    g.fillStyle = '#222'; g.fillRect(30.4, 27.1, 0.35, 0.35);

}

function drawSite(g, P) {
  g.fillStyle = '#cfc8bb'; g.fillRect(4, 22, 24, 6.6);
  g.fillStyle = '#b8b0a2'; g.fillRect(4, 27.8, 24, 0.8);

  // Ponteggio
  g.strokeStyle = '#8a6a3e'; g.lineWidth = 0.9;

  g.moveTo(4.6, 22); g.lineTo(16, 12); g.moveTo(16, 22); g.lineTo(27.4, 12);
  g.stroke();
  g.fillStyle = '#c99a5a'; g.fillRect(3.6, 11.4, 25, 1.4); g.fillRect(3.6, 19.8, 25, 1.4);

  // Mattoni sul bancale, cono e cartello
