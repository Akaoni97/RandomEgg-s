  g.fillStyle = '#ff8a2a'; g.beginPath(); g.moveTo(28.5, 30.6); g.lineTo(31.5, 30.6); g.lineTo(30, 25.6); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.fillRect(29.2, 27.6, 1.6, 0.8);
  g.fillStyle = '#f2c230'; g.fillRect(19, 24, 8, 4.4);
  g.fillStyle = '#222'; for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(19 + i * 2, 28.4); g.lineTo(20 + i * 2, 24); g.lineTo(21 + i * 2, 24); g.lineTo(20 + i * 2, 28.4); g.closePath(); g.fill(); }
}

// Disegna una casa nella casella (coordinate locali 0..32). Restituisce le finestre, per accenderle di sera.
function drawHouse(g, style, { lit = false, night = false, founder = false, cantiere = false, flag = null, detail = true } = {}) {
  const P = detail ? pats(g) : null;
  const wins = [];
  g.fillStyle = 'rgba(25,40,15,0.24)';
  g.beginPath(); g.ellipse(19, 28.6, 14.5, 3.4, 0, 0, Math.PI * 2); g.fill();
  yard(g, style.garden, P);
  if (cantiere) { drawSite(g, P); return wins; }
  const c = { g, P, wall: style.wall, roof: roofColor(style.roof), door: doorColor(style.door), lit, night, wins, detail, plaque: null };
  (SHAPES_DRAW[style.shape] || SHAPES_DRAW.casa)(c);
  if (founder && c.plaque) {
    const [px, py] = c.plaque;
    g.fillStyle = '#e2bf4f'; g.beginPath(); g.roundRect(px, py, 2.3, 1.8, 0.4); g.fill();
    g.fillStyle = '#9b7a16'; g.fillRect(px + 0.5, py + 0.7, 1.3, 0.35);
  }
  if (detail) frontGarden(c, style.garden, style.deco);
  else if (style.garden === 'ulivo') frontGarden(c, style.garden, style.deco);
  drawDeco(g, style.deco);
  if (flag) {
    g.fillStyle = '#4a4a4a'; g.fillRect(2.6, 4, 0.7, 12);
    g.fillStyle = flag; g.beginPath(); g.moveTo(3.3, 4); g.quadraticCurveTo(6, 4.8, 8.6, 5.6); g.quadraticCurveTo(6, 6.6, 3.3, 7.6); g.closePath(); g.fill();
  }
  return wins;
}

/* Lampioni e luci della notte ----------------------------------------------- */

function streetLamps(view) {
  const out = [];
  for (let x = Math.max(1, view.x0 - (view.x0 % 5)); x <= view.x1; x += 5) {
    if (x >= PIAZZA.x0 && x <= PIAZZA.x1) continue;
    out.push({ x: x * T + 6, y: MAIN_Y * T + 3.5 });
    out.push({ x: (x + 2) * T + 26, y: (MAIN_Y + 1) * T - 1.2 });
  }
  return out;
}
function glow(g, x, y, r, a, color = '255,214,110') {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${color},${a})`);
  gr.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
}

/* Strato fisso del mondo ---------------------------------------------------- */

// Disegna la porzione `view` (in caselle) sul contesto già trasformato in unità del mondo.
function drawWorld(g, city, view, o) {
  const { x0, y0, x1, y1 } = view;
  const night = !!o.night;
  const det = o.detail !== false;
  const G = getGround(city.openDistricts);
  drawGround(g, G, view, det);
  drawFutureRoads(g, city.openDistricts, view);
  drawRoads(g, city.roads, view, det);
  const piazzaVisible = PIAZZA.x1 >= x0 && PIAZZA.x0 <= x1 && PIAZZA.y1 >= y0 && PIAZZA.y0 <= y1;
  if (piazzaVisible) drawPiazzaFloor(g, city, det);

  // Lotti liberi: contorno tratteggiato e, da vicino, il picchetto "libero".
  g.save();
  g.setLineDash([3.5, 2.5]);
  g.lineWidth = 1.1;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const k = key(x, y);
      if (!PLAN.lots.has(k) || city.houses[k] || districtAt(x, y) > city.openDistricts) continue;
      g.fillStyle = 'rgba(255,255,255,0.14)';
      g.beginPath(); g.roundRect(x * T + 3, y * T + 3, T - 6, T - 6, 4); g.fill();
      g.strokeStyle = o.mode === 'choose' ? '#7a5b14' : 'rgba(255,255,255,0.75)';
      g.stroke();
      if (det) {
        g.save(); g.setLineDash([]);
        g.fillStyle = '#8a6a3e'; g.fillRect(x * T + 22, y * T + 15, 0.9, 10);
        g.fillStyle = '#fffaf0'; g.fillRect(x * T + 18.5, y * T + 12, 8, 4.6);
        g.strokeStyle = '#8a6a3e'; g.lineWidth = 0.4; g.strokeRect(x * T + 18.5, y * T + 12, 8, 4.6);
        g.fillStyle = '#2f6b4f'; g.font = '800 2.6px Nunito, sans-serif'; g.fillText('LIBERO', x * T + 19.1, y * T + 15.2);
        g.restore();
      }
    }
  }
  g.restore();

  // Vialetti dalle porte alle corsie.
  const houses = Object.values(city.houses).filter((h) => {
    const [x, y] = parseKey(h.slot);
    return x >= x0 - 1 && x <= x1 + 1 && y >= y0 - 1 && y <= y1 + 1;
  });
  for (const h of houses) {
    const dir = city.doors?.[h.slot];
    if (!dir) continue;
    const [x, y] = parseKey(h.slot);
    const cx = x * T + T / 2, cy = y * T + T / 2;
    g.fillStyle = '#d9c8a3';
    if (dir === 'S') g.fillRect(cx - 2.4, cy + 12, 4.8, T / 2 - 12);
    else if (dir === 'N') g.fillRect(cx - 2.4, y * T, 4.8, 4);
    else if (dir === 'E') g.fillRect(cx + 10, cy + 10, T / 2 - 10, 4.6);
    else g.fillRect(x * T, cy + 10, T / 2 - 10, 4.6);
  }

  // Tutto ciò che ha altezza, ordinato dal fondo verso chi guarda.
  const items = [];
  for (const t of G.trees) {
    if (t.x < x0 * T - 40 || t.x > (x1 + 1) * T + 40 || t.y < y0 * T - 10 || t.y > (y1 + 2) * T + 40) continue;
    items.push({ y: t.y, tree: t });
  }
  // Cespugli negli incroci liberi delle corsie dei quartieri aperti.
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (x % 3 || y % 3 || y === MAIN_Y) continue;
      const d = districtAt(x, y);
      if (!d || d > city.openDistricts || city.roads[key(x, y)] || inPiazza(x, y) || ih(x, y, 30) > 0.45) continue;
      items.push({ y: y * T + 24, tree: { x: x * T + 16, y: y * T + 24, kind: 'cespuglio', s: 0.8 + ih(x, y, 31) * 0.3 } });
    }
  }
  for (const h of houses) items.push({ y: (parseKey(h.slot)[1] + 1) * T - 3, house: h });
  if (piazzaVisible) for (const p of piazzaProps(city)) items.push(p);
  const lamps = streetLamps(view);
  for (const l of lamps) items.push({ y: l.y, draw: (gg) => lampPost(gg, l.x, l.y) });
  // Ombrelloni sulla spiaggia
  if (SEA_Y >= y0 && SEA_Y <= y1) {
    for (let x = x0; x <= x1; x++) if (x % 3 === 1 && x > 12 && x < 72) items.push({ y: SEA_Y * T + 20, draw: (gg) => umbrella(gg, x * T + 16, SEA_Y * T + 18, x) });
  }
  items.sort((a, b) => a.y - b.y);

  const lights = [];
  for (const it of items) {
    if (it.tree) { drawTree(g, it.tree, det); continue; }
    if (it.draw) { it.draw(g, det); continue; }
    const h = it.house;
    const [x, y] = parseKey(h.slot);
    const r = city.residents[h.residentId];
    const online = o.online?.has(h.residentId);
    const t0 = o.born?.get(h.slot);
    const age = t0 !== undefined ? (o.t || 0) - t0 : Infinity;
    const grow = age < 900 ? easeOutBack(Math.max(0, age) / 900) : 1;
    g.save();
    g.translate(x * T + T / 2, y * T + T);
    g.scale(grow, grow);
    g.translate(-T / 2, -T);
    const wins = drawHouse(g, h.style, {
      lit: night && online, night, founder: isFounder(r), cantiere: h.status === 'cantiere', detail: det,
      flag: h.residentId === o.meId ? '#e0a92a' : o.friends?.has(h.residentId) ? '#3f6aa1' : null,
    });
    g.restore();
    if (night && online) for (const [wx, wy, ww, wh] of wins) lights.push([x * T + wx, y * T + wy, ww, wh]);
  }

  if (night) {
    g.save();
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = '#56649a';
    g.fillRect(x0 * T, y0 * T, (x1 - x0 + 1) * T, (y1 - y0 + 1) * T);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(8,12,34,0.28)';
    g.fillRect(x0 * T, y0 * T, (x1 - x0 + 1) * T, (y1 - y0 + 1) * T);
    g.globalCompositeOperation = 'lighter';
    for (const [lx, ly, lw, lh] of lights) glow(g, lx + lw / 2, ly + lh / 2, 16, 0.35);
    for (const l of lamps) { glow(g, l.x, l.y - 22, 9, 0.6); glow(g, l.x, l.y, 26, 0.22); }
    if (piazzaVisible) {
      for (const p of piazzaProps(city)) if (p.lamp) { glow(g, p.x, p.y - 22, 9, 0.6); glow(g, p.x, p.y, 34, 0.25); }
      const [ex, ey] = PIAZZA_SPOTS.edicola;
      glow(g, ex * T + 16, ey * T + 18, 22, 0.3);
    }
    g.restore();
    for (const [lx, ly, lw, lh] of lights) { g.fillStyle = '#ffdc8a'; g.fillRect(lx, ly, lw, lh); g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillRect(lx + lw / 2 - 0.25, ly, 0.5, lh); }
  }

  // Selezione, nomi, quartieri chiusi.
  const showNames = (o.z || 1) >= 2.2;
  for (const h of houses) {
    const [x, y] = parseKey(h.slot);
    const r = city.residents[h.residentId];
    const sel = o.selected === h.slot;
    if (sel) {
      g.save();
      g.strokeStyle = '#ffd34d'; g.lineWidth = 2.2;
      g.beginPath(); g.ellipse(x * T + 17, y * T + 28.5, 16, 4.8, 0, 0, Math.PI * 2); g.stroke();
      g.restore();
    }
    if (r && (showNames || sel || h.residentId === o.meId)) label(g, x * T + 16, y * T + T + 1, r.username, h.residentId === o.meId, o.z || 1);
  }
  if (o.selected && !city.houses[o.selected] && PLAN.lots.has(o.selected)) {
    const [x, y] = parseKey(o.selected);
    g.save();
    g.strokeStyle = '#d4462f'; g.lineWidth = 2.6;
    g.beginPath(); g.roundRect(x * T + 2, y * T + 2, T - 4, T - 4, 5); g.stroke();
    g.restore();
  }
  g.save();
  g.textAlign = 'center';
  for (const d of DISTRICTS) {
    if (d.id <= city.openDistricts) continue;
    const [a, b, c, e] = d.rect;
    const cx = ((a + c + 1) / 2) * T, cy = ((b + e + 1) / 2) * T + (d.id === 4 ? -2 * T : d.id === 5 ? 2 * T : 0);
    if (cx < x0 * T - 200 || cx > x1 * T + 200 || cy < y0 * T - 100 || cy > y1 * T + 100) continue;
    const z = o.z || 1;
    g.font = `700 ${Math.max(20, 15 / z)}px Fredoka, "Trebuchet MS", sans-serif`;
    g.lineWidth = 4 / Math.max(z, 0.6); g.strokeStyle = 'rgba(255,250,235,0.75)'; g.lineJoin = 'round';
    g.strokeText(d.name, cx, cy);
    g.fillStyle = 'rgba(60,48,20,0.78)'; g.fillText(d.name, cx, cy);
    g.font = `700 ${Math.max(11, 9 / z)}px Nunito, "Trebuchet MS", sans-serif`;
    const sub = d.id === city.openDistricts + 1 ? 'il prossimo quartiere ad aprire' : 'quartiere futuro';
    g.strokeText(sub, cx, cy + Math.max(18, 14 / z)); g.fillText(sub, cx, cy + Math.max(18, 14 / z));
  }
  g.restore();
}

function umbrella(g, x, y, seed) {
  const cols = [['#e85d4a', '#fff'], ['#2f6b9f', '#fff'], ['#f2b632', '#fff'], ['#4f8a72', '#f6efe0']][seed % 4];
  g.fillStyle = 'rgba(120,90,40,0.25)'; g.beginPath(); g.ellipse(x + 4, y + 4, 9, 3.4, 0, 0, 7); g.fill();
  g.fillStyle = '#f6efe0'; g.fillRect(x - 6, y + 2.5, 5, 2.4);
  g.fillStyle = '#6b4a2f'; g.fillRect(x - 0.4, y - 8, 0.8, 11);
  for (let k = 0; k < 8; k++) {
    g.fillStyle = cols[k % 2];
    g.beginPath(); g.moveTo(x, y - 9); g.arc(x, y - 6.5, 8, Math.PI + (k / 8) * Math.PI, Math.PI + ((k + 1) / 8) * Math.PI); g.closePath(); g.fill();
  }
}

/* Strato animato: onde, fontana, barche, automobili ----------------------- */

const CAR_KINDS = ['cinquecento', 'cinquecento', 'ape', 'auto', 'auto', 'bus', 'vespa', 'auto', 'cinquecento', 'auto'];
const CAR_COLORS = ['#e8c95a', '#d9442f', '#6fb3c8', '#f1ede4', '#3f6aa1', '#4f8a72', '#c7c2b8', '#e88a3a'];
function carsFor(built) {
  const n = Math.max(2, Math.min(10, 2 + Math.floor(built / 6)));
  return Array.from({ length: n }, (_, i) => ({
    kind: CAR_KINDS[i % CAR_KINDS.length],
    color: CAR_COLORS[Math.floor(ih(i, 1, 40) * CAR_COLORS.length)],
    dir: i % 2 ? -1 : 1,
    speed: 26 + ih(i, 2, 40) * 22,
    offset: ih(i, 3, 40) * W * T,
  }));
}

function drawCar(g, car, x, y, night) {
  const d = car.dir;
  g.save();
  g.translate(x, y);
  if (d < 0) g.scale(-1, 1);
  const body = night ? shade(car.color, -0.25) : car.color;
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.roundRect(-7, 1.5, 15, 4.5, 2); g.fill();
  if (car.kind === 'bus') {
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.roundRect(-13, 1.8, 27, 5, 2); g.fill();
    g.fillStyle = night ? '#b07a26' : '#e5a12a'; g.beginPath(); g.roundRect(-13, -4, 26, 8.6, 1.6); g.fill();
    g.fillStyle = night ? '#ffe39a' : '#2d3a4a'; for (let k = 0; k < 6; k++) g.fillRect(-11 + k * 3.8, -3, 2.8, 2.2);
    g.fillStyle = '#f6efe0'; g.fillRect(-13, 1.2, 26, 1);
    g.fillStyle = '#2d3a4a'; g.fillRect(10.6, -3, 2, 5);
  } else if (car.kind === 'ape') {
    g.fillStyle = '#8b5e3c'; g.fillRect(-7, -2.6, 7, 5.4);
    g.fillStyle = '#e9b44c'; g.fillRect(-6.4, -3.6, 2.6, 2.6); g.fillStyle = '#e85d4a'; g.fillRect(-3.4, -3.4, 2.6, 2.4);
    g.fillStyle = body; g.beginPath(); g.roundRect(0, -3, 6.2, 6, 2.2); g.fill();
    g.fillStyle = '#2d3a4a'; g.fillRect(3.4, -2.2, 2, 4.4);
  } else if (car.kind === 'vespa') {
    g.fillStyle = body; g.beginPath(); g.ellipse(0, 0, 4.4, 1.4, 0, 0, 7); g.fill();
    g.fillStyle = '#5a3a2a'; g.beginPath(); g.arc(-0.6, -0.2, 1.5, 0, 7); g.fill();
    g.fillStyle = '#f2ead6'; g.beginPath(); g.arc(-0.6, -0.2, 0.9, 0, 7); g.fill();
  } else {
    const len = car.kind === 'cinquecento' ? 12 : 15, wid = car.kind === 'cinquecento' ? 7.4 : 7.8;
    g.fillStyle = '#1f1f1f'; for (const [wx, wy] of [[-len / 2 + 2, -wid / 2 - 0.6], [len / 2 - 4.5, -wid / 2 - 0.6], [-len / 2 + 2, wid / 2 - 1], [len / 2 - 4.5, wid / 2 - 1]]) g.fillRect(wx, wy, 2.6, 1.6);
    g.fillStyle = body; g.beginPath(); g.roundRect(-len / 2, -wid / 2, len, wid, car.kind === 'cinquecento' ? 3.4 : 2); g.fill();
    g.fillStyle = shade(body, 0.12); g.beginPath(); g.roundRect(-len / 2 + 3, -wid / 2 + 1.1, len - 6.5, wid - 2.2, 1.6); g.fill();
    g.fillStyle = night ? '#1b2333' : '#33465a'; g.beginPath(); g.roundRect(len / 2 - 4, -wid / 2 + 1, 1.8, wid - 2, 0.6); g.fill();
    g.fillRect(-len / 2 + 1.6, -wid / 2 + 1.4, 1.2, wid - 2.8);
    g.fillStyle = '#fff6c9'; g.fillRect(len / 2 - 0.8, -wid / 2 + 0.8, 0.8, 1.2); g.fillRect(len / 2 - 0.8, wid / 2 - 2, 0.8, 1.2);
    g.fillStyle = '#c0392b'; g.fillRect(-len / 2, -wid / 2 + 0.8, 0.6, 1.1); g.fillRect(-len / 2, wid / 2 - 1.9, 0.6, 1.1);
  }
  if (night) {
    g.globalCompositeOperation = 'lighter';
    const front = car.kind === 'bus' ? 13 : car.kind === 'vespa' ? 4.4 : 7.5;
    const gr = g.createLinearGradient(front, 0, front + 22, 0);
    gr.addColorStop(0, 'rgba(255,240,180,0.45)'); gr.addColorStop(1, 'rgba(255,240,180,0)');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(front, -2.5); g.lineTo(front + 22, -7); g.lineTo(front + 22, 7); g.lineTo(front, 2.5); g.closePath(); g.fill();
    glow(g, -front, 0, 4, 0.5, '255,60,40');
  }
  g.restore();
}

function drawBoat(g, x, y, i, night) {
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.moveTo(-14, 1); g.lineTo(-30, -1); g.lineTo(-30, 3); g.closePath(); g.fill();
  g.fillStyle = night ? '#c9c4b8' : '#fbf7ee'; g.beginPath(); g.moveTo(-9, -2.6); g.lineTo(7, -2.6); g.quadraticCurveTo(11, 0, 7, 2.6); g.lineTo(-9, 2.6); g.closePath(); g.fill();
  g.fillStyle = '#8b5e3c'; g.fillRect(-6, -1.4, 10, 2.8);
  g.fillStyle = i % 2 ? '#e85d4a' : '#f6efe0'; g.beginPath(); g.moveTo(-1, -1); g.lineTo(-1, -15); g.lineTo(8, -2); g.closePath(); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.12)'; g.beginPath(); g.moveTo(-1, -15); g.lineTo(-1, -1); g.lineTo(2, -1); g.closePath(); g.fill();
  g.restore();
}

function drawAmbient(g, city, view, o, t) {
  const night = !!o.night;
  const s = t / 1000;
  const { x0, y0, x1, y1 } = view;
  // Onde e schiuma
  if (y1 >= SEA_Y) {
    g.save();
    g.strokeStyle = night ? 'rgba(200,220,255,0.25)' : 'rgba(255,255,255,0.55)';
    g.lineWidth = 0.9; g.lineCap = 'round';
    for (let y = Math.max(SEA_Y + 1, y0); y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const r = ih(x, y, 50);
        if (r < 0.55) continue;
        const ph = (s * 0.5 + r * 10) % 1;
        const wx = x * T + ((r * 97 + s * 7) % T), wy = y * T + 8 + r * 16;
        g.globalAlpha = Math.sin(ph * Math.PI);
        g.beginPath(); g.moveTo(wx - 4, wy); g.quadraticCurveTo(wx, wy - 1.6, wx + 4, wy); g.stroke();
      }
    }
    g.globalAlpha = 1;
    if (SEA_Y >= y0 && SEA_Y <= y1) {
      g.strokeStyle = night ? 'rgba(220,235,255,0.5)' : 'rgba(255,255,255,0.9)';
      g.lineWidth = 1.8;
      g.beginPath();
      for (let px = x0 * T; px <= (x1 + 1) * T; px += 4) {
        const py = SEA_Y * T + T - 2.5 + Math.sin(px / 11 + s * 1.6) * 1.4 + Math.sin(px / 37 - s) * 1;
        if (px === x0 * T) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.stroke();
    }
    for (let i = 0; i < 3; i++) {
      const bx = ((s * (6 + i * 2) + ih(i, 9, 60) * W * T) % (W * T + 80)) - 40;
      const by = (SEA_Y + 2.4 + i * 1.9) * T;
      if (bx > x0 * T - 40 && bx < (x1 + 1) * T + 40 && by < (y1 + 1) * T + 20) drawBoat(g, bx, by + Math.sin(s * 1.3 + i) * 1.2, i, night);
    }
    g.restore();
  }
  // Fontana: zampillo e cerchi nell'acqua
  if (builtCount(city) >= FOUNTAIN_AT && PIAZZA.x1 >= x0 && PIAZZA.x0 <= x1 && PIAZZA.y1 >= y0 && PIAZZA.y0 <= y1) {
    const { x: fx, y: fy } = FOUNTAIN;
    g.save();
    g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 0.6;
    for (let k = 0; k < 2; k++) {
      const p = (s * 0.45 + k / 2) % 1;
      g.globalAlpha = 1 - p;
      g.beginPath(); g.ellipse(fx, fy, 7 + p * 16, (7 + p * 16) * 0.5, 0, 0, 7); g.stroke();
    }
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(225,245,255,0.9)';
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * Math.PI * 2;
      const p = (s * 1.4 + k * 0.137) % 1;
      const px = fx + Math.cos(a) * p * 7;
      const py = fy - 17 - Math.sin(p * Math.PI) * 6 + p * 4 + Math.sin(a) * p * 3;
      g.beginPath(); g.arc(px, py, 0.7, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(235,250,255,0.85)'; g.beginPath(); g.ellipse(fx, fy - 18.5 - Math.sin(s * 6) * 0.5, 1.3, 3, 0, 0, 7); g.fill();
    g.restore();
  }
  // Automobili sulla strada principale
  if (MAIN_Y >= y0 - 1 && MAIN_Y <= y1 + 1) {
    const L = W * T + 120;
    for (const car of carsFor(builtCount(city))) {
      let x = ((s * car.speed + car.offset) % L);
      if (car.dir < 0) x = L - x;
      x -= 60;
      if (x < x0 * T - 30 || x > (x1 + 1) * T + 30) continue;
      drawCar(g, car, x, MAIN_Y * T + (car.dir > 0 ? 20.5 : 11.5), night);
    }
  }
}

/* Mappa ------------------------------------------------------------------ */

class CityMap {
  constructor(canvas, { onTap, onCamera } = {}) {
    this.cv = canvas;
    this.g = canvas.getContext('2d');
    this.layer = document.createElement('canvas');
    this.lg = this.layer.getContext('2d');
    this.onTap = onTap;
    this.onCamera = onCamera;
    this.city = null;
    this.opts = { mode: 'browse', meId: null, friends: new Set(), online: new Set(), night: false, selected: null };
    this.cam = { x: 41.5 * T, y: 30 * T, z: 1 };
    this.born = new Map();   // lotto → istante in cui è comparsa (animazione di costruzione)
    this.dirty = true;
    this.lastAmbient = 0;
    this.pointers = new Map();
    this.still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.bind();
    this.resize();
    new ResizeObserver(() => this.resize()).observe(canvas);
    this.lastFull = 0;
    this.interactUntil = 0;
    // Durante un gesto si sposta l'ultima immagine pronta (costa pochissimo); la città si ridisegna
    // nitida appena il dito si ferma, o prima se il gesto ha scoperto troppa mappa. Le animazioni vanno a 15 fotogrammi al secondo.
    const loop = (t) => {
      this.now = t;
      const interacting = this.pointers.size > 0 || t < this.interactUntil;
      const growing = this.animating(t);
      if ((this.dirty || growing) && interacting && this.layerCam && !this.stale()) this.fast();
      else if (this.dirty || growing) { this.dirty = false; this.render(t, true); this.lastFull = this.lastAmbient = t; }
      else if (!this.still && this.ambientVisible && t - this.lastAmbient > 66) { this.render(t, false); this.lastAmbient = t; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  setCity(city, { animateNew = true } = {}) {
    if (this.city && animateNew) {
      for (const slot of Object.keys(city.houses)) {
        const was = this.city.houses[slot];
        if (!was || was.status !== city.houses[slot].status) this.born.set(slot, performance.now());
      }
    }
    this.city = city;
    this.dirty = true;
  }
  set(opts) { Object.assign(this.opts, opts); this.dirty = true; }
  animating(t) {
    for (const [slot, t0] of this.born) { if (t - t0 < 1400) return true; this.born.delete(slot); }
    return false;
  }

  resize() {
    const r = this.cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.vw = Math.max(1, r.width);
    this.vh = Math.max(1, r.height);
    this.cv.width = this.layer.width = Math.round(this.vw * dpr);
    this.cv.height = this.layer.height = Math.round(this.vh * dpr);
    this.dpr = dpr;
    if (!this.fitted && this.vw > 50) { this.fitted = true; this.fitCentro(); }
    this.clamp();
    this.dirty = true;
  }
  fitCentro() {
    const d = districtById(1).rect;
    const wTiles = d[2] - d[0] + 3, hTiles = d[3] - d[1] + 6;
    this.cam.z = Math.max(0.55, Math.min(2.2, Math.min(this.vw / (wTiles * T), this.vh / (hTiles * T))));
    this.cam.x = ((d[0] + d[2] + 1) / 2) * T;
    this.cam.y = ((d[1] + d[3] + 1) / 2) * T;
    this.clamp();
    this.dirty = true;
  }
  focus(slotOrXY, z) {
    const [x, y] = typeof slotOrXY === 'string' ? parseKey(slotOrXY) : slotOrXY;
    this.cam.x = (x + 0.5) * T;
    this.cam.y = (y + 0.5) * T;
    if (z) this.cam.z = z;
    this.clamp();
    this.dirty = true;
  }
  clamp() {
    const minZ = Math.max(this.vw / (W * T), this.vh / (H * T));
    this.cam.z = Math.max(minZ, Math.min(3.2, this.cam.z));
    const hw = this.vw / 2 / this.cam.z, hh = this.vh / 2 / this.cam.z;
    this.cam.x = Math.max(hw, Math.min(W * T - hw, this.cam.x));
    this.cam.y = Math.max(hh, Math.min(H * T - hh, this.cam.y));
    this.onCamera?.(this.cam);
  }
  toWorld(sx, sy) {
    return [(sx - this.vw / 2) / this.cam.z + this.cam.x, (sy - this.vh / 2) / this.cam.z + this.cam.y];
  }
  zoomAt(sx, sy, factor) {
    this.interactUntil = performance.now() + 160;
    const [wx, wy] = this.toWorld(sx, sy);
    this.cam.z *= factor;
    this.clamp();
    const [nx, ny] = this.toWorld(sx, sy);
    this.cam.x += wx - nx;
    this.cam.y += wy - ny;
    this.clamp();
    this.dirty = true;
  }

  bind() {
    const cv = this.cv;
    cv.style.touchAction = 'none';
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
      if (this.pointers.size === 1) this.drag = { x: e.offsetX, y: e.offsetY, moved: 0 };
      else { this.drag = null; this.pinch = this.pinchInfo(); }
    });
    cv.addEventListener('pointermove', (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
      if (this.pinch && this.pointers.size === 2) {
        const p = this.pinchInfo();
        this.zoomAt(p.cx, p.cy, p.d / this.pinch.d);
        this.cam.x -= (p.cx - this.pinch.cx) / this.cam.z;
        this.cam.y -= (p.cy - this.pinch.cy) / this.cam.z;
        this.clamp();
        this.pinch = p;
      } else if (this.drag) {
        const dx = e.offsetX - this.drag.x, dy = e.offsetY - this.drag.y;
        this.drag.moved += Math.abs(dx) + Math.abs(dy);
        this.cam.x -= dx / this.cam.z;
        this.cam.y -= dy / this.cam.z;
        this.drag.x = e.offsetX; this.drag.y = e.offsetY;
        this.clamp();
      }
      this.dirty = true;
    });
    const up = (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.delete(e.pointerId);
      if (this.drag && this.drag.moved < 8 && e.type === 'pointerup') this.tap(e.offsetX, e.offsetY);
      this.drag = null;
      if (this.pointers.size < 2) this.pinch = null;
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0015));
    }, { passive: false });
  }
  pinchInfo() {
    const [a, b] = [...this.pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
  }

  tap(sx, sy) {
    const [wx, wy] = this.toWorld(sx, sy);
    let x = Math.floor(wx / T), y = Math.floor(wy / T);
    // Le case sporgono verso l'alto: un tocco sul tetto conta per la casa sotto.
    if (!this.city.houses[key(x, y)] && this.city.houses[key(x, y + 1)] && wy - y * T > T * 0.4) y += 1;
    const k = key(x, y);
    const h = this.city.houses[k];
    if (h) return this.onTap?.({ kind: 'house', slot: k, house: h });
    if (inPiazza(x, y)) {
      const [ex, ey] = PIAZZA_SPOTS.edicola;
      if (x === ex && y === ey) return this.onTap?.({ kind: 'giornale' });
      if (PIAZZA_SPOTS.muro.some(([mx, my]) => mx === x && my === y)) return this.onTap?.({ kind: 'muro' });
      return this.onTap?.({ kind: 'piazza' });
    }
    const d = districtAt(x, y);
    if (PLAN.lots.has(k) && d && d <= this.city.openDistricts) return this.onTap?.({ kind: 'lot', slot: k });
    if (d && d > this.city.openDistricts) return this.onTap?.({ kind: 'locked', district: d });
    this.onTap?.({ kind: 'none' });
  }

  view() {
    const hw = this.vw / 2 / this.cam.z, hh = this.vh / 2 / this.cam.z;
    return {
      x0: Math.max(0, Math.floor((this.cam.x - hw) / T) - 1), y0: Math.max(0, Math.floor((this.cam.y - hh) / T) - 1),
      x1: Math.min(W - 1, Math.ceil((this.cam.x + hw) / T) + 1), y1: Math.min(H - 1, Math.ceil((this.cam.y + hh) / T) + 2),
    };
  }
  stale() {
    const L = this.layerCam, c = this.cam;
    const s = c.z / L.z;
    const dx = Math.abs(L.x - c.x) * c.z, dy = Math.abs(L.y - c.y) * c.z;
    return s < 0.7 || s > 2.2 || dx > this.vw * 0.4 || dy > this.vh * 0.35;
  }
  // Ridisegno veloce durante i gesti: l'ultima immagine pronta, spostata e scalata sulla camera attuale.
  fast() {
    const L = this.layerCam, c = this.cam, d = this.dpr;
    const s = c.z / L.z;
    const g = this.g;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#9fc87a';
    g.fillRect(0, 0, this.cv.width, this.cv.height);
    g.setTransform(s, 0, 0, s, d * ((this.vw / 2) * (1 - s) + (L.x - c.x) * c.z), d * ((this.vh / 2) * (1 - s) + (L.y - c.y) * c.z));
    g.drawImage(this.layer, 0, 0);
  }
  worldTransform(g) {
    const s = this.dpr * this.cam.z;
    g.setTransform(s, 0, 0, s, this.dpr * this.vw / 2 - this.cam.x * s, this.dpr * this.vh / 2 - this.cam.y * s);
  }

  render(t, full) {
    if (!this.city) return;
    const view = this.view();
    const o = { ...this.opts, t, born: this.born, z: this.cam.z, detail: this.cam.z * this.dpr >= 2.4 };
    if (full) {
      this.layerCam = { ...this.cam };
      this.ambientVisible = view.y1 >= SEA_Y || (MAIN_Y >= view.y0 && MAIN_Y <= view.y1) ||
        (builtCount(this.city) >= FOUNTAIN_AT && PIAZZA.x1 >= view.x0 && PIAZZA.x0 <= view.x1 && PIAZZA.y1 >= view.y0 && PIAZZA.y0 <= view.y1);
      const lg = this.lg;
      lg.setTransform(1, 0, 0, 1, 0, 0);
      lg.fillStyle = '#4b97bd';
      lg.fillRect(0, 0, this.layer.width, this.layer.height);
      this.worldTransform(lg);
      drawWorld(lg, this.city, view, o);
      // Vignettatura leggera ai bordi dello schermo.
      lg.setTransform(1, 0, 0, 1, 0, 0);
      const w = this.layer.width, h = this.layer.height;
      const vg = lg.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.45, w / 2, h / 2, Math.hypot(w, h) * 0.62);
      vg.addColorStop(0, 'rgba(20,30,20,0)'); vg.addColorStop(1, o.night ? 'rgba(5,8,25,0.4)' : 'rgba(30,40,20,0.16)');
      lg.fillStyle = vg; lg.fillRect(0, 0, w, h);
    }
    const g = this.g;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(this.layer, 0, 0);
    this.worldTransform(g);
    drawAmbient(g, this.city, view, o, this.still ? 0 : t);
    if (this.opts.mode === 'choose') {
      const pulse = 0.5 + 0.5 * Math.sin(t / 300);
      g.fillStyle = `rgba(255,236,160,${0.22 + pulse * 0.3})`;
      for (let y = view.y0; y <= view.y1; y++) for (let x = view.x0; x <= view.x1; x++) {
        const k = key(x, y);
        if (PLAN.lots.has(k) && !this.city.houses[k] && districtAt(x, y) <= this.city.openDistricts) { g.beginPath(); g.roundRect(x * T + 3, y * T + 3, T - 6, T - 6, 4); g.fill(); }
      }
    }
    for (const [slot, t0] of this.born) {
      const [x, y] = parseKey(slot);
      if (t - t0 < 1400) sparkle(g, x * T + 16, y * T + 14, t - t0);
    }
  }
}

// Nomi a dimensione fissa sullo schermo, accorciati alla larghezza del lotto per non sovrapporsi.
function label(g, x, y, text, mine, z = 1) {
  g.save();
  const fs = 11 / z;
  g.font = `800 ${fs}px Nunito, "Trebuchet MS", sans-serif`;
  const maxW = T * 0.94 - fs;
  let t = text;
  if (g.measureText(t).width > maxW) {
    while (t.length > 3 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    t += '…';
  }
  const w = g.measureText(t).width + fs;
  const hgt = fs * 1.5;
  g.fillStyle = 'rgba(0,0,0,0.18)';
  g.beginPath(); g.roundRect(x - w / 2, y - hgt / 2 + fs * 0.12, w, hgt, hgt / 2); g.fill();
  g.fillStyle = mine ? '#ffd34d' : 'rgba(255,255,255,0.95)';
  g.beginPath(); g.roundRect(x - w / 2, y - hgt / 2, w, hgt, hgt / 2); g.fill();
  g.fillStyle = '#2b2a26';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(t, x, y + fs * 0.05);
  g.restore();
}
function sparkle(g, x, y, age) {
  const p = age / 1400;
  g.save();
  g.globalAlpha = 1 - p;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + p;
    const r = 6 + p * 22;
    g.fillStyle = i % 2 ? '#fff3b0' : '#ffffff';
    g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.8, 1.6 - p, 0, 7); g.fill();
  }
  g.restore();
}
function easeOutBack(p) {
  const c = 1.7;
  return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
}

  g.fillStyle = sky;
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.setTransform(s, 0, 0, s, 0, 0);
  g.fillStyle = pats(g).grass; g.fillRect(0, 0, 40, 30);

// Cartolina per il giornale: testata, ritaglio della mappa sulla zona della notizia, titolo e testo.
async function renderPoster(city, news, format = 'post') {
  try { await Promise.all([document.fonts.load('400 80px "Abril Fatface"'), document.fonts.load('700 40px Nunito'), document.fonts.load('600 40px Fredoka')]); } catch { /* caratteri di riserva */ }
  const Wp = 1080, Hp = format === 'story' ? 1920 : 1350;
  const cv = document.createElement('canvas');
  cv.width = Wp; cv.height = Hp;
  const g = cv.getContext('2d');
  const paper = '#f6f1e3', ink = '#1f2a26', red = '#b8322a';
  g.fillStyle = paper; g.fillRect(0, 0, Wp, Hp);
  const top = format === 'story' ? 150 : 60;
  g.fillStyle = ink; g.textAlign = 'center';
  g.font = '400 96px "Abril Fatface", Georgia, serif';
  g.fillText(CITY.toUpperCase(), Wp / 2, top + 90);
  g.fillStyle = red; g.fillRect(70, top + 118, Wp - 140, 6);
  g.fillStyle = ink; g.font = '700 30px Nunito, sans-serif';
  const date = new Date(news.at).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  g.fillText(`${PAPER.toUpperCase()}  ·  ${date.toUpperCase()}`, Wp / 2, top + 166);
  g.fillRect(70, top + 190, Wp - 140, 2);

  // Mappa
  const mapY = top + 220, mapH = format === 'story' ? 900 : 640, mapX = 70, mapW = Wp - 140;
  const [fx, fy] = news.slot ? parseKey(news.slot) : [PIAZZA.x0 + 4, PIAZZA.y0 + 1];
  const z = 2.8;
  g.save();
  g.beginPath(); g.rect(mapX, mapY, mapW, mapH); g.clip();
  g.translate(mapX + mapW / 2, mapY + mapH / 2);
  g.scale(z, z);
  g.translate(-(fx + 0.5) * T, -(fy + 0.5) * T);
  const hw = mapW / 2 / z / T, hh = mapH / 2 / z / T;
  const view = {
    x0: Math.max(0, Math.floor(fx - hw) - 1), y0: Math.max(0, Math.floor(fy - hh) - 1),
    x1: Math.min(W - 1, Math.ceil(fx + hw) + 1), y1: Math.min(H - 1, Math.ceil(fy + hh) + 2),
  };
  const o = { z: 2, selected: null, t: 0, detail: true };
  drawWorld(g, city, view, o);
  drawAmbient(g, city, view, o, 4200);
  g.restore();
  g.strokeStyle = ink; g.lineWidth = 4; g.strokeRect(mapX, mapY, mapW, mapH);

  const f = formatNews(news, city);
  g.textAlign = 'left';
  g.fillStyle = ink;
  g.font = '400 64px "Abril Fatface", Georgia, serif';
  let y = wrap(g, f.title, 70, mapY + mapH + 100, Wp - 140, 74);
  g.font = '600 36px Nunito, sans-serif';
  g.fillStyle = '#3b4642';
  y = wrap(g, f.text, 70, y + 30, Wp - 140, 50);
  g.fillStyle = red;
  g.fillRect(0, Hp - (format === 'story' ? 210 : 110), Wp, format === 'story' ? 210 : 110);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = '700 38px Fredoka, Nunito, sans-serif';
  g.fillText('Vieni ad abitare qui · link in bio', Wp / 2, Hp - (format === 'story' ? 130 : 45));
  return cv;
}
function wrap(g, text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t;
  }
  if (line) g.fillText(line, x, y);
  return y;
}

// Due archivi con la stessa interfaccia:
// - RemoteStore: il server vero (server/server.js), una sola città per tutti.
// - LocalStore: demo nel browser. La città vive solo in questo browser e le email sono finte.


class Base {
  constructor() { this.listeners = new Set(); this.city = null; this.me = null; this.online = new Set(); }
  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit(kind) { for (const fn of this.listeners) fn(kind); }
}

/* Server ------------------------------------------------------------------ */

class RemoteStore extends Base {
  constructor() { super(); this.mode = 'server'; }

  async call(method, p, body) {
    let res;
    try {
      res = await fetch(p, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-VI': '1' }, body: body ? JSON.stringify(body) : undefined });
    } catch {
      throw new DomainError('network', 'Connessione assente: controlla internet e riprova.');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new DomainError(data.code || 'validation', data.error || 'Qualcosa non ha funzionato. Riprova.');
    return data;
  }

  async init() {
    const s = await this.call('GET', '/api/session');
    this.me = s.me;
    this.devMail = s.devMail;
    await this.refresh();
    this.listen();
  }
  async refresh() {
    const d = await this.call('GET', '/api/city');
    this.take(d);
  }
  take(d) {
    if (d.city) this.city = d.city;
    if (d.online) this.online = new Set(d.online);
    this.emit('city');
  }
  listen() {
    this.es?.close();
    this.es = new EventSource('/api/events');
    this.es.addEventListener('city', (e) => {
      const d = JSON.parse(e.data);
      this.online = new Set(d.online);
      if (!this.city || d.rev !== this.city.rev) this.refresh().catch(() => {});
      else this.emit('online');
    });
  }
  async afterAuth(d) {
    this.me = d.me ?? (await this.call('GET', '/api/session')).me;
    await this.refresh();
    this.listen();
    this.emit('me');
  }

  async register(form) { const d = await this.call('POST', '/api/register', form); await this.afterAuth(d); return d; }
  async confirm(token) { const d = await this.call('POST', '/api/confirm', { token }); await this.afterAuth(d); return d; }
  resend() { return this.call('POST', '/api/resend'); }
  async login(login, password) { const d = await this.call('POST', '/api/login', { login, password }); await this.afterAuth(d); return d; }
  async logout() { await this.call('POST', '/api/logout'); this.me = null; await this.refresh(); this.listen(); this.emit('me'); }
  requestReset(email) { return this.call('POST', '/api/reset/request', { email }); }
  async resetPassword(token, password) { const d = await this.call('POST', '/api/reset', { token, password }); await this.afterAuth({}); return d; }
  async op(op) { const d = await this.call('POST', '/api/op', { op }); this.take(d); return d.result; }
  exportData() { return this.call('GET', '/api/me/export'); }
  async deleteAccount(password) { await this.call('POST', '/api/me/delete', { password }); this.me = null; await this.refresh(); this.emit('me'); }
  admin() { return this.call('GET', '/api/admin'); }
}

/* Demo nel browser ---------------------------------------------------------- */

const KEY = 'virtual-italy-demo-v1';
const localBox = () => { try { return window.localStorage; } catch { return null; } };
function load() { try { return JSON.parse(localBox()?.getItem(KEY) || 'null'); } catch { return null; } }
function save(v) { try { localBox()?.setItem(KEY, JSON.stringify(v)); } catch { /* demo senza memoria */ } }

class LocalStore extends Base {
  constructor() { super(); this.mode = 'demo'; this.devMail = true; }

  async init() {
    const saved = load();
    this.db = saved?.version === 1 ? saved : this.fresh();
    this.me = this.db.session ? this.meView(this.db.session) : null;
    this.publish();
    // Qualche abitante finto entra ed esce, per vedere le finestre accese di sera.
    this.timer = setInterval(() => this.shuffleOnline(), 15000);
  }
  fresh() {
    const now = Date.now();
    return { version: 1, state: seedResidents(emptyState(now - 6 * 86400000), 14, now), accounts: {}, tokens: {}, session: null, inbox: [] };
  }
  persist() { save(this.db); }
  meView(id) {
    const a = this.db.accounts[id];
    if (!a) return null;
    return { id, email: a.email, username: this.db.state.residents[id]?.username, emailConfirmed: a.confirmed, admin: true };
  }
  shuffleOnline() {
    const ids = Object.keys(this.db.state.residents).filter((id) => id.startsWith(DEMO_TAG));
    this.online = new Set(ids.filter((id, i) => (i * 7 + Math.floor(Date.now() / 15000)) % 3 === 0));
    if (this.me) this.online.add(this.me.id);
    this.emit('online');
  }
  publish() {
    this.city = publicView(this.db.state, this.me?.id, true);
    if (!this.online.size) this.shuffleOnline();
    this.emit('city');
  }
  apply(op, ctx) {
    const r = applyOp(this.db.state, op, { now: Date.now(), ...ctx });
    this.db.state = r.state;
    this.persist();
    this.publish();
    return r.result;
  }
  mail(to, subject, body, action) {
    this.db.inbox.unshift({ id: uid('m'), to, subject, body, action, at: Date.now() });
    this.db.inbox.length = Math.min(this.db.inbox.length, 30);
  }

  async register(f) {
    if (f.website || Number(f.elapsed) < 2500) throw new DomainError('validation', 'Non siamo riusciti a completare l\'iscrizione: riprova tra qualche secondo.');
    const email = checkEmail(f.email);
    const username = checkUsername(f.username);
    checkPassword(f.password);
    if (!f.accept) throw new DomainError('validation', 'Per iscriverti devi accettare il regolamento e l\'informativa privacy.');
    if (!f.adult) throw new DomainError('validation', 'Per iscriverti devi avere almeno 14 anni.');
    if (Object.values(this.db.accounts).some((a) => a.email === email)) throw new DomainError('validation', 'Esiste già un abitante con questa email: prova ad accedere.');
    const id = 'u_' + uid('');
    this.apply({ type: 'join', id, username }, { system: true });
    this.db.accounts[id] = { email, password: f.password, confirmed: false, source: f.source || 'diretto', createdAt: Date.now() };
    const token = uid('t');
    this.db.tokens[token] = { id, kind: 'confirm' };
    this.mail(email, 'Conferma la tua casa a Virtual-Italy', `Ciao ${username}, per finire la tua casa conferma l'indirizzo email entro 24 ore.`, { kind: 'confirm', token });
    this.db.session = id;
    this.me = this.meView(id);
    this.persist();
    this.publish();
    this.emit('me');
    return { ok: true, devToken: token };
  }
  async confirm(token) {
    const t = this.db.tokens[token];
    if (!t || t.kind !== 'confirm') throw new DomainError('validation', 'Il link di conferma non è valido o è già stato usato.');
    delete this.db.tokens[token];
    this.db.accounts[t.id].confirmed = true;
    const r = this.apply({ type: 'confirm', id: t.id }, { system: true });
    this.db.session = t.id;
    this.me = this.meView(t.id);
    this.persist();
    this.emit('me');
    return { ok: true, number: r.number };
  }
  async resend() {
    const id = this.me?.id;
    const token = uid('t');
    this.db.tokens[token] = { id, kind: 'confirm' };
    this.mail(this.me.email, 'Conferma la tua casa a Virtual-Italy', 'Nuovo link di conferma.', { kind: 'confirm', token });
    this.persist();
    return { ok: true, devToken: token };
  }
  async login(login, password) {
    const l = String(login || '').trim().toLowerCase();
    const id = Object.keys(this.db.accounts).find((k) => this.db.accounts[k].email === l || usernameKey(this.db.state.residents[k]?.username || '') === l);
    if (!id || this.db.accounts[id].password !== password) throw new DomainError('auth', 'Email, nome utente o password errati.');
    this.db.session = id;
    this.me = this.meView(id);
    this.persist();
    this.publish();
    this.emit('me');
    return { ok: true };
  }
  async logout() { this.db.session = null; this.me = null; this.persist(); this.publish(); this.emit('me'); }
  async requestReset(email) {
    const id = Object.keys(this.db.accounts).find((k) => this.db.accounts[k].email === String(email).trim().toLowerCase());
    let token;
    if (id) {
      token = uid('t');
      this.db.tokens[token] = { id, kind: 'reset' };
      this.mail(this.db.accounts[id].email, 'Nuova password per Virtual-Italy', 'Apri il link per scegliere una nuova password.', { kind: 'reset', token });
      this.persist();
    }
    return { ok: true, devToken: token };
  }
  async resetPassword(token, password) {
    checkPassword(password);
    const t = this.db.tokens[token];
    if (!t || t.kind !== 'reset') throw new DomainError('validation', 'Il link non è valido o è scaduto: chiedine uno nuovo.');
    delete this.db.tokens[token];
    this.db.accounts[t.id].password = password;
    return this.login(this.db.accounts[t.id].email, password);
  }
  async op(op) {
    if (op.type === 'leave') throw new DomainError('validation', 'Per cancellare l\'account usa le impostazioni.');
    return this.apply(op, { user: { id: this.me?.id, admin: true } });
  }
  async exportData() {
    const id = this.me.id, a = this.db.accounts[id], s = this.db.state;
    return { esportatoIl: new Date().toISOString(), account: { email: a.email, nomeUtente: s.residents[id]?.username, provenienza: a.source },
      abitante: s.residents[id], casa: residentHouse(s, id), amici: friendsOf(s, id).map((x) => s.residents[x]?.username) };
  }
  async deleteAccount(password) {
    const id = this.me.id;
    if (this.db.accounts[id].password !== password) throw new DomainError('validation', 'La password non è corretta.');
    this.apply({ type: 'leave', id }, { system: true });
    delete this.db.accounts[id];
    this.db.session = null;
    this.me = null;
    this.persist();
    this.publish();
    this.emit('me');
  }
  async admin() {
    const sources = {};
    for (const a of Object.values(this.db.accounts)) {
      const s = (sources[a.source] ||= { source: a.source, n: 0, confirmed: 0 });
      s.n++; if (a.confirmed) s.confirmed++;
    }
    return { sources: Object.values(sources), outbox: this.db.inbox.map((m) => ({ to: m.to, subject: m.subject, body: m.body, at: m.at })), mailConfigured: false };
  }

  // Solo demo: la casella email finta, nuovi abitanti finti, ripartenza.
  inbox() { return this.db.inbox; }
  addResidents(n) {
    this.db.state = seedResidents(this.db.state, n, Date.now(), Date.now());
    this.persist();
    this.publish();
  }
  knock() {
    // Un vicino finto bussa alla porta dell'utente della demo.
    if (!this.me) return false;
    const s = this.db.state;
    const from = Object.keys(s.residents).find((id) => id.startsWith(DEMO_TAG) && !s.requests.some((q) => q.from === id) && !s.friendships.some((f) => f.a === id || f.b === id));
    if (!from) return false;
    this.apply({ type: 'friendRequest', to: this.me.id }, { user: { id: from } });
    return true;
  }
  reset() { this.db = this.fresh(); this.me = null; this.persist(); this.publish(); this.emit('me'); }
}

/* Piccoli attrezzi --------------------------------------------------------- */

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

const ICONS = {

function toast(text, kind = 'ok') {
  const el = h('div', { class: `toast ${kind}`, role: 'status' }, text);
  const box = $('#toasts');
  box.append(el);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => el.classList.add('out'), kind === 'err' ? 4200 : 2800);
  setTimeout(() => el.remove(), kind === 'err' ? 4700 : 3300);
}
const errText = (e) => (e instanceof DomainError || e?.message ? e.message : 'Qualcosa non ha funzionato. Riprova.');

async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(errText(e), 'err'); return undefined; } finally { if (btn) btn.disabled = false; }
}
const fmtDate = (t) => new Date(t).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtDay = (t) => new Date(t).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* niente */ } } };
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* niente */ } } };

/* Stato dell'interfaccia ------------------------------------------------- */

const ui = { mode: 'browse', sheet: null, nightOverride: ls.get('vi-night'), welcomeSeen: ls.get('vi-welcome') === '1' };

const myResident = () => me() && store.city.residents[me().id];

// Ridisegna le parti fisse: contatore, barra in basso, avvisi.
function update() {
  const city = store.city;
  if (!city) return;
  const built = builtCount(city);
  $('#count').textContent = `${built} ${built === 1 ? 'abitante' : 'abitanti'}`;
  const night = isNight();
  $('#btn-night').replaceChildren(icon(night ? 'sun' : 'moon'));
  $('#btn-night').setAttribute('aria-label', night ? 'Passa al giorno' : 'Passa alla notte');
  const mine = me();
  const incoming = mine ? city.requests.filter((q) => q.to === mine.id).length : 0;
  const badge = $('#mail-badge');
  badge.hidden = !incoming;
  badge.textContent = incoming;
  $('#btn-mail').hidden = !mine;

  map.set({
    mode: ui.mode, meId: mine?.id || null, night, online: store.online,
    friends: new Set(mine ? friendsOf(city, mine.id) : []),
  });

  // Avviso email da confermare.
  const notice = $('#notice');
  const house = myHouse();
  if (mine && !mine.emailConfirmed) {
    const left = house ? Math.max(0, Math.ceil((house.reservedAt + RESERVE_MS - Date.now()) / 3600000)) : null;
    notice.hidden = false;
    notice.replaceChildren(
      h('div', {}, h('strong', {}, 'Conferma la tua email'),
        h('span', {}, house ? ` per finire la casa: il cantiere resta tuo per altre ${left} ore.` : ` per diventare abitante a tutti gli effetti. L'abbiamo mandata a ${mine.email}.`)),
      h('div', { class: 'notice-actions' },
        DEMO ? h('button', { class: 'btn small primary', onclick: openDemoInbox }, 'Apri l\'email') : null,
        h('button', { class: 'btn small', onclick: (e) => run(e.currentTarget, async () => { const r = await store.resend(); devLinkToast(r); toast('Ti abbiamo mandato un nuovo link.'); }) }, 'Invia di nuovo')));
  } else notice.hidden = true;

  // Barra in basso.
  const bottom = $('#bottom');
  if (ui.mode === 'choose') {
    bottom.replaceChildren(h('div', { class: 'bar choose' },
      h('div', {}, h('strong', {}, 'Tocca un lotto libero'), h('span', {}, ' Quelli tratteggiati sono disponibili.')),
      h('button', { class: 'btn', onclick: () => { ui.mode = 'browse'; map.set({ selected: null }); update(); } }, 'Annulla')));
    return;
  }
  const g = goalProgress(built);
  const goal = h('button', { class: 'goal', onclick: () => openMuro() },
    h('span', { class: 'goal-text' }, nextGoal(city, built)),
    h('span', { class: 'goal-track' }, h('span', { class: 'goal-fill', style: `width:${Math.round(g.ratio * 100)}%` })));
  let cta;
  if (!mine) cta = h('button', { class: 'btn primary big', onclick: openRegister }, 'Vieni ad abitare qui');
  else if (!house) cta = h('button', { class: 'btn primary big', onclick: startChoosing }, 'Scegli il tuo lotto');
  else cta = h('button', { class: 'btn big', onclick: () => { map.focus(house.slot, 2); openHouse(house.slot); } }, icon('home'), 'La mia casa');
  bottom.replaceChildren(h('div', { class: 'bar' }, goal, cta));
}

function openSheet(title, body, { wide = false, onClose } = {}) {
  const sheet = $('#sheet');
  ui.sheet = { onClose };
  sheet.className = 'sheet' + (wide ? ' wide' : '');
  sheet.replaceChildren(
    h('div', { class: 'sheet-head' },

  sheet.hidden = false;

  const first = sheet.querySelector('input, textarea');
  if (first && matchMedia('(pointer: fine)').matches) first.focus();
}
function closeSheet() {
  const s = ui.sheet;
  ui.sheet = null;
  $('#sheet').hidden = true;

function openRegister() {
  const started = Date.now();
  const err = formError();
  const userHint = h('span', { class: 'field-hint' }, 'Da 3 a 20 caratteri: lettere, numeri, punto o trattino basso. Sarà scritto davanti alla tua casa.');
  const form = h('form', { class: 'form', novalidate: true },
    field('Email', h('input', { id: 'reg-email', name: 'email', type: 'email', autocomplete: 'email', required: true, inputmode: 'email' }), 'Serve per confermare la casa e recuperare la password. Nessuno la vedrà.'),
    h('label', { class: 'field' }, h('span', { class: 'field-label' }, 'Nome utente'),
      h('input', { id: 'reg-user', name: 'username', autocomplete: 'username', required: true, maxlength: 20, autocapitalize: 'off', spellcheck: 'false' }), userHint),
    field('Password', h('input', { id: 'reg-pass', name: 'password', type: 'password', autocomplete: 'new-password', required: true, minlength: 8 }), 'Almeno 8 caratteri.'),
    h('input', { class: 'hp', name: 'website', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' }),
    h('label', { class: 'check' }, h('input', { id: 'reg-accept', type: 'checkbox', name: 'accept' }),
      h('span', {}, 'Accetto il ', h('a', { href: '#', onclick: (e) => { e.preventDefault(); openRules(openRegister); } }, 'regolamento e l\'informativa privacy'), '.')),
    h('label', { class: 'check' }, h('input', { id: 'reg-adult', type: 'checkbox', name: 'adult' }), h('span', {}, 'Ho almeno 14 anni.')),
    err,
    h('button', { class: 'btn primary big', type: 'submit' }, 'Crea il mio account'),
    h('p', { class: 'small center' }, 'Hai già una casa? ', h('a', { href: '#', onclick: (e) => { e.preventDefault(); openLogin(); } }, 'Accedi')));
  form.username.addEventListener('input', () => {
    userHint.classList.remove('bad');
    const v = form.username.value.trim();
    if (!v) return;
    const taken = Object.values(store.city.residents).some((r) => r.username.toLowerCase() === v.toLowerCase());
    if (taken) { userHint.textContent = 'Questo nome utente è già preso.'; userHint.classList.add('bad'); } else userHint.textContent = `Davanti alla tua casa ci sarà scritto “${v}”.`;
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    err.hidden = true;
    const btn = form.querySelector('[type=submit]');
    run(btn, async () => {
      try {
        const r = await store.register({
          email: form.email.value, username: form.username.value.trim(), password: form.password.value,
          accept: form.accept.checked, adult: form.adult.checked, website: form.website.value,
          elapsed: Date.now() - started, source: ss.get('vi-source') || 'diretto',
        });
        devLinkToast(r);
        closeSheet();
        toast(`Account creato. Ti abbiamo mandato un'email per confermare.`);
        startChoosing();
      } catch (ex) { showError(err, ex); }
    });
  });
  openSheet('Vieni ad abitare qui', form);
}

/* Lotti e costruzione -------------------------------------------------------- */

function startChoosing() {
  if (!me()) return openRegister();
  if (myHouse()) return toast('Hai già una casa a Virtual-Italy.');
  closeSheet();
  ui.mode = 'choose';
  map.fitCentro();
  update();
}

function neighbours(slot, radius = 3) {
  const [x, y] = parseKey(slot);
  return Object.values(store.city.houses).filter((hh) => {
    const [hx, hy] = parseKey(hh.slot);
    return hh.slot !== slot && Math.abs(hx - x) <= radius && Math.abs(hy - y) <= radius;
  }).map((hh) => store.city.residents[hh.residentId]).filter(Boolean);
}

function openLot(slot) {
  map.set({ selected: slot });
  const d = districtById(districtAt(...parseKey(slot)));
  const near = neighbours(slot);
  const canBuild = me() && !myHouse();
  openSheet(`Lotto libero · ${d.name}`, h('div', { class: 'stack' },
    h('p', {}, near.length ? 'I tuoi vicini sarebbero:' : 'Qui intorno non abita ancora nessuno: saresti il primo della via.'),
    near.length ? h('ul', { class: 'chips' }, near.slice(0, 12).map((r) => h('li', { class: 'chip' }, r.username))) : null,
    canBuild ? h('button', { class: 'btn primary big', onclick: () => openBuild(slot) }, 'Costruisci qui')
      : !me() ? h('button', { class: 'btn primary big', onclick: openRegister }, 'Iscriviti per costruire qui')
        : h('p', { class: 'small' }, 'Hai già una casa: questo lotto resta per un nuovo abitante.')),
    { onClose: () => { if (ui.mode !== 'choose') map.set({ selected: null }); } });
}

function swatches(name, list, value, onPick, colorOf) {
  return h('div', { class: 'swatches', role: 'radiogroup' }, list.map((o) => h('button', {
    type: 'button', class: 'swatch' + (o.id === value ? ' on' : '') + (colorOf ? ' color' : ''), role: 'radio', 'aria-checked': String(o.id === value),
    'aria-label': o.label, title: o.label, style: colorOf ? `--sw:${o.color}` : null,
    onclick: () => onPick(o.id),
  }, colorOf ? null : o.label)));
}

function openBuild(slot, { restyle = false } = {}) {
  const current = restyle ? myHouse().style : makeStyle(slot);
  const choice = { roof: current.roof, door: current.door, garden: current.garden, deco: current.deco };
  const preview = h('canvas', { class: 'preview', width: 640, height: 480, 'aria-label': 'Anteprima della casa' });
  const groups = h('div', { class: 'stack' });
  const paint = () => {
    drawPreview(preview, makeStyle(slot, choice));
    groups.replaceChildren(
      h('div', {}, h('p', { class: 'field-label' }, 'Tetto'), swatches('roof', ROOFS, choice.roof, (v) => { choice.roof = v; paint(); }, true)),
      h('div', {}, h('p', { class: 'field-label' }, 'Porta'), swatches('door', DOORS, choice.door, (v) => { choice.door = v; paint(); }, true)),
      h('div', {}, h('p', { class: 'field-label' }, 'Giardino'), swatches('garden', GARDENS, choice.garden, (v) => { choice.garden = v; paint(); })),
      h('div', {}, h('p', { class: 'field-label' }, 'Davanti casa'), swatches('deco', DECOS, choice.deco, (v) => { choice.deco = v; paint(); })));
  };
  paint();
  const d = districtById(districtAt(...parseKey(slot)));
  const btn = h('button', { class: 'btn primary big', onclick: (e) => run(e.currentTarget, async () => {
    if (restyle) {
      await store.op({ type: 'restyle', style: choice });
      closeSheet();
      toast('Casa rinnovata');
      return;
    }
    const r = await store.op({ type: 'chooseSlot', slot, style: choice });
    ui.mode = 'browse';
    closeSheet();
    map.focus(slot, 2);
    if (r.status === 'casa') toast(`Benvenuto a ${CITY}, abitante n°${myResident().number}!`);
    else toast('Cantiere aperto! Conferma l\'email per finire la casa.');
    update();
  }) }, restyle ? 'Salva le modifiche' : 'Costruisci la casa');
  openSheet(restyle ? 'Rinnova la casa' : 'La tua casa', h('div', { class: 'build' },
    h('div', { class: 'build-preview' }, preview, h('p', { class: 'small' }, `Le forme e i muri seguono lo stile del quartiere ${d.name}.`)),
    h('div', { class: 'stack' }, groups, btn)), { wide: true });
}

/* Case e abitanti -------------------------------------------------------- */

function openHouse(slot) {
  const city = store.city;
  const house = city.houses[slot];
  const r = house && city.residents[house.residentId];
  if (!r) return;
  map.set({ selected: slot });
  const mine = me();
  const isMe = mine && mine.id === r.id;
  const d = districtById(districtAt(...parseKey(slot)));
  const badges = h('div', { class: 'badges' },
    r.number ? h('span', { class: 'tag' }, `Abitante n°${r.number}`) : null,
    isFounder(r) ? h('span', { class: 'tag gold' }, 'Fondatore') : null,
    house.status === 'cantiere' ? h('span', { class: 'tag warn' }, 'Cantiere') : null,
    store.online.has(r.id) ? h('span', { class: 'tag live' }, 'In città ora') : null,
    r.suspended ? h('span', { class: 'tag warn' }, 'Sospeso') : null);
  const facts = h('dl', { class: 'facts-list' },
    h('div', {}, h('dt', {}, 'Quartiere'), h('dd', {}, d.name)),
    h('div', {}, h('dt', {}, 'Arrivato il'), h('dd', {}, fmtDate(house.builtAt || house.reservedAt))),
    r.instagram ? h('div', {}, h('dt', {}, 'Instagram'), h('dd', {}, h('a', { href: `https://instagram.com/${r.instagram}`, target: '_blank', rel: 'noopener noreferrer' }, '@' + r.instagram))) : null);
  const actions = h('div', { class: 'stack' });
  if (isMe) {
    actions.append(
      h('button', { class: 'btn', onclick: () => openBuild(slot, { restyle: true }) }, 'Rinnova la casa'),
      h('button', { class: 'btn', onclick: openProfile }, 'Modifica il profilo'));
  } else if (!mine) {
    actions.append(h('button', { class: 'btn primary', onclick: openRegister }, 'Iscriviti per bussare alla porta'));
  } else {
    const out = city.requests.find((q) => q.from === mine.id && q.to === r.id);
    const inc = city.requests.find((q) => q.to === mine.id && q.from === r.id);
    if (areFriends(city, mine.id, r.id)) {
      actions.append(h('p', { class: 'friends-line' }, `Tu e ${r.username} siete amici.`),
        h('button', { class: 'btn ghost small', onclick: (e) => run(e.currentTarget, async () => { await store.op({ type: 'unfriend', id: r.id }); openHouse(slot); }) }, 'Rimuovi amicizia'));
    } else if (inc) {
      actions.append(h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, async () => { await store.op({ type: 'friendRespond', id: inc.id, accept: true }); toast(`Ora tu e ${r.username} siete amici`); openHouse(slot); }) }, `${r.username} ha bussato: apri la porta`));
    } else if (out) {
      actions.append(h('button', { class: 'btn', disabled: true }, 'Hai bussato: aspetta la risposta'));
    } else {
      actions.append(h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget, async () => {
        const res = await store.op({ type: 'friendRequest', to: r.id });
        toast(res.friends ? `Avevate bussato entrambi: ora siete amici!` : `Hai bussato alla porta di ${r.username}`);
        openHouse(slot);
      }) }, 'Bussa alla porta'));
    }
    actions.append(h('button', { class: 'link-btn', onclick: () => openReport(r) }, 'Segnala questo abitante'));
  }
  openSheet(r.username, h('div', { class: 'stack' },
    badges,
    r.bio ? h('p', { class: 'bio' }, `“${r.bio}”`) : isMe ? h('p', { class: 'small' }, 'Aggiungi una frase di presentazione dal tuo profilo.') : null,
    facts, actions));
}

function openReport(r) {
  const err = formError();
  const form = h('form', { class: 'form', novalidate: true },
    h('p', {}, `La redazione leggerà la segnalazione su ${r.username}. Chi viene segnalato non saprà chi l'ha fatto.`),
    field('Motivo', h('textarea', { id: 'report-reason', name: 'reason', rows: 3, maxlength: 300, required: true })),
    err,
    h('button', { class: 'btn primary', type: 'submit' }, 'Invia la segnalazione'));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    run(form.querySelector('[type=submit]'), async () => {
      try { await store.op({ type: 'report', target: r.id, reason: form.reason.value }); closeSheet(); toast('Segnalazione inviata alla redazione'); } catch (ex) { showError(err, ex); }
    });
  });
  openSheet('Segnala', form);
}

function openMailbox() {
  const city = store.city;
  const mine = me();
  if (!mine) return openLogin();
  const name = (id) => city.residents[id]?.username || 'ex abitante';
  const goTo = (id) => { const hs = residentHouse(city, id); if (hs) { closeSheet(); map.focus(hs.slot, 2); openHouse(hs.slot); } };
  const incoming = city.requests.filter((q) => q.to === mine.id);
  const outgoing = city.requests.filter((q) => q.from === mine.id);
  const friends = friendsOf(city, mine.id);
  const respond = (q, accept) => async (e) => {
    await run(e.currentTarget, async () => { await store.op({ type: 'friendRespond', id: q.id, accept }); toast(accept ? `Ora tu e ${name(q.from)} siete amici` : 'Richiesta rifiutata'); openMailbox(); });
  };
  openSheet('Cassetta delle lettere', h('div', { class: 'stack' },
    h('h3', {}, 'Hanno bussato alla tua porta'),
    incoming.length ? h('ul', { class: 'rows' }, incoming.map((q) => h('li', { class: 'row' },
      h('button', { class: 'link-btn strong', onclick: () => goTo(q.from) }, name(q.from)),
      h('span', { class: 'row-actions' },
        h('button', { class: 'btn small primary', onclick: respond(q, true) }, 'Accetta'),
        h('button', { class: 'btn small', onclick: respond(q, false) }, 'Rifiuta'))))) : h('p', { class: 'small' }, 'Nessuna richiesta per ora.'),
    h('h3', {}, `I tuoi amici (${friends.length})`),
    friends.length ? h('ul', { class: 'chips' }, friends.map((id) => h('li', {}, h('button', { class: 'chip', onclick: () => goTo(id) }, name(id)))))
      : h('p', { class: 'small' }, 'Tocca una casa sulla mappa e bussa alla porta per fare amicizia.'),
    outgoing.length ? h('h3', {}, 'In attesa di risposta') : null,
    outgoing.length ? h('ul', { class: 'chips' }, outgoing.map((q) => h('li', { class: 'chip muted' }, name(q.to)))) : null));
}

function openProfile() {
  const mine = me();
  if (!mine) return openLogin();
  const r = myResident();
  const err = formError();
  const form = h('form', { class: 'form', novalidate: true },
    field('Frase di presentazione', h('textarea', { id: 'prof-bio', name: 'bio', rows: 2, maxlength: 120 }), 'Al massimo 120 caratteri, la vede chi visita la tua casa.'),
    field('Il mio Instagram (facoltativo)', h('input', { id: 'prof-ig', name: 'instagram', autocapitalize: 'off', placeholder: 'nomeutente' }), 'Lo mostriamo sulla tua casa solo se lo scrivi qui.'),
    err,
    h('button', { class: 'btn primary', type: 'submit' }, 'Salva il profilo'));
  form.bio.value = r?.bio || '';
  form.instagram.value = r?.instagram || '';
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    run(form.querySelector('[type=submit]'), async () => {
      try { await store.op({ type: 'profile', bio: form.bio.value, instagram: form.instagram.value }); toast('Profilo salvato'); } catch (ex) { showError(err, ex); }
    });
  });
  const delErr = formError();
  const del = h('form', { class: 'form danger-zone', novalidate: true, hidden: true },
    h('p', {}, 'La tua casa verrà demolita e il lotto tornerà libero. Amicizie e richieste vengono cancellate. Non si può annullare.'),
    field('Scrivi la password per confermare', h('input', { id: 'del-pass', name: 'password', type: 'password', autocomplete: 'current-password' })),
    delErr,
    h('button', { class: 'btn danger', type: 'submit' }, 'Cancella definitivamente il mio account'));
  del.addEventListener('submit', (e) => {
    e.preventDefault();
    run(del.querySelector('[type=submit]'), async () => {
      try { await store.deleteAccount(del.password.value); closeSheet(); toast('Account cancellato. Grazie di essere passato da qui.'); } catch (ex) { showError(delErr, ex); }
    });
  });
  openSheet(mine.username || 'Il mio profilo', h('div', { class: 'stack' },
    h('div', { class: 'badges' },
      r?.number ? h('span', { class: 'tag' }, `Abitante n°${r.number}`) : h('span', { class: 'tag warn' }, 'Email da confermare'),
      isFounder(r) ? h('span', { class: 'tag gold' }, 'Fondatore') : null),
    form,
    h('h3', {}, 'Account'),
    h('p', { class: 'small' }, `Email: ${mine.email}`),
    h('div', { class: 'row-wrap' },
      mine.admin ? h('button', { class: 'btn', onclick: openRedazione }, icon('desk'), 'Redazione') : null,
      h('button', { class: 'btn', onclick: (e) => run(e.currentTarget, async () => showExport(await store.exportData())) }, 'Scarica i miei dati'),
      h('button', { class: 'btn', onclick: (e) => run(e.currentTarget, async () => { await store.logout(); closeSheet(); toast('Sei uscito. A presto!'); }) }, 'Esci'),
      h('button', { class: 'btn ghost danger-text', onclick: () => { del.hidden = !del.hidden; } }, 'Cancella account')),
    del,
    h('p', { class: 'small' }, h('a', { href: '#', onclick: (e) => { e.preventDefault(); openRules(openProfile); } }, 'Regolamento e privacy'))));
}

function showExport(data) {
  const text = JSON.stringify(data, null, 2);
  const pre = h('pre', { class: 'code' }, text);
  openSheet('I miei dati', h('div', { class: 'stack' },
    h('p', { class: 'small' }, 'Questi sono tutti i dati che la città conserva su di te.'),
    pre,
    h('div', { class: 'row-wrap' },
      h('button', { class: 'btn', onclick: () => navigator.clipboard?.writeText(text).then(() => toast('Copiato'), () => selectText(pre)) }, 'Copia'),
      DEMO ? null : h('a', { class: 'btn', href: '/api/me/export', download: 'virtual-italy-i-miei-dati.json' }, 'Scarica il file'))));
}
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); getSelection().removeAllRanges(); getSelection().addRange(r); }

/* Piazza, quartieri, giornale -------------------------------------------------- */

function openMuro() {
  const city = store.city;
  const founders = Object.values(city.residents).filter((r) => isFounder(r)).sort((a, b) => a.number - b.number);
  const built = builtCount(city);
  const g = goalProgress(built);
  openSheet('Muro dei Fondatori', h('div', { class: 'stack' },
    h('div', { class: 'goal-card' },
      h('p', {}, h('strong', {}, nextGoal(city, built))),
      h('span', { class: 'goal-track big' }, h('span', { class: 'goal-fill', style: `width:${Math.round(g.ratio * 100)}%` })),
      h('p', { class: 'small' }, 'A 25 abitanti arriva la fontana in piazza. Ogni nuovo abitante migliora la città per tutti.')),
    h('p', {}, `I primi ${FOUNDERS} abitanti hanno una targa d'oro sulla casa e il nome inciso qui.`),
    founders.length ? h('ol', { class: 'wall' }, founders.map((r) => h('li', {}, h('span', { class: 'num' }, r.number), r.username)))
      : h('p', { class: 'small' }, 'Il muro è ancora vuoto: il primo nome potrebbe essere il tuo.'),
    h('p', { class: 'small' }, `Posti da Fondatore ancora liberi: ${Math.max(0, FOUNDERS - founders.length)}.`)));
}

function openLocked(id) {
  const d = districtById(id);
  const open = store.city.openDistricts;
  const total = lotsOpen(open);
  const taken = Object.keys(store.city.houses).filter((k) => districtAt(...parseKey(k)) <= open).length;
  const need = Math.max(0, Math.ceil(total * UNLOCK_RATIO) - taken);
  openSheet(d.name, h('div', { class: 'stack' },
    id === open + 1
      ? h('p', {}, `È il prossimo quartiere ad aprire: mancano ${need} ${need === 1 ? 'casa' : 'case'} nei quartieri aperti. Avrà ${PLAN.lotsByDistrict.get(id).length} lotti e una nuova strada principale.`)
      : h('p', {}, `Per ora è campagna. Aprirà dopo gli altri quartieri, con ${PLAN.lotsByDistrict.get(id).length} lotti.`),
    h('p', { class: 'small' }, 'Le linee tratteggiate bianche sono le strade principali già previste dal piano regolatore.')));
}

function openGiornale() {
  const city = store.city;
  const admin = me()?.admin;
  const list = h('ol', { class: 'news' }, city.news.map((n) => {
    const f = formatNews(n, city);
    return h('li', { class: 'news-item' },
      h('p', { class: 'news-date' }, fmtDay(n.at)),
      h('h3', { class: 'news-title' }, f.title),
      h('p', {}, f.text),
      h('div', { class: 'row-wrap' },
        n.slot && city.houses[n.slot] ? h('button', { class: 'link-btn', onclick: () => { closeSheet(); map.focus(n.slot, 2.2); } }, 'Vedi sulla mappa') : null,
        admin ? h('button', { class: 'link-btn', onclick: () => openPoster(n, 'post') }, 'Cartolina post') : null,
        admin ? h('button', { class: 'link-btn', onclick: () => openPoster(n, 'story') }, 'Storia') : null));
  }));
  openSheet('', h('div', { class: 'paper' },
    h('div', { class: 'masthead' }, h('p', { class: 'mast-name' }, CITY), h('p', { class: 'mast-sub' }, `${PAPER} · il giornale della città`)),
    admin ? h('button', { class: 'btn small', onclick: openRedazione }, icon('desk'), 'Redazione') : null,
    list), { wide: true });
}

async function openPoster(n, format) {
  openSheet(format === 'story' ? 'Storia per Instagram' : 'Post per Instagram', h('p', { class: 'small' }, 'Preparo l\'immagine…'), { wide: true });
  const cv = await renderPoster(store.city, n, format);
  const url = cv.toDataURL('image/png');
  const name = `virtual-italy-${format}-${new Date(n.at).toISOString().slice(0, 10)}.png`;
  openSheet(format === 'story' ? 'Storia per Instagram' : 'Post per Instagram', h('div', { class: 'stack' },
    h('img', { class: 'poster', src: url, alt: formatNews(n, store.city).title }),
    DEMO ? h('p', { class: 'small' }, 'Nella demo il download è bloccato: tieni premuta l\'immagine (o clic destro) per salvarla.')
      : h('a', { class: 'btn primary', href: url, download: name }, 'Scarica l\'immagine'),
    h('p', { class: 'small' }, `Testo suggerito: ${formatNews(n, store.city).text} Il link per entrare è in bio.`)), { wide: true });
}

async function openRedazione() {
  const data = await run(null, () => store.admin());
  if (!data) return;
  const city = store.city;
  const name = (id) => city.residents[id]?.username || 'ex abitante';
  const reports = city.reports.filter((r) => !r.resolved);
  const residents = Object.values(city.residents);
  openSheet('Redazione', h('div', { class: 'stack' },
    h('ul', { class: 'facts' },
      h('li', {}, h('strong', {}, residents.filter((r) => r.confirmed).length), ' abitanti confermati'),
      h('li', {}, h('strong', {}, residents.filter((r) => !r.confirmed).length), ' in attesa di conferma'),
      h('li', {}, h('strong', {}, `${city.openDistricts}/5`), ' quartieri aperti')),
    h('h3', {}, 'Da dove arrivano gli iscritti'),
    data.sources.length ? h('table', { class: 'table' },
      h('thead', {}, h('tr', {}, h('th', {}, 'Provenienza'), h('th', {}, 'Iscritti'), h('th', {}, 'Confermati'))),
      h('tbody', {}, data.sources.map((s) => h('tr', {}, h('td', {}, s.source), h('td', {}, s.n), h('td', {}, s.confirmed || 0)))))
      : h('p', { class: 'small' }, 'Ancora nessun iscritto.'),
    h('p', { class: 'small' }, 'Per sapere quali post funzionano, nella bio usa link come …/?da=bio e nelle storie …/?da=storia.'),
    h('h3', {}, `Segnalazioni aperte (${reports.length})`),
    reports.length ? h('ul', { class: 'rows' }, reports.map((rep) => h('li', { class: 'row col' },
      h('p', {}, h('strong', {}, name(rep.target)), ` · segnalato il ${fmtDay(rep.at)}`),
      h('p', { class: 'small' }, rep.reason),
      h('span', { class: 'row-actions' },
        h('button', { class: 'btn small', onclick: (e) => run(e.currentTarget, async () => { await store.op({ type: 'resolveReport', id: rep.id }); openRedazione(); }) }, 'Archivia'),
        city.residents[rep.target] ? h('button', { class: 'btn small danger', onclick: (e) => run(e.currentTarget, async () => {
          await store.op({ type: 'suspend', id: rep.target, on: !city.residents[rep.target].suspended });
          await store.op({ type: 'resolveReport', id: rep.id });
          toast('Abitante sospeso'); openRedazione();
        }) }, 'Sospendi') : null)))) : h('p', { class: 'small' }, 'Nessuna segnalazione da leggere.'),
    data.mailConfigured ? null : h('h3', {}, 'Posta in uscita (email non ancora configurate)'),
    data.mailConfigured ? null : data.outbox.length ? h('ul', { class: 'rows' }, data.outbox.slice(0, 10).map((m) => h('li', { class: 'row col' },
      h('p', {}, h('strong', {}, m.subject), ` → ${m.to}`), h('p', { class: 'small pre' }, m.body)))) : h('p', { class: 'small' }, 'Vuota.')), { wide: true });
}

function openRules(back) {
  openSheet('Regolamento e privacy', h('div', { class: 'stack prose' },
    h('h3', {}, 'Regolamento della città'),
    h('ol', {},
      h('li', {}, 'Un account per persona, una casa per account.'),
      h('li', {}, 'Nome utente e frase di presentazione devono essere rispettosi: niente insulti, volgarità, spam o nomi che imitano altre persone o la redazione.'),
      h('li', {}, 'Chi non rispetta le regole può essere segnalato e sospeso dalla redazione.'),
      h('li', {}, 'Per iscriversi bisogna avere almeno 14 anni.')),
    h('h3', {}, 'Informativa privacy (sintesi)'),
    h('p', {}, `Conserviamo email, nome utente, password (cifrata), casa, profilo, amicizie e la provenienza dell'iscrizione. L'email serve solo per confermare l'account e recuperare la password: non è mai mostrata agli altri e non viene ceduta a terzi. Il profilo Instagram compare solo se lo inserisci tu. Dal tuo profilo puoi scaricare tutti i tuoi dati o cancellare l'account in ogni momento.`),
    h('p', { class: 'small' }, 'Testo da completare con i dati del titolare del trattamento prima della pubblicazione.'),
    back ? h('button', { class: 'btn', onclick: back }, 'Torna indietro') : null));
}

function openDemoInbox() {
  const mails = store.inbox();
  openSheet('Email finte (demo)', h('div', { class: 'stack' },
    h('p', { class: 'small' }, 'Nella versione vera queste email arrivano nella casella di posta di chi si iscrive.'),
    mails.length ? h('ul', { class: 'rows' }, mails.map((m) => h('li', { class: 'row col' },
      h('p', {}, h('strong', {}, m.subject), ` → ${m.to}`),
      h('p', { class: 'small' }, m.body),
      m.action ? h('button', { class: 'btn small primary', onclick: () => (m.action.kind === 'confirm' ? confirmEmail(m.action.token) : openResetForm(m.action.token)) },
        m.action.kind === 'confirm' ? 'Conferma l\'email' : 'Scegli la nuova password') : null))) : h('p', { class: 'small' }, 'Nessuna email per ora.')));
}

/* Tocchi sulla mappa ------------------------------------------------------- */

function onTap(t) {
  if (ui.mode === 'choose') {
    if (t.kind === 'lot') return openLot(t.slot);
    if (t.kind === 'locked') return toast('Questo quartiere non è ancora aperto: scegli un lotto tratteggiato.', 'err');
    if (t.kind === 'house') return toast('Questo lotto è già occupato.', 'err');
    return;
  }
  if (t.kind === 'house') return openHouse(t.slot);
  if (t.kind === 'lot') return openLot(t.slot);
  if (t.kind === 'giornale') return openGiornale();
  if (t.kind === 'muro' || t.kind === 'piazza') return openMuro();
  if (t.kind === 'locked') return openLocked(t.district);
  closeSheet();
}

/* Avvio ------------------------------------------------------------------- */

async function boot() {
  shell();
  try {
    await store.init();
  } catch (e) {
    $('#bottom').replaceChildren(h('div', { class: 'bar' }, h('p', {}, errText(e)), h('button', { class: 'btn', onclick: () => location.reload() }, 'Riprova')));
    return;
  }
  map.setCity(store.city, { animateNew: false });
  store.subscribe(() => { map.setCity(store.city); update(); });
  update();

  // Link dalle email e provenienza (?da=instagram) dal link in bio.
  const q = new URLSearchParams(location.search);
  if (q.get('da')) ss.set('vi-source', q.get('da').replace(/[^a-z0-9_-]/gi, '').slice(0, 30));
  const confirmToken = q.get('conferma');
  const resetToken = q.get('nuova-password');
  if (!DEMO && (confirmToken || resetToken || q.get('da'))) history.replaceState(null, '', location.pathname);
  if (confirmToken) return confirmEmail(confirmToken);
  if (resetToken) return openResetForm(resetToken);
  if (location.pathname === '/giornale') return openGiornale();
  if (!me() && !ui.welcomeSeen) openWelcome();
  else if (me() && !myHouse()) startChoosing();
}

if ('serviceWorker' in navigator && !DEMO && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(() => {});
setInterval(update, 60000);
boot();

</script>
