name: TRIBE MACHINE · Windows

# Compila l'installer Windows su una macchina Windows reale, avvia l'app impacchettata
# con una prova automatica e pubblica installer, versione portatile e screenshot come artifact.

on:
  push:
    paths:
      - 'tribe-machine/**'
      - '.github/workflows/tribe-machine-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tribe-machine
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tribe-machine/package-lock.json

      - name: Dipendenze
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer e portatile
        run: npm run dist:win

      - name: Prova di avvio dell'app impacchettata
        run: node scripts/smoke-app.mjs --packaged

      - name: Pubblica artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRIBE-MACHINE-windows
          path: |
            tribe-machine/release/TRIBE-MACHINE-Setup-*.exe
            tribe-machine/release/TRIBE-MACHINE-Portable-*.exe
            tribe-machine/release/smoke.png
          if-no-files-found: warn
          retention-days: 30

      # Release GitHub: download diretto con un clic (una Release per versione, aggiornata a ogni build riuscita)
      - name: Pubblica Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="tribe-machine-v$VERSION"
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          cat > notes.md <<NOTES
          **TRIBE MACHINE TM-1 per Windows 11 (64 bit)**

          - \`TRIBE-MACHINE-Setup-$VERSION.exe\`: installer (icona su desktop e menu Start, si disinstalla da Impostazioni > App)
          - \`TRIBE-MACHINE-Portable-$VERSION.exe\`: un solo file, nessuna installazione

          Al primo avvio Windows SmartScreen può dire "PC protetto da Windows": l'eseguibile non è firmato con un
          certificato commerciale. Clicca **Ulteriori informazioni → Esegui comunque**.

          Build $SHORT, compilata e provata automaticamente su Windows (avvio, audio, riproduzione, LED, render).
          NOTES
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TRIBE MACHINE $VERSION per Windows" --notes-file notes.md
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" release/TRIBE-MACHINE-Setup-$VERSION.exe release/TRIBE-MACHINE-Portable-$VERSION.exe --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
