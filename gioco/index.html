<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EggMonster'S</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: scena 3D a tutto schermo; sopra, adesivi cartoon (bordo inchiostro, ombra piena) agli angoli. Pensato per PC. */
:root{
  --ink:#2a1f33; --paper:#fff6df; --paper2:#f1e2bd; --yolk:#ffc21a; --orange:#ff8a1f;
  --sky:#8fd6ff; --leaf:#4fcf5d; --warn:#ffb020; --hurt:#f0484e; --mute:#75698a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Baloo 2","Trebuchet MS","Segoe UI",sans-serif;
  --gl:max(22px, env(safe-area-inset-left, 0px)); --gr:max(22px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:1.3em;height:1.3em;fill:currentColor;flex:none;vertical-align:-.25em}
.stk{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border:2.5px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;background:var(--c,var(--paper2));white-space:nowrap}
.chip .ic{width:13px;height:13px}
kbd{font:800 11px var(--body);background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 6px;letter-spacing:.03em}

/* pulsanti */
.cmd{position:relative;display:flex;align-items:center;gap:10px;min-width:0;text-align:left;background:var(--c,var(--paper));border:4px solid var(--ink);
  border-radius:16px;padding:9px 12px;font-family:var(--display);font-size:21px;line-height:1.05;box-shadow:0 6px 0 var(--ink);
  transition:transform .08s, box-shadow .08s, filter .08s}
.cmd:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg);box-shadow:0 9px 0 var(--ink);filter:brightness(1.07)}
.cmd:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.cmd:focus-visible{outline:4px solid #fff;outline-offset:2px}
.cmd:disabled{filter:grayscale(.9) brightness(.85);opacity:.6;cursor:default}
.cmd .ic{width:30px;height:30px}
.cmd img{width:44px;height:44px;flex:none;margin:-6px 0 -6px -4px}
.cmd .t{min-width:0;flex:1}
.cmd small{display:block;font-family:var(--body);font-weight:800;font-size:13px;opacity:.85;margin-top:3px}
.cmd kbd{position:absolute;right:7px;top:-11px}
.cmd.wide{grid-column:1/-1;justify-content:center;font-size:17px;padding:6px 12px;--c:#dcd3c2}
.cmd.wide .t{flex:none}
.cmd.big{font-size:26px;justify-content:center;padding:14px 20px;--c:var(--yolk)}
.cmd.big .t{flex:none}

/* HUD esplorazione */
#hud{position:absolute;inset:0;pointer-events:none;padding:18px var(--gr) 18px var(--gl);display:flex;flex-direction:column;justify-content:space-between}
#hud>div{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
#hud>div:last-child{align-items:flex-end}
#hud button,#lead{pointer-events:auto}
#hudL{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
#zone{font-family:var(--display);font-size:20px;padding:5px 16px 5px 14px;transform:rotate(-1.5deg);background:var(--c,var(--paper));border-radius:12px}
#zone small{display:block;font:800 12px var(--body);opacity:.8}
#hudR{display:flex;gap:12px;align-items:center}
#bag{display:flex;gap:14px;padding:7px 16px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
#bag span{display:flex;align-items:center;gap:6px}
#bag .ic{width:24px;height:24px}
#hud .cmd{font-size:19px;padding:8px 14px}
#hint{padding:7px 14px;font-weight:800;font-size:14px;display:flex;gap:14px;align-items:center}
#map{width:150px;height:150px;border-radius:50%;border:5px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:#39b6f0}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:4px solid var(--ink);background:rgba(255,246,223,.35);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--yolk);border:4px solid var(--ink)}

/* targhe mostro */
.plate{display:flex;align-items:center;gap:6px;width:330px;max-width:100%;padding:8px 16px 8px 8px;border-radius:44px 18px 18px 44px}
.plate .pt{width:74px;height:74px;flex:none;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 50% 35%,#fff,var(--c,#ffe9a8));margin:-4px 2px -4px -4px}
.plate .pi{flex:1;min-width:0}
.plate .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plate .nm{font-family:var(--display);font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.plate .lv{font-family:var(--display);font-size:15px;background:var(--yolk);border:2.5px solid var(--ink);border-radius:99px;padding:0 9px;white-space:nowrap}
.hpr{display:flex;align-items:center;gap:6px;margin-top:3px}
.hpr em{font:normal 13px var(--display);color:var(--paper);background:var(--ink);border-radius:6px;padding:0 5px}
.bar{flex:1;height:14px;border:3px solid var(--ink);border-radius:99px;background:#5a4b66;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--leaf);box-shadow:inset 0 3px 0 rgba(255,255,255,.45);transition:width .45s ease-out, background .3s}
.bar.xp{height:7px;border-width:2px;margin-top:4px;flex:none}.bar.xp i{background:#4aa8ff;box-shadow:none}
.plate .sub{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;gap:6px}
#cFoe{position:absolute;left:var(--gl);top:18px;transform:rotate(-1deg)}
#cMe{transform:rotate(1deg);align-self:flex-end}
#lead{cursor:pointer;width:290px}
#lead .pt{width:62px;height:62px}#lead .nm{font-size:20px}

/* lotta */
#cards{position:absolute;inset:0;pointer-events:none}
#panel{position:absolute;left:0;right:0;bottom:0;padding:60px var(--gr) max(18px, env(safe-area-inset-bottom, 0px)) var(--gl);pointer-events:none;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:20px;align-items:end;background:linear-gradient(rgba(42,31,51,0),rgba(42,31,51,.38))}
#panel>*{pointer-events:auto}
#msg{position:relative;padding:16px 22px;min-height:86px;font-size:22px;font-weight:800;line-height:1.25;border-radius:22px;max-width:760px}
#msg.wait::after{content:"▼";position:absolute;right:16px;bottom:8px;font-size:15px;color:var(--orange);animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translateY(5px)}}
#side{display:flex;flex-direction:column;gap:16px;min-width:0}
#menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:54px;color:#fff;-webkit-text-stroke:3px var(--ink);
  paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);pointer-events:none;animation:fl 1.1s ease-out forwards;white-space:nowrap}
.float.heal{color:#8dffa0}.float.sm{font-size:34px;color:#d8d0e0}.float.sup{color:var(--yolk);font-size:68px}
@keyframes fl{0%{opacity:0;margin-top:14px;scale:.4}14%{opacity:1;scale:1.3}28%{scale:1}100%{opacity:0;margin-top:-90px}}
.banner{position:absolute;left:50%;top:22%;font-family:var(--display);font-size:64px;color:var(--c,var(--yolk));-webkit-text-stroke:4px var(--ink);
  paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);white-space:nowrap;pointer-events:none;animation:ban 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(0) rotate(-14deg)}18%{transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}28%,78%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-90%) scale(.8) rotate(-4deg);opacity:0}}
#rays{position:absolute;inset:-60%;pointer-events:none;opacity:0;transition:opacity .5s;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,120,.85) 0 9deg,rgba(255,255,255,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle,transparent 16%,#000 46%);mask:radial-gradient(circle,transparent 16%,#000 46%);animation:spin 14s linear infinite}
#rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--c,#fff)}
#iris{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent var(--r,150vmax),var(--ink) calc(var(--r,150vmax) + 2px))}

/* schermate */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px var(--gr) 24px var(--gl);overflow:auto}
.screen.dim{background:rgba(42,31,51,.6)}
#title{flex-direction:column;gap:4px;text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(42,31,51,0) 30%,rgba(42,31,51,.5))}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,10.5vw,150px);line-height:1;margin:0 0 10px;display:flex}
#title h1 span{display:inline-block;color:var(--yolk);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);
  animation:drop .55s cubic-bezier(.3,1.5,.5,1) backwards, hop 1.9s ease-in-out infinite;animation-delay:calc(var(--i)*.06s), calc(1.1s + var(--i)*.1s);transform:rotate(calc((var(--i) - 5.5)*1.3deg))}
#title h1 span.eg{color:var(--paper)}
@keyframes drop{from{opacity:0;scale:3.2}to{opacity:1;scale:1}}
#title p,#title .acts{animation:rise .5s ease-out .8s backwards}
@keyframes rise{from{opacity:0;translate:0 30px}}
#bars{position:absolute;inset:0;pointer-events:none}
#bars::before,#bars::after{content:"";position:absolute;left:0;right:0;height:11vh;background:var(--ink)}
#bars::before{top:0}#bars::after{bottom:0}
#cap{position:absolute;left:var(--gl);right:var(--gr);bottom:14vh;text-align:center;font-family:var(--display);font-size:clamp(22px,3.3vw,46px);color:#fff;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-wrap:balance}
#cap span{display:inline-block;animation:rise .5s ease-out backwards}
#bars small{position:absolute;right:var(--gr);bottom:3.6vh;z-index:1;color:var(--paper);font-weight:800;font-size:14px;opacity:.8}
#splash{background:var(--ink);flex-direction:column;gap:34px}
#splash .egg{width:104px;height:134px;border-width:6px;animation:wob 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes hop{0%,60%,100%{translate:0 0}30%{translate:0 -18px}}
#title p{font-family:var(--display);font-size:26px;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:14px;
  padding:4px 20px;margin:0 0 30px;transform:rotate(-2deg);box-shadow:0 6px 0 var(--ink)}
#title .acts{display:flex;flex-direction:column;gap:20px;width:340px;max-width:100%}
.sheet{width:min(940px,100%);max-height:100%;overflow:auto;padding:24px 26px;border-radius:26px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 2px;text-wrap:balance}
.sheet>p{margin:0 0 18px;color:var(--mute);font-weight:800;font-size:17px}
.who{display:block;width:max-content;font-family:var(--display);font-weight:400;font-size:17px;background:#c9a8ff;border:3px solid var(--ink);border-radius:10px;padding:0 10px;margin:-30px 0 6px -6px;transform:rotate(-2deg)}
.an{font-weight:800;font-size:14px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#pick{position:absolute;right:var(--gr);top:50%;transform:translateY(-50%);width:min(400px,calc(100% - var(--gl) - var(--gr)));display:grid;grid-template-columns:auto 1fr auto;gap:18px 12px;align-items:center;pointer-events:none}
#pick>*{pointer-events:auto}
#pkL,#pkR{font-size:26px;padding:13px 16px;--c:#fff;grid-row:2}
#pkL{grid-column:1}#pkR{grid-column:3}
.pkMid{display:contents}
#pkCard{grid-column:1/-1;grid-row:1;display:flex;flex-direction:column;gap:12px;padding:16px 20px 18px;box-sizing:border-box;border-radius:24px;transform:rotate(1deg)}
#pkCard .pp{width:100%;height:190px;object-fit:contain;flex:none;box-sizing:border-box;border-radius:20px;border:4px solid var(--ink);background:radial-gradient(circle at 50% 35%,#fff,var(--c))}
#pkCard .pin{flex:1;min-width:0}
#pkCard .row{display:flex;align-items:center;gap:12px}
#pkCard .nm{font-family:var(--display);font-size:36px;line-height:1}
#pkCard p{margin:4px 0 8px;font-weight:800;font-size:17px}
.sb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.sb .bar{display:block;height:11px;margin-top:2px}
.evo{display:flex;align-items:center;gap:6px;margin-top:8px;font-weight:800;font-size:14px;color:var(--mute)}
.sil{width:46px;height:46px;filter:brightness(0);opacity:.7}
#pkGo{grid-row:2;grid-column:2;font-size:22px;padding:13px 10px}
#teamList{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.mon{display:flex;gap:12px;border:4px solid var(--ink);border-radius:18px;padding:12px;background:#fff}
.mon img{width:104px;height:104px;flex:none;border-radius:16px;border:3px solid var(--ink);background:radial-gradient(circle at 50% 35%,#fff,var(--c))}
.mon .in{flex:1;min-width:0}
.mon .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mon .nm{font-family:var(--display);font-size:24px}
.mon .stats{display:flex;gap:12px;font-weight:800;font-size:14px;margin-top:5px;font-variant-numeric:tabular-nums}
.mon .mv{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mon .ab{font-size:14px;color:var(--mute);margin-top:5px;line-height:1.2}
.mon .cmd{font-size:15px;padding:4px 12px;box-shadow:0 4px 0 var(--ink);border-width:3px;margin-top:8px;--c:var(--yolk)}
.sheet .foot{display:flex;justify-content:flex-end;gap:14px;margin-top:18px}
.sheet .foot .cmd{padding:9px 22px}
#toast{position:absolute;left:50%;top:26px;transform:translateX(-50%) rotate(-1deg);padding:9px 20px;max-width:min(80%,560px);text-align:center;
  font-weight:800;font-size:18px;transition:opacity .3s, translate .3s;pointer-events:none}
#toast.off{opacity:0;translate:0 -30px}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-weight:800;background:var(--sky)}
@media (max-width:760px){#panel{grid-template-columns:1fr;padding-top:20px}#map,#hint{display:none}#pick{top:auto;bottom:16px;transform:none}#pkCard .pp{height:110px}#teamList{grid-template-columns:1fr}.banner{font-size:38px}}
@media (prefers-reduced-motion:reduce){.bar i,.cmd{transition:none}#title h1 span,#rays,#splash .egg{animation:none}}
</style>

<div id="app">
  <canvas id="c"></canvas>

  <div id="hud" hidden>
    <div>
      <div id="hudL">
        <div id="lead" class="plate stk" title="Apri la squadra"></div>
        <div id="zone" class="stk"></div>
      </div>
      <div id="hudR">
        <div id="bag" class="stk"></div>
        <button id="bTeam" class="cmd" style="--c:#6fc3ff"><span class="t">Squadra</span><kbd>Q</kbd></button>
        <button id="bSnd" class="cmd" aria-label="Audio"><span class="t">♪</span><kbd>M</kbd></button>
      </div>
    </div>
    <div>
      <div id="hint" class="stk"><span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> muoviti</span><span><kbd>Q</kbd> squadra</span></div>
      <canvas id="map" width="150" height="150"></canvas>
    </div>
  </div>
  <div id="joy" hidden><i></i></div>

  <div id="rays"></div>
  <div id="cards" hidden><div id="cFoe" class="plate stk"></div></div>
  <div id="panel" hidden>
    <div id="msg" class="stk"></div>
    <div id="side"><div id="cMe" class="plate stk"></div><div id="menu" hidden></div></div>
  </div>
  <div id="tint"></div>

  <div id="toast" class="stk off"></div>

  <div id="bars" hidden><div id="cap"></div><small><kbd>Invio</kbd> salta l'intro</small></div>

  <div id="title" class="screen" hidden>
    <h1 aria-label="EggMonster'S"></h1>
    <p>Mostri dall'uovo: allevali, falli lottare, falli evolvere</p>
    <div class="acts">
      <button id="bCont" class="cmd big" hidden><span class="t">Continua</span><kbd>Invio</kbd></button>
      <button id="bNew" class="cmd big"><span class="t">Nuova avventura</span></button>
    </div>
  </div>

  <div id="pick" hidden>
    <button id="pkL" class="cmd" aria-label="Uovo precedente"><span class="t">◀</span><kbd>A</kbd></button>
    <div class="pkMid"><div id="pkCard" class="stk"></div><button id="pkGo" class="cmd big"><span class="t">Scelgo quest'uovo</span><kbd>Invio</kbd></button></div>
    <button id="pkR" class="cmd" aria-label="Uovo successivo"><span class="t">▶</span><kbd>D</kbd></button>
  </div>

  <div id="team" class="screen dim" hidden>
    <div class="sheet stk">
      <h2>La tua squadra</h2>
      <p>Il primo della lista ti segue ed entra per primo in lotta.</p>
      <div id="teamList"></div>
      <div class="foot"><button id="bTeamX" class="cmd" style="--c:var(--yolk)"><span class="t">Chiudi</span><kbd>Esc</kbd></button></div>
    </div>
  </div>

  <div id="dialog" class="screen dim" hidden>
    <div class="sheet stk" style="width:min(520px,100%)">
      <h2 id="dlgT"></h2><p id="dlgP" style="margin:6px 0 0"></p>
      <div class="foot" id="dlgB"></div>
    </div>
  </div>

  <div id="iris"></div>
  <div id="splash" class="screen">
    <span class="egg" style="--e:#ffc21a"></span>
    <button id="bStart" class="cmd big"><span class="t">Comincia</span><kbd>Invio</kbd></button>
  </div>
  <div id="err" hidden>Il motore 3D non si è caricato. Controlla la connessione e ricarica la pagina.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE) { $('#err').hidden = false; return; }

/* ============ utilità ============ */
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
function seeded(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ============ dati di gioco ============ */
const EL = {
  normale: { n: 'Normale', c: '#e0d8c6', i: 'normale' }, brace: { n: 'Brace', c: '#ff7a45', i: 'flame' }, onda: { n: 'Onda', c: '#5cbcff', i: 'drop' },
  foglia: { n: 'Foglia', c: '#7ddc5a', i: 'leaf' }, scossa: { n: 'Scossa', c: '#ffd83d', i: 'bolt' }, sasso: { n: 'Sasso', c: '#c7a985', i: 'rock' },
  antico: { n: 'Antico', c: '#c29bff', i: 'star' },
};
const ICON = {
  flame: 'M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z', drop: 'M12 2c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z',
