// ---- fx.js ----
// Effetti: scintille di conferma, fucina animata nell'accesso, numeri che scorrono.
// Tutto si disattiva con "riduci movimento".


/* Scintille ---------------------------------------------------------- */

let canvas, ctx, sparks = [], raf = 0;
function ensureCanvas() {
  if (canvas) return;
  canvas = document.createElement('canvas');
  canvas.id = 'fx';
  canvas.setAttribute('aria-hidden', 'true');
  document.body.append(canvas);
  ctx = canvas.getContext('2d');
  const resize = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  addEventListener('resize', resize);
}

/** Esplosione di scintille dal punto (x, y) o dal centro di un elemento. */
function burst(target, { count = 34, power = 1, hue = 'molten' } = {}) {
  if (reducedMotion()) return;
  ensureCanvas();
  let x = innerWidth / 2, y = innerHeight / 2;
  if (target?.getBoundingClientRect) {
    const r = target.getBoundingClientRect();
    if (r.width) { x = r.left + r.width / 2; y = r.top + r.height / 2; }
  } else if (target && typeof target.x === 'number') ({ x, y } = target);
  for (let i = 0; i < count; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
    const v = (2.5 + Math.random() * 6.5) * power;
    sparks.push({
      x, y, px: x, py: y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 1, decay: 0.012 + Math.random() * 0.02,
      w: 1 + Math.random() * 1.8,
      c: hue === 'cool' ? `hsl(${190 + Math.random() * 30}, 100%, ${60 + Math.random() * 25}%)`
        : hue === 'dust' ? `hsl(${28 + Math.random() * 14}, ${18 + Math.random() * 20}%, ${52 + Math.random() * 25}%)`
        : `hsl(${38 + Math.random() * 16}, 100%, ${55 + Math.random() * 30}%)`,
      dust: hue === 'dust',
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.globalCompositeOperation = 'lighter';
  sparks = sparks.filter((s) => s.life > 0);
  for (const s of sparks) {
    s.px = s.x; s.py = s.y;
    s.vy += s.dust ? 0.05 : 0.22; s.vx *= s.dust ? 0.95 : 0.985; s.vy *= s.dust ? 0.95 : 0.985;
    s.x += s.vx; s.y += s.vy;
    s.life -= s.decay;
    ctx.strokeStyle = s.c;
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.lineWidth = s.w;
    ctx.beginPath();
    ctx.moveTo(s.px, s.py);
    ctx.lineTo(s.x - s.vx * 1.6, s.y - s.vy * 1.6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  raf = sparks.length ? requestAnimationFrame(tick) : 0;
  if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
}

/* Fucina: braci che salgono, per la schermata di accesso ------------- */

function forge(canvasEl) {
  const c = canvasEl.getContext('2d');
  let w = 0, h = 0, embers = [], alive = true, frame = 0;
  const still = reducedMotion();
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    w = canvasEl.clientWidth; h = canvasEl.clientHeight;
    canvasEl.width = w * dpr; canvasEl.height = h * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn(initial) {
    return {
      x: Math.random() * w,
      y: initial ? Math.random() * h : h + 10,
      r: 0.6 + Math.random() * 2.2,
      vy: 0.3 + Math.random() * 1.1,
      sway: Math.random() * Math.PI * 2,
      life: 0.4 + Math.random() * 0.6,
      hue: 35 + Math.random() * 20,
    };
  }
  resize();
  const ro = new ResizeObserver(resize);
  ro.observe(canvasEl);
  const N = Math.round(Math.min(70, (w * h) / 12000));
  for (let i = 0; i < N; i++) embers.push(spawn(true));
  function draw() {
    if (!alive) return;
    frame++;
    c.clearRect(0, 0, w, h);
    c.globalCompositeOperation = 'lighter';
    for (const e of embers) {
      if (!still) {
        e.y -= e.vy; e.sway += 0.02; e.x += Math.sin(e.sway) * 0.4;
        if (e.y < -10) Object.assign(e, spawn(false));
      }
      const a = Math.min(1, (e.y / h) * 1.4) * e.life;
      const g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 4);
      g.addColorStop(0, `hsla(${e.hue},100%,70%,${a})`);
      g.addColorStop(1, `hsla(${e.hue},100%,50%,0)`);
      c.fillStyle = g;
      c.beginPath(); c.arc(e.x, e.y, e.r * 4, 0, Math.PI * 2); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
    if (!still) requestAnimationFrame(draw);
  }
  draw();
  return () => { alive = false; ro.disconnect(); };
}

/* Numeri che scorrono -------------------------------------------------- */

const lastValues = new Map();

/** Anima il numero dal valore mostrato l'ultima volta (per chiave) al nuovo. */
function countUp(el, value, key, { format = (v) => fmtNum(v), duration = 900 } = {}) {
  const from = lastValues.has(key) ? lastValues.get(key) : 0;
  lastValues.set(key, value);
  if (reducedMotion() || from === value) { el.textContent = format(value); return; }
  const t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / duration);
    const e = 1 - Math.pow(1 - p, 4);
    el.textContent = format(from + (value - from) * e);
    if (p < 1 && el.isConnected) requestAnimationFrame(step);
    else el.textContent = format(value);
  };
  el.textContent = format(from);
  requestAnimationFrame(step);
}

/** Restituisce la larghezza mostrata in precedenza, per animare le barre dopo un nuovo rendering. */
function previousWidth(key, next) {
  const prev = lastValues.has('w:' + key) ? lastValues.get('w:' + key) : 0;
  lastValues.set('w:' + key, next);
  return reducedMotion() ? next : prev;
}

// ---- store.js ----
// Due archivi con la stessa interfaccia:
// - LocalStore: demo nel browser. NON è condiviso fra dispositivi; due schede dello stesso browser
//   si comportano come due dispositivi (conflitti di revisione reali).
// - RemoteStore: server reale (server/server.js), fonte unica per PC e telefono.


const DAY = 86400000;

function safeGet(storage, key) {
  try { return storage.getItem(key); } catch { return null; }
}
function safeSet(storage, key, value) {
  try { storage.setItem(key, value); return true; } catch { return false; }
}
function safeDel(storage, key) {
  try { storage.removeItem(key); } catch { /* niente */ }
}
const ls = () => { try { return window.localStorage; } catch { return null; } };
const ss = () => { try { return window.sessionStorage; } catch { return null; } };

class BaseStore {
  constructor() {
    this.listeners = new Set();
    this.status = { online: true, saving: false, lastSync: Date.now(), error: null };
  }
  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit(kind = 'state') { for (const fn of this.listeners) fn(kind); }
  setStatus(patch) { Object.assign(this.status, patch); this.emit('status'); }
}

/* ------------------------------------------------------------------ */

class LocalStore extends BaseStore {
  constructor() {
    super();
    this.mode = 'demo';
    this.key = 'magazzino-demo-v1';
    this.users = DEMO_USERS;
    this.sim = { offline: false, conflictNext: false };
    const off = Number(safeGet(ls(), this.key + ':offset'));
    this.offsetDays = Number.isFinite(off) ? off : 0;
    this.persistent = true;
    this.state = this.read() || this.seed();
    const uidSaved = safeGet(ss(), this.key + ':user') || safeGet(ls(), this.key + ':user');
    this.user = DEMO_USERS.find((u) => u.id === uidSaved) || null;
    addEventListener('storage', (e) => {
      if (e.key === this.key && e.newValue) {
        const next = this.read();
        if (next && next.rev !== this.state.rev) { this.state = next; this.status.lastSync = Date.now(); this.emit('remote'); }
      }
      if (e.key === this.key + ':offset') { this.offsetDays = Number(e.newValue) || 0; this.tick(); this.emit('clock'); }
    });
  }
  async init() { this.tick(); return { user: this.user }; }
  now() { return Date.now() + this.offsetDays * DAY; }
  today() { return romeDate(this.now()); }
  ctx() { return { user: this.user, now: this.now(), today: this.today() }; }
  read() {
    const raw = safeGet(ls(), this.key);
    if (!raw) return null;
    try { return normalizeState(JSON.parse(raw)); } catch { return null; }
  }
  write() {
    if (!safeSet(ls(), this.key, JSON.stringify(this.state))) this.persistent = false;
  }
  seed() {
    const s = buildDemoState(this.now ? this.now() : Date.now());
    this.state = s;
    this.write();
    return s;
  }
  resetDemo() {
    this.offsetDays = 0;
    safeSet(ls(), this.key + ':offset', '0');
    this.state = buildDemoState(Date.now());
    this.write();
    this.emit('state');
  }
  login(userId) {
    this.user = DEMO_USERS.find((u) => u.id === userId) || null;
    safeSet(ss(), this.key + ':user', userId);
    safeSet(ls(), this.key + ':user', userId);
    this.emit('auth');
  }
  logout() {
    this.user = null;
    safeDel(ss(), this.key + ':user');
    safeDel(ls(), this.key + ':user');
    this.emit('auth');
  }
  /** Stime automatiche: all'apertura e ogni 30 secondi mentre la pagina è aperta. */
  tick() {
    const latest = this.read();
    if (latest && latest.rev > this.state.rev) this.state = latest;
    const next = reconcile(this.state, { ...this.ctx(), user: this.user || DEMO_USERS[0] });
    if (next) { this.state = next; this.write(); this.emit('state'); }
    this.status.lastSync = Date.now();
  }
  shiftDays(n) {
    this.offsetDays = n === 0 ? 0 : this.offsetDays + n;
    safeSet(ls(), this.key + ':offset', String(this.offsetDays));
    this.tick();
    this.emit('clock');
  }
  async dispatch(op) {
    const full = { ...op, opId: op.opId || uid('op') };
    this.setStatus({ saving: true });
    await new Promise((r) => setTimeout(r, 160));
    try {
      if (this.sim.offline) {
        this.setStatus({ online: false, error: 'Archivio irraggiungibile' });
        const err = new Error('Archivio irraggiungibile: operazione NON salvata. Controlla la connessione e riprova.');
        err.code = 'network';
        err.op = full;
        throw err;
      }
      // Rilegge l'archivio: un'altra scheda (altro "dispositivo") può aver salvato nel frattempo.
      const latest = this.read();
      if (latest && latest.rev > this.state.rev) this.state = latest;
      if (this.sim.conflictNext) {
        this.sim.conflictNext = false;
        this.simulateOtherDevice(full);
      }
      const r = applyOp(this.state, full, this.ctx());
      if (!r.duplicate) { this.state = r.state; this.write(); }
      this.status.online = true; this.status.error = null; this.status.lastSync = Date.now();
      this.emit('state');
      return r.result;
    } catch (e) {
      if (e instanceof DomainError && e.code === 'conflict') this.emit('state');
      throw e;
    } finally {
      this.setStatus({ saving: false });
    }
  }
  /** Strumento demo: un altro dispositivo modifica lo stesso elemento un attimo prima del salvataggio. */
  simulateOtherDevice(op) {
    const s = structuredClone(this.state);
    const pools = [['lotId', 'lots'], ['planId', 'plans'], ['noteId', 'notes'], ['orderId', 'orders'], ['eventId', 'events']];
    for (const [k, coll] of pools) {
      if (!op[k]) continue;
      const e = s[coll].find((x) => x.id === op[k]);
      if (!e) continue;
      e.rev += 1;
      e.updatedAt = this.now();
      e.updatedByName = 'Altro dispositivo (simulato)';
      s.audit.push({ id: uid('au'), at: this.now(), by: 'sim', byName: 'Altro dispositivo (simulato)', action: 'Modifica concorrente simulata', object: coll, objectId: e.id });
      s.rev += 1;
      this.state = s;
      this.write();
      return;
    }
  }
  exportJson() { return JSON.stringify(exportBackup(this.state, { exportedBy: this.user?.name, demo: true }), null, 2); }
}

/* ------------------------------------------------------------------ */

class RemoteStore extends BaseStore {
  constructor() {
    super();
    this.mode = 'server';
    this.state = null;
    this.user = null;
    this.users = [];
    this.serverOffset = 0;
    this.persistent = true;
  }
  async api(method, path, body) {
    let res;
    try {
      res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json', 'X-Magazzino': '1' },
        credentials: 'same-origin',
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch {
      this.setStatus({ online: false, error: 'Server irraggiungibile' });
      const err = new Error('Server irraggiungibile: operazione NON salvata. Controlla la connessione e riprova.');
      err.code = 'network';
      throw err;
    }
    let data = {};
    try { data = await res.json(); } catch { /* risposta vuota */ }
    if (!this.status.online) this.setStatus({ online: true, error: null });
    if (!res.ok) {
      if (data.state) { this.state = normalizeState(data.state); this.emit('state'); }
      if (res.status === 401 && this.user) { this.user = null; this.emit('auth'); }
      throw new DomainError(data.code || 'validation', data.error || `Errore ${res.status}`, data.extra);
    }
    return data;
  }
  async init() {
    const s = await this.api('GET', '/api/session');
    this.user = s.user;
    this.needsSetup = s.needsSetup;
    if (this.user) await this.pull(true);
    if (!this.poller) this.poller = setInterval(() => this.user && this.pull().catch(() => {}), 5000);
    return s;
  }
  now() { return Date.now() + this.serverOffset; }
  today() { return romeDate(this.now()); }
  async pull(force = false) {
    const d = await this.api('GET', `/api/state${force || !this.state ? '' : `?since=${this.state.rev}`}`);
    if (d.serverTime) this.serverOffset = d.serverTime - Date.now();
    this.status.lastSync = Date.now();
    if (!d.unchanged) { this.state = normalizeState(d.state); this.emit('remote'); } else this.emit('status');
  }
  async dispatch(op) {
    const full = { ...op, opId: op.opId || uid('op') };
    this.setStatus({ saving: true });
    try {
      const d = await this.api('POST', '/api/op', { op: full });
      this.state = normalizeState(d.state);
      this.status.lastSync = Date.now();
      this.emit('state');
      return d.result;
    } catch (e) {
      if (e.code === 'network') e.op = full; // ripetibile con lo stesso opId: nessun doppio effetto
      throw e;
    } finally {
      this.setStatus({ saving: false });
    }
  }
  async login(username, password) { await this.api('POST', '/api/login', { username, password }); await this.init(); this.emit('auth'); }
  async setup(body) { await this.api('POST', '/api/setup', body); await this.init(); this.emit('auth'); }
  async register(body) { await this.api('POST', '/api/register', body); await this.init(); this.emit('auth'); }
  async logout() { await this.api('POST', '/api/logout').catch(() => {}); this.user = null; this.state = null; this.emit('auth'); }
  async listUsers() { return this.api('GET', '/api/users'); }
  async invite(role, name) { return this.api('POST', '/api/invites', { role, name }); }
  async updateUser(id, patch) { return this.api('POST', '/api/users/update', { id, ...patch }); }
  async changePassword(current, next) { return this.api('POST', '/api/password', { current, next }); }
  exportJson() { return JSON.stringify(exportBackup(this.state, { exportedBy: this.user?.name }), null, 2); }
}

/** Sceglie l'archivio: build artifact = demo; sul server si usa l'API se risponde. */
async function createStore() {
  const forced = globalThis.__MAG_MODE;
  const wantsDemo = forced === 'demo' || /[?&]demo\b/.test(location.search);
  if (!wantsDemo) {
    try {
      const r = await fetch('/api/session', { headers: { 'X-Magazzino': '1' } });
      if (r.ok && (r.headers.get('content-type') || '').includes('json')) {
        const store = new RemoteStore();
        await store.init();
        return store;
      }
    } catch { /* nessun server: demo locale */ }
  }
  const store = new LocalStore();
  await store.init();
  return store;
}

// ---- dialogs.js ----
// Moduli delle operazioni. Ogni modulo cattura la revisione dell'elemento all'apertura:
// se un altro operatore salva prima, il salvataggio viene rifiutato (niente sovrascritture).




const S = () => App.store.state;

/* Esecuzione con esito chiaro --------------------------------------- */

async function act(op, { button, quiet = false } = {}) {
  setBusy(button, true);
  try {
    const result = await App.store.dispatch(op);
    if (!quiet) {
      burst(button, { hue: burstHue(op.type) });
      toast(result?.message || 'Salvato', { art: artFor(op) });
    }
    return result;
  } catch (e) {
    reportError(e);
    return null;
  } finally {
    setBusy(button, false);
  }
}

/** Il mezzo che accompagna l'esito: muletto per i carichi, pala per gli scarichi, camion per gli arrivi. */
function artFor(op) {
  const t = op.type || '';
  if (t === 'lot.create' || t === 'lot.load') return vehicle('forklift', { load: true });
  if (t === 'lot.unload' || t === 'lot.unloadAll' || t === 'lot.delete') return vehicle('loader', { load: true });
  if (t.startsWith('plan.receive') || t === 'plan.create' || t === 'plan.confirmEstimates') return vehicle('truck');
  if (t === 'lot.transfer' || t === 'lot.update') return vehicle('telehandler', { load: true });
  if (t === 'fleet.update') {
    const v = App.store.state.fleet.find((x) => x.id === op.vehicleId);
    return vehicle(v?.kind || 'forklift');
  }
  return null;
}
const burstHue = (t) => (t === 'lot.unload' || t === 'lot.unloadAll' || t === 'lot.delete' ? 'dust' : 'molten');

/** Viaggi necessari con ciascun mezzo (stima, aggiunta di questa versione). */
function tripsBox() {
  const box = h('div.field', { hidden: true }, h('div.field-label', 'Con i mezzi del piazzale'), h('div.trips'));
  return {
    el: box,
    update(t) {
      const list = tripsFor(S(), t);
      box.hidden = !list.length;
      fill(box.lastChild, list.map((v) => {
        const off = v.status === 'Manutenzione' || v.status === 'Fermo';
        return h(`span.trip${off ? '.off' : ''}`, { title: off ? `${v.name}: ${v.status.toLowerCase()}` : `${v.name}, portata ${fmtNum(v.capacity)} t` },
          vehicle(v.kind), h('span', v.name), h('b', `${v.trips} ${v.trips === 1 ? 'viaggio' : 'viaggi'}`));
      }));
    },
  };
}

function reportError(e, { inline } = {}) {
  if (e.code === 'network') {
    toast(e.message, { kind: 'error', action: e.op ? { label: 'Riprova', run: () => act(e.op) } : null });
  } else if (e.code === 'conflict') {
    toast(e.message, { kind: 'warn', duration: 10000 });
  } else if (inline) {
    inline(e.message);
  } else {
    toast(e.message || 'Operazione non riuscita', { kind: 'error' });
  }
}

function setBusy(btn, busy) {
  if (!btn) return;
  if (busy) {
    btn.dataset.label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '';
    btn.append(h('span.spin'), 'Salvo…');
  } else if (btn.dataset.label) {
    btn.innerHTML = btn.dataset.label;
    btn.disabled = false;
    delete btn.dataset.label;
  }
}

/**
 * Dialogo con modulo. build() restituisce l'operazione oppure lancia un messaggio.
 * Errori di validazione restano nel modulo; conflitti chiudono e ricaricano.
 */
function formDialog({ title, subtitle, content, submitLabel = 'Salva', danger = false, wide = false, build, after, extraFoot }) {
  const opId = uid('op'); // stesso id per i tentativi ripetuti: un solo effetto
  let errBox;
  let submitBtn;
  return openDialog({
    title, subtitle, wide,
    body: (d) => {
      errBox = h('div', { role: 'alert' });
      const form = h('form', { novalidate: true, style: 'display:grid;gap:16px', on: { submit: (e) => { e.preventDefault(); submit(d); } } },
        errBox, typeof content === 'function' ? content(d) : content, h('button', { type: 'submit', hidden: true }));
      d.form = form;
      return form;
    },
    foot: (d) => [
      extraFoot ? extraFoot(d) : null,
      h('button.btn.ghost', { type: 'button', on: { click: () => d.close() } }, 'Annulla'),
      submitBtn = h(`button.btn${danger ? '.danger.solid' : '.accent'}`, { type: 'button', on: { click: () => submit(d) } }, submitLabel),
    ],
  });
  async function submit(d) {
    clear(errBox);
    let op;
    try { op = build(d); } catch (msg) { showErr(String(msg.message || msg)); return; }
    if (!op) return;
    setBusy(submitBtn, true);
    try {
      const result = await App.store.dispatch({ ...op, opId });
      burst(submitBtn, { count: 46, hue: burstHue(op.type) });
      toast(result?.message || 'Salvato', { art: artFor(op) });
      d.close();
      after?.(result);
    } catch (e) {
      if (e.code === 'validation' || e.code === 'forbidden') showErr(e.message);
      else if (e.code === 'network') showErr(e.message + ' Puoi premere di nuovo: l\'operazione non verrà duplicata.');
      else { d.close(); reportError(e); }
    } finally {
      setBusy(submitBtn, false);
    }
  }
  function showErr(msg) {
    fill(errBox, h('div.form-error', icon('alert', 18), h('span', msg)));
  }
}

function suggestionsFor(key) {
  const s = S();
  return [...s.lots.map((l) => l[key]), ...s.plans.map((p) => p[key])];
}

/** Campi del piano di arrivo con anteprima della ripartizione. */
function planForm(plan) {
  const s = S();
  const tpc = s.settings.tonsPerContainer;
  const containers = input({ id: 'pf-c', inputmode: 'numeric', value: plan ? String(plan.containers) : '10' });
  const days = input({ id: 'pf-d', inputmode: 'numeric', value: plan ? String(plan.days) : '5' });
  const start = input({ id: 'pf-s', type: 'date', value: plan ? plan.startDate : App.store.today() });
  const total = input({ id: 'pf-t', inputmode: 'decimal', value: plan ? fmtNum(plan.totalTons) : '' });
  const note = input({ id: 'pf-n', placeholder: 'facoltativa', value: plan?.note || '' });
  let totalTouched = !!plan;
  const preview = h('div', { style: 'display:grid;gap:10px' });
  function values() {
    return { containers: containers.value, days: days.value, startDate: start.value, totalTons: total.value.trim() === '' ? '' : total.value, note: note.value };
  }
  function update() {
    const c = parseNum(containers.value);
    const d = parseNum(days.value);
    if (!totalTouched) total.placeholder = Number.isInteger(c) && c > 0 ? fmtNum(c * tpc) : '';
    clear(preview);
    if (!Number.isInteger(c) || c < 1 || !Number.isInteger(d) || d < 1 || !start.value) return;
    const t = total.value.trim() ? parseNum(total.value) : c * tpc;
    const rows = [];
    let prev = 0;
    for (let i = 1; i <= Math.min(d, 31); i++) { const cum = Math.floor((c * i) / d); rows.push(cum - prev); prev = cum; }
    const max = Math.max(...rows, 1);
    preview.append(
      h('div.form-info', icon('info', 18), h('span',
        `${c} container in ${d} giorni: circa ${fmtNum(round3(c / d))} al giorno · peso medio ${Number.isFinite(t) ? fmtTons(round3(t / c)) : '—'} per container. `,
        `Il primo giorno (${fmtDayShort(start.value)}) non matura nulla; l'ultima stima arriva ${fmtDayShort(addDays(start.value, d))}.`)),
      h('div.schedule-mini', { 'aria-label': 'Container stimati per giorno' },
        rows.map((n, i) => h('div', h('i', { style: { height: `${Math.max(4, (n / max) * 40)}px` } }), `G${i + 1}`, h('span', { style: 'color:var(--ink-2)' }, String(n))))));
  }
  for (const el of [containers, days, start, total]) el.addEventListener('input', update);
  total.addEventListener('input', () => { totalTouched = total.value.trim() !== ''; });
  update();
  const el = h('div', { style: 'display:grid;gap:16px' },
    h('div.row',
      field('Container totali', containers),
      field('Giorni stimati', days),
      field('Primo giorno del piano', start)),
    h('div.row',
      field('Tonnellate totali previste', h('div.big-num', total, h('span.unit', 't')), { id: 'pf-t', hint: `Vuoto = container × ${fmtNum(tpc)} t (parametro modificabile, non è una pesatura).` }),
      field('Nota', note)),
    preview);
  return { el, values };
}

function qtyDialog(lot, kind) {
  const isLoad = kind === 'load';
  const rev = lot.rev;
  const qty = input({ id: 'q-t', inputmode: 'decimal', placeholder: '0', autofocus: true });
  const note = input({ id: 'q-n', placeholder: isLoad ? 'es. camion in entrata' : 'es. camion per cliente' });
  const after = h('b', fmtTons(lot.tons));
  const barNow = h('i', { style: { width: '100%' } });
  const barGhost = h('i.ghost', { style: { width: '0%' } });
  const quick = h('div.quick-qty', (isLoad ? [1, 5, 10, 27] : [1, 5, 10, 25]).filter((v) => isLoad || v < lot.tons).map((v) =>
    h('button', { type: 'button', on: { click: () => { qty.value = fmtNum(v); upd(); qty.focus(); } } }, `${fmtNum(v)} t`)),
  !isLoad && h('button', { type: 'button', on: { click: () => { qty.value = fmtNum(round3(lot.tons / 2)); upd(); } } }, 'Metà'),
  !isLoad && h('button', { type: 'button', on: { click: () => { qty.value = fmtNum(lot.tons); upd(); } } }, `Tutto (${fmtTons(lot.tons)})`));
  let submitBtn;
  function upd() {
    const v = parseNum(qty.value);
    const next = Number.isFinite(v) ? round3(isLoad ? lot.tons + v : lot.tons - v) : lot.tons;
    after.textContent = fmtTons(Math.max(0, next));
    after.style.color = next < -EPS ? 'var(--bad)' : '';
    const scale = Math.max(lot.tons, next, 1);
    if (isLoad) { barNow.style.width = `${(lot.tons / scale) * 100}%`; barGhost.style.width = `${(Math.max(0, next) / scale) * 100}%`; barGhost.style.zIndex = '-1'; }
    else { barNow.style.width = `${(Math.max(0, next) / scale) * 100}%`; barGhost.style.width = `${(lot.tons / scale) * 100}%`; }
    qty.setAttribute('aria-invalid', String(next < -EPS));
    if (submitBtn) submitBtn.textContent = Number.isFinite(v) && v > 0 ? `${isLoad ? 'Carica' : 'Scarica'} ${fmtTons(v)}` : (isLoad ? 'Carica' : 'Scarica');
  }
  const trips = tripsBox();
  qty.addEventListener('input', upd);
  qty.addEventListener('input', () => trips.update(parseNum(qty.value)));
  quick.addEventListener('click', () => trips.update(parseNum(qty.value)));
  const d = formDialog({
    title: isLoad ? 'Carico' : 'Scarico',
    subtitle: isLoad ? 'Aggiunge quantità a questo lotto.' : 'Toglie quantità da questo lotto. Non può superare il disponibile.',
    content: h('div', { style: 'display:grid;gap:16px' },
      lotHeader(lot),
      field(isLoad ? 'Quantità da caricare' : 'Quantità da scaricare', h('div.big-num', qty, h('span.unit', 't')), { id: 'q-t' }),
      quick,
      h('div.preview-bar',
        h('div.pb-row', h('span', 'Ora'), h('b', fmtTons(lot.tons))),
        h('div.pb-track', { style: 'isolation:isolate' }, barGhost, barNow),
        h('div.pb-row', h('span', 'Dopo'), after)),
      trips.el,
      field('Nota (facoltativa)', note)),
    submitLabel: isLoad ? 'Carica' : 'Scarica',
    build: () => ({ type: isLoad ? 'lot.load' : 'lot.unload', lotId: lot.id, expectRev: rev, tons: qty.value, note: note.value }),
  });
  submitBtn = d.el.querySelector('.dialog-foot .btn.accent');
  upd();
}

function receiveDialog(plan, { suggested } = {}) {
  const rev = plan.rev;
  const remC = planRemainingContainers(plan);
  const remT = planResidual(plan);
  const avg = round3(remT / remC);
  let n = Math.min(remC, suggested || 1);
  const count = input({ id: 'rc-c', inputmode: 'numeric', value: String(n) });
  const tons = input({ id: 'rc-t', inputmode: 'decimal' });
  let touched = false;
  const sum = h('div.preview-bar');
  function auto() {
    const c = parseNum(count.value);
    if (!touched && Number.isInteger(c) && c > 0) tons.value = fmtNum(c >= remC ? remT : round3(avg * c));
    const t = parseNum(tons.value);
    fill(sum, 
      h('div.pb-row', h('span', 'Residuo ora'), h('b', `${remC} container · ${fmtTons(remT)}`)),
      h('div.pb-row', h('span', 'Dopo la ricezione'), h('b', Number.isInteger(c) && Number.isFinite(t) ? `${Math.max(0, remC - c)} container · ${fmtTons(Math.max(0, round3(remT - t)))}` : '—')));
  }
  const step = (dlt) => { const c = Math.min(remC, Math.max(1, (parseNum(count.value) || 0) + dlt)); count.value = String(c); auto(); };
  count.addEventListener('input', auto);
  tons.addEventListener('input', () => { touched = true; auto(); });
  auto();
  formDialog({
    title: 'Ricevi oggi',
    subtitle: `${plan.material} · ${plan.lotCode} → ${getLocation(plan.locationId).name}`,
    content: h('div', { style: 'display:grid;gap:16px' },
      field('Container arrivati', h('div.stepper',
        h('button.btn', { type: 'button', 'aria-label': 'Un container in meno', on: { click: () => step(-1) } }, '−'),
        count,
        h('button.btn', { type: 'button', 'aria-label': 'Un container in più', on: { click: () => step(1) } }, '+')), { id: 'rc-c' }),
      field('Tonnellate complessive', h('div.big-num', tons, h('span.unit', 't')), { id: 'rc-t', hint: `Proposte con il peso medio residuo (${fmtTons(avg)}/container). Gli ultimi container chiudono il residuo.` }),
      sum),
    submitLabel: 'Registra ricezione',
    build: () => ({ type: 'plan.receive', planId: plan.id, expectRev: rev, containers: count.value, tons: tons.value }),
  });
}

function pauseDialog(plan, button) {
  if (!plan.paused) return act({ type: 'plan.pause', planId: plan.id, expectRev: plan.rev, paused: true }, { button });
  const days = Math.max(0, daysBetween(plan.pausedAt || App.store.today(), App.store.today()));
  if (days === 0) return act({ type: 'plan.pause', planId: plan.id, expectRev: plan.rev, paused: false }, { button });
  openDialog({
    title: 'Riprendere l\'automatico',
    subtitle: `Il piano è in pausa da ${days} ${days === 1 ? 'giorno' : 'giorni'}.`,
    body: h('div', { style: 'display:grid;gap:12px' },
      h('p', { style: 'color:var(--ink-2)' }, 'Scegli come riprendere. La prima opzione segue la formula originale; la seconda è un\'aggiunta di questa versione.')),
    foot: (d) => [
      h('button.btn', { type: 'button', on: { click: () => { d.close(); act({ type: 'plan.pause', planId: plan.id, expectRev: plan.rev, paused: false }, { button }); } } },
        'Riprendi e recupera'),
      h('button.btn.accent', { type: 'button', on: { click: () => { d.close(); act({ type: 'plan.pause', planId: plan.id, expectRev: plan.rev, paused: false, shiftSchedule: true }, { button }); } } },
        `Sposta il calendario di ${days} g`),
    ],
  });
}

  const reason = input({ id: 'cp-r', placeholder: 'es. il cliente ha ridotto l\'ordine' });

  });
}

async function deleteNote(note, button) {
  if (!canDeleteNote(App.store.user, note)) {

  const ok = await confirmDialog({ title: 'Eliminare l\'appunto?', message: `“${note.title}” verrà tolto. L'operazione resta nel registro modifiche.`, confirmLabel: 'Elimina', danger: true });

async function setOrderStatus(order, status, button) {

function renderSearch(s) {
  const totals = presentLots(s).reduce((a, l) => a + l.tons, 0);
  const incoming = openPlans(s).reduce((a, p) => a + planResidual(p), 0);
  const occupied = new Set(presentLots(s).map((l) => l.locationId)).size;
  const openNotes = s.notes.filter((n) => n.status !== 'Risolto').length;

  const inp = h('input', { id: 'q', type: 'search', inputmode: 'text', enterkeyhint: 'go', autocomplete: 'off', spellcheck: 'false',
    'aria-label': 'Numero o nome della posizione', role: 'combobox', 'aria-expanded': 'false', 'aria-controls': 'q-list', 'aria-autocomplete': 'list',
    value: ui.q, placeholder: 'es. 18' });
  const list = h('div.suggest', { id: 'q-list', role: 'listbox', hidden: true });
  const errBox = h('div', { role: 'alert' });
  let active = -1;
  let opts = [];

  function go(loc) {
    ui.q = '';
    ui.searchError = null;
    App.navigate(`pos-${loc.id}`);
  }
  function submit() {
    if (active >= 0 && opts[active]) return go(opts[active]);
    const r = findLocation(inp.value);
    if (r.location) return go(r.location);
    ui.searchError = r;
    showError();
    const box = inp.closest('.search-field');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  }
  function showError() {
    clear(errBox);
    const r = ui.searchError;
    if (!r) return;
    errBox.append(h('div.search-error', icon('alert', 20), h('div',
      h('b', r.error), r.hint ? h('span', r.hint, ' ') : null,
      r.suggestion ? h('button.link-btn', { type: 'button', on: { click: () => go(r.suggestion) } }, `Apri ${r.suggestion.name}`) : null)));
  }
  function renderList() {
    const q = inp.value.trim();
    opts = q ? suggestLocations(q, 6) : [];
    clear(list);
    opts.forEach((l, i) => {
      const st = positionStats(s, l.id);
      list.append(h('div', { role: 'option', id: `q-opt-${i}`, 'aria-selected': String(i === active), on: { pointerdown: (e) => { e.preventDefault(); go(l); } } },
        h('span.s-code', l.code === 'T' ? 'T' : l.code), h('span', h('b', l.name), h('span.muted', ` · ${KIND_LABEL[l.kind]}`)),
        h('span.s-meta', st.present ? fmtTons(st.present) : 'vuota')));
    });
    list.hidden = !opts.length;
    inp.setAttribute('aria-expanded', String(!list.hidden));
    inp.setAttribute('aria-activedescendant', active >= 0 ? `q-opt-${active}` : '');
    highlightYard(opts.map((o) => o.id), q);
  }
  inp.addEventListener('input', () => { ui.q = inp.value; active = -1; ui.searchError = null; showError(); renderList(); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && opts.length) { e.preventDefault(); active = Math.min(opts.length - 1, active + 1); renderList(); }
    else if (e.key === 'ArrowUp' && opts.length) { e.preventDefault(); active = Math.max(-1, active - 1); renderList(); }
    else if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Escape') { list.hidden = true; }
  });
  inp.addEventListener('blur', () => setTimeout(() => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); }, 150));
  inp.addEventListener('focus', () => { if (inp.value) renderList(); });

  // Esempi che si alternano nel campo vuoto.
  clearInterval(ui.typeTimer);
  const examples = ['18', 'A', 'Tettoia', '49', '7', 'L'];
  let ei = 0;
  if (!reducedMotion()) ui.typeTimer = setInterval(() => { if (!inp.isConnected) return clearInterval(ui.typeTimer); inp.placeholder = `es. ${examples[++ei % examples.length]}`; }, 2200);

  const yard = renderYard(s);
  function highlightYard(ids, q) {
    yard.classList.toggle('filtering', !!q && ids.length > 0);
    for (const t of yard.querySelectorAll('.tile')) t.classList.toggle('match', ids.includes(t.dataset.id));
  }
  queueMicrotask(() => { if (ui.q) renderList(); showError(); });

  const plans = openPlans(s);
  return h('div',
    h('section.search-hero',
      h('div.eyebrow', icon('search', 14), 'Ricerca posizione'),
      h('h1.page-title', 'Che cosa c\'è in ', h('em', 'baia?')),
      h('p.page-sub', 'Scrivi il numero, la lettera o il nome: 18 apre il Mucchio 18, A la Baia A, Tettoia il deposito.'),
      h('div.search-box',
        h('form', { role: 'search', on: { submit: (e) => { e.preventDefault(); submit(); } } },
          h('div.search-field', icon('search', 28), inp,
            h('button.btn-forge', { type: 'submit', 'aria-label': 'Apri posizione' }, h('span.lbl', 'Apri'), icon('arrowL', 20, 'style="transform:rotate(180deg)"')))),
        list),
      errBox,
      h('div.quick', h('span.quick-label', 'Più usate'),
        frequentLocations(s, 8).map((l) => {
          const st = positionStats(s, l.id);
          return h('button', { type: 'button', on: { click: () => go(l) } }, l.name, h('span.q-t', st.present ? fmtTons(st.present) : 'vuota'));
        }))),
    h('div.kpis',
      h('div.kpi', h('div.kpi-label', 'In giacenza'), h('div.kpi-value', tonsEl(totals, 'k:tot'), h('small', 't'))),
      h('div.kpi', h('div.kpi-label', 'In arrivo'), h('div.kpi-value', tonsEl(incoming, 'k:inc'), h('small', 't'))),
      h('div.kpi', h('div.kpi-label', 'Posizioni occupate'), h('div.kpi-value', String(occupied), h('small', `/ ${LOCATIONS.length}`))),
      h('div.kpi', h('div.kpi-label', 'Appunti aperti'), h('div.kpi-value', String(openNotes)))),
    yardLive(s),
    plans.length ? h('section.section',
      h('div.section-head', h('h2.section-title', icon('truck', 18), 'Arrivi in corso', h('span.count', String(plans.length)))),
      h('div.arrivals-strip.stagger', plans.map((p, i) => miniPlan(s, p, i)))) : null,
    h('section.section', yard));
}

/** Piazzale animato: i mezzi si muovono secondo il loro stato (aggiunta di questa versione). */

function renderYard(s) {
  const groups = [
    ['Baie 1–20', LOCATIONS.filter((l) => l.group === 'Baie 1–20'), ''],
    ['Mucchi 18 · 21–60', LOCATIONS.filter((l) => l.kind === 'mucchio'), 'mucchi'],
    ['Baie A–L · Tettoia', LOCATIONS.filter((l) => l.group === 'Baie A–L' || l.kind === 'deposito'), ''],
  ];
  const maxHeap = Math.max(1, ...LOCATIONS.filter((l) => l.kind !== 'baia').map((l) => positionStats(s, l.id).final));
  const noteLocs = new Set(s.notes.filter((n) => n.status !== 'Risolto' && n.locationId).map((n) => n.locationId));
  return h('div.card.yard',
    h('div.yard-head',
      h('div', h('h2.section-title', icon('map', 18), 'Piazzale'), h('div', { style: 'font-size:13px;color:var(--ink-3);margin-top:4px' }, 'Tocca una posizione per aprirla.')),
      h('div.yard-legend', h('span', h('i.lg.fill'), 'Presente'), h('span', h('i.lg.inc'), 'In arrivo'), h('span', h('i.lg.note'), 'Appunto aperto'))),
    h('div.yard-groups', groups.map(([title, locs, cls]) => h('div',
      h('div.yard-group-title', title),
      h(`div.yard-row${cls ? '.' + cls : ''}`, locs.map((l) => {
        const st = positionStats(s, l.id);
        const scale = st.capacity || maxHeap;
        const fillPct = Math.min(100, (st.present / scale) * 100);
        const incPct = Math.min(100 - fillPct, (st.incoming / scale) * 100);
        return h(`button.tile.${l.kind}${st.over ? '.over' : ''}${fillPct > 55 ? '.full' : ''}`, {
          type: 'button', dataset: { id: l.id },
          title: `${l.name}: ${st.present ? fmtTons(st.present) : 'vuota'}${st.incoming ? ` · in arrivo ${fmtTons(st.incoming)}` : ''}`,
          'aria-label': `${l.name}, ${st.present ? fmtTons(st.present) : 'vuota'}${st.incoming ? `, in arrivo ${fmtTons(st.incoming)}` : ''}${noteLocs.has(l.id) ? ', appunto aperto' : ''}`,
          on: { click: () => App.navigate(`pos-${l.id}`) },
        },
        h('span.t-fill', { style: { height: `${fillPct}%` } }),
        incPct ? h('span.t-inc', { style: { bottom: `${fillPct}%`, height: `${Math.max(6, incPct)}%` } }) : null,
        noteLocs.has(l.id) ? h('span.t-note') : null,
        h('span.t-label', l.kind === 'deposito' ? 'TETTOIA' : l.code));
      }))))),
    h('div.yard-note', icon('info', 14), 'Schema dimostrativo: raggruppa le posizioni ma non rappresenta la disposizione reale del piazzale. Baie in proporzione alla capienza provvisoria; mucchi e Tettoia in proporzione al più pieno.'));
}

const pct = (v, cap) => `${fmtNum(Math.round((v / cap) * 1000) / 10)}%`;

function occupancy(st, locId) {
  const cap = st.capacity;
  const scale = Math.max(cap || 0, st.final, 1);
  const pPct = (st.present / scale) * 100;
  const iPct = (st.incoming / scale) * 100;
  const present = h('div.occ-present', { style: { width: `${previousWidth(`p${locId}`, pPct)}%` } });
  const incoming = h('div.occ-incoming', { style: { left: `${previousWidth(`l${locId}`, pPct)}%`, width: `${previousWidth(`i${locId}`, iPct)}%`, display: st.incoming ? '' : 'none' } });
  const liftAt = (v) => `${Math.max(4, Math.min(93, v))}%`;
  const lift = h('div.occ-lift', { style: { left: liftAt(previousWidth(`f${locId}`, pPct)) } });
  lift.innerHTML = forkliftSvg({ load: true });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    present.style.width = `${pPct}%`;
    incoming.style.left = `${pPct}%`;
    incoming.style.width = `${iPct}%`;
    if (lift.style.left !== liftAt(pPct)) {
      const bar = lift.parentElement;
      bar?.classList.add('moving');
      lift.style.left = liftAt(pPct);
      setTimeout(() => bar?.classList.remove('moving'), 950);
    }
  }));
  return h('section.card.occupancy', { 'aria-label': 'Occupazione' },
    h('div.occ-top',
      h('span', 'Occupazione · ', h('b', fmtTons(st.present)), cap ? ` (${pct(st.present, cap)})` : ''),
      h('span', 'A fine arrivi · ', h('b', fmtTons(st.final)), cap ? ` (${pct(st.final, cap)})` : '')),
    h(`div.occ-bar${st.over ? '.over' : ''}`, { role: 'img', 'aria-label': `Presente ${fmtTons(st.present)}, in arrivo ${fmtTons(st.incoming)}${cap ? `, capienza ${fmtTons(cap)}` : ''}` },
      present, incoming, lift,
      cap ? h('div.occ-cap', { style: { left: `calc(${(cap / scale) * 100}% - 1px)` }, 'data-label': 'capienza' }) : null),
    h('div.occ-scale', h('span', '0 t'), h('span', cap ? fmtTons(scale) : `${fmtTons(scale)} (nessuna capienza)`)),
    st.over ? h('div.occ-warn', icon('alert', 18), st.overNow ? `Già oltre la capienza provvisoria di ${fmtTons(round3(st.present - cap))}.` : `A fine arrivi supererà la capienza provvisoria di ${fmtTons(round3(st.final - cap))}.`) : null);
}

function planCard(s, p, today, i) {
  const sched = planSchedule(p, today);
  const elapsed = daysBetween(p.startDate, today);
  const receipts = s.receipts.filter((r) => r.planId === p.id);
  const boxes = [];
  for (const r of receipts) for (let k = 0; k < r.containers; k++) boxes.push(r.mode === 'stima' && !r.confirmedAt ? 'est' : 'recv');
  const prevSeen = seenBoxes.has(p.id) ? seenBoxes.get(p.id) : boxes.length;
  seenBoxes.set(p.id, boxes.length);
  const unconfirmed = planEstimatedUnconfirmed(s, p.id);
  const unconfirmedC = unconfirmed.reduce((a, r) => a + r.containers, 0);
  const avg = planRemainingContainers(p) ? round3(planResidual(p) / planRemainingContainers(p)) : 0;
  const confirmMode = s.settings.arrivalMode === 'conferma';
  const expected = autoTarget(p, today);
  const behind = confirmMode && !p.paused ? Math.max(0, expected - p.receivedContainers) : 0;
  const next = sched.find((d) => d.day > Math.max(0, elapsed) && d.inc > 0);

  let idx = 0;
  const track = h('div.track', { role: 'img', 'aria-label': `${p.receivedContainers} container su ${p.containers} ricevuti o stimati` },
    sched.map((d) => {
      const col = [];
      for (let k = 0; k < d.inc; k++, idx++) {
        const kind = boxes[idx];
        col.push(h(`span.cbox${kind ? '.' + kind : ''}${kind && idx >= prevSeen ? '.pop' : ''}`, { style: kind && idx >= prevSeen ? `animation-delay:${(idx - prevSeen) * 90}ms` : '' }));
      }
      const truck = d.state === 'today' && !p.paused ? h('span.today-truck', { 'aria-hidden': 'true' }) : null;
      if (truck) truck.innerHTML = truckSvg();
      return h(`div.track-day${d.state === 'today' ? '.today' : ''}`, truck, h('div.track-boxes', col),
        h('div.track-label', `G${d.day}`, h('br'), fmtDayMonth(d.date)));
    }));

  const statusChip = p.paused ? h('span.chip.warn', icon('pause', 12), 'Automatico in pausa')
    : confirmMode ? h('span.chip.info', 'Solo conferma manuale')
    : h('span.chip.ok', icon('bolt', 12), 'Stima automatica attiva');

  return h(`article.card.plan${p.paused ? '.paused' : ''}`, { '--i': i },
    h('div.plan-top',
      h('div', { style: 'min-width:0' },
        h('div.eyebrow', 'Lotto su più giorni'),
        h('div.plan-title', { style: 'margin-top:4px' }, p.material),
        h('div.plan-sub', h('span.code', p.lotCode), p.client, h('span.muted', `· dal ${fmtDayShort(p.startDate)} · ${p.containers} container in ${p.days} giorni`))),
      statusChip),
    h('div.plan-nums',
      h('div.plan-num', h('span', 'Ricevuto'), h('b', tonsEl(p.receivedTons, `pr:${p.id}`), ' t'), h('em', `${p.receivedContainers} container`)),
      h('div.plan-num', h('span', 'Residuo'), h('b', tonsEl(planResidual(p), `pres:${p.id}`), ' t'), h('em', `${planRemainingContainers(p)} container · ~${fmtTons(avg)} cad.`)),
      h('div.plan-num', h('span', 'Totale'), h('b', fmtNum(p.totalTons), ' t'), h('em', `${p.containers} container`))),
    track,
    h('div.plan-legend',
      h('span', h('i.cbox.recv'), 'Ricevuto'),
      h('span', h('i.cbox.est'), 'Stimato (non confermato)'),
      h('span', h('i.cbox'), 'Previsto'),
      next && !p.paused ? h('span', icon('clock', 13), `Prossima stima ${fmtDayShort(next.date)}: +${next.inc} container`) : null),
    unconfirmedC ? h('div.estimate-note', icon('alert', 18),
      h('span', `${unconfirmedC} container (${fmtTons(round3(unconfirmed.reduce((a, r) => a + r.tons, 0)))}) sono stime automatiche del piano: incrementano la giacenza ma non provano una consegna.`),
      h('button.btn.sm', { type: 'button', on: { click: (e) => act({ type: 'plan.confirmEstimates', planId: p.id, expectRev: p.rev }, { button: e.currentTarget }) } }, 'Conferma arrivati')) : null,
    behind ? h('div.estimate-note', icon('info', 18), h('span', `Ad oggi il piano prevede ${expected} container: ne mancano ${behind} da confermare.`),
      h('button.btn.sm', { type: 'button', on: { click: () => receiveDialog(p, { suggested: behind }) } }, `Conferma ${behind}`)) : null,
    h('div.plan-actions',
      h('button.btn.accent', { type: 'button', on: { click: () => receiveDialog(p) } }, icon('container', 18), 'Ricevi oggi'),
      h('button.btn', { type: 'button', on: { click: (e) => receiveAllDialog(p, e.currentTarget) } }, icon('check', 18), 'Ricevi tutto oggi'),
      h('button.btn', { type: 'button', on: { click: (e) => pauseDialog(p, e.currentTarget) } }, icon(p.paused ? 'play' : 'pause', 18), p.paused ? 'Riprendi' : 'Pausa'),
      h('button.btn', { type: 'button', on: { click: () => editPlanDialog(p) } }, icon('edit', 18), 'Modifica piano'),
      h('button.btn.danger', { type: 'button', on: { click: () => cancelPlanDialog(p) } }, icon('x', 18), p.receivedContainers ? 'Annulla arrivo' : 'Elimina')));
}

function movementRow(s, m, perspectiveLoc) {
  const t = MOVEMENT_TYPES[m.type] || { label: m.type };
  const loc = getLocation(m.locationId);
  const to = m.toLocationId ? getLocation(m.toLocationId) : null;
  let sign = perspectiveLoc ? movementSignFor(m, perspectiveLoc) : (m.type === 'trasferimento' || m.type === 'annullo_arrivo') ? 0 : movementSignFor(m, m.locationId);
  const cls = m.type === 'stima' ? 'est' : sign > 0 ? 'in' : sign < 0 ? 'out' : 'neutral';
  const ic = { creazione: 'plus', carico: 'arrowDown', scarico: 'arrowUp', scarica_tutto: 'arrowUp', ricezione: 'container', stima: 'bolt',
    rettifica: 'edit', trasferimento: 'transfer', eliminazione: 'trash', annullo_arrivo: 'x', aggiornamento: 'upload' }[m.type] || 'moves';
  return h(`div.mv${m.type === 'stima' ? '.est' : ''}`,
    h(`div.mv-icon.${cls}`, icon(ic, 20)),
    h('div', { style: 'min-width:0' },
      h('div.mv-title', t.label, m.lotCode ? h('span.code', m.lotCode) : null,
        loc ? h('button.link-btn', { type: 'button', on: { click: () => App.navigate(`pos-${loc.id}`) } }, loc.name) : null,
        to ? h('span.muted', '→') : null,
        to ? h('button.link-btn', { type: 'button', on: { click: () => App.navigate(`pos-${to.id}`) } }, to.name) : null),
      h('div.mv-sub', [m.material, m.byName, fmtTime(m.at), m.containers ? `${m.containers} container` : null, m.note].filter(Boolean).join(' · '))),
    h(`div.mv-qty.${sign > 0 ? 'in' : sign < 0 ? 'out' : ''}`, m.tons != null ? `${sign > 0 ? '+' : sign < 0 ? '−' : ''}${fmtTons(m.tons)}` : '',
      m.type === 'annullo_arrivo' ? h('small', 'previsto tolto') : m.type === 'stima' ? h('small', 'stima') : null));
}

function renderMovements(s) {
  const types = [['tutti', 'Tutti'], ['entrate', 'Entrate'], ['uscite', 'Uscite'], ['stima', 'Stime automatiche'], ['altro', 'Rettifiche e spostamenti']];
  const q = ui.mvQuery.trim().toLowerCase();
  let list = s.movements.slice().reverse().filter((m) => {
    const sign = movementSignFor(m, m.locationId);
    if (ui.mvType === 'entrate' && !(sign > 0 && m.type !== 'stima')) return false;
    if (ui.mvType === 'uscite' && !(sign < 0)) return false;
    if (ui.mvType === 'stima' && m.type !== 'stima') return false;
    if (ui.mvType === 'altro' && !['rettifica', 'trasferimento', 'aggiornamento', 'annullo_arrivo'].includes(m.type)) return false;
    if (q) {
      const hay = [m.lotCode, m.material, m.client, m.byName, m.note, getLocation(m.locationId)?.name, getLocation(m.toLocationId)?.name].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const total = list.length;
  list = list.slice(0, 250);
  const byDay = new Map();
  for (const m of list) {
    const d = romeDate(m.at);
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(m);
  }
  const search = h('input.input', { id: 'mv-q', type: 'search', placeholder: 'Cerca lotto, materiale, persona, posizione…', value: ui.mvQuery,
    on: { input: (e) => { ui.mvQuery = e.target.value; App.render({ keepFocus: true }); } } });
  return h('div',
    pageHead('Registro quantità', 'Movimenti', 'Ogni carico, scarico, ricezione e stima, con autore, data e nota. Le stime automatiche sono evidenziate a righe.'),
    h('div.toolbar',
      h('div.search-input', icon('search', 18), search),
      h('div.seg', { role: 'group', 'aria-label': 'Tipo di movimento' }, types.map(([k, l]) =>
        h('button', { type: 'button', 'aria-pressed': String(ui.mvType === k), on: { click: () => { ui.mvType = k; App.render(); } } }, l)))),
    total > 250 ? h('p.muted', { style: 'font-size:13px' }, `Mostro i 250 più recenti su ${total}.`) : null,
    list.length ? [...byDay.entries()].map(([d, ms]) => h('section.day-group',
      h('div.day-head', h('h3', fmtDayLong(d)), h('span', `${ms.length} movimenti`)),
      h('div.feed', ms.map((m) => movementRow(s, m)))))
      : h('div.empty', icon('moves', 40), h('h3', 'Nessun movimento'), h('p', 'Cambia i filtri o registra un carico da una posizione.')));
}

function renderOrders(s) {
  const today = App.store.today();
  const filters = [['aperti', 'Da fare'], ['completati', 'Completati'], ['annullati', 'Annullati'], ['tutti', 'Tutti']];
  const open = (o) => o.status === 'Da fare' || o.status === 'Programmato';
  let list = s.orders.filter((o) => ui.ordersFilter === 'tutti' || (ui.ordersFilter === 'aperti' ? open(o) : ui.ordersFilter === 'completati' ? o.status === 'Completato' : o.status === 'Annullato'));
  list.sort((a, b) => (open(b) - open(a)) || (open(a) ? (a.date + a.time).localeCompare(b.date + b.time) : (b.date + b.time).localeCompare(a.date + a.time)));
  const groups = new Map();
  for (const o of list) {
    let g;
    if (!open(o)) g = o.status === 'Completato' ? 'Completati' : 'Annullati';
    else if (o.date < today) g = 'In ritardo';
    else if (o.date === today) g = 'Oggi';
    else if (o.date === addDays(today, 1)) g = 'Domani';
    else g = 'Prossimi';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(o);
  }
  const counts = { aperti: s.orders.filter(open).length };
  return h('div',
    pageHead('Lavoro da fare', 'Ordini di lavoro', 'Completare un ordine non scarica materiale: lo scarico si registra sul lotto, così non ci sono movimenti doppi.',
      h('button.btn-forge', { type: 'button', on: { click: () => orderDialog(null) } }, icon('plus', 20), 'Nuovo ordine')),
    h('div.toolbar', h('div.seg', { role: 'group', 'aria-label': 'Filtro ordini' }, filters.map(([k, l]) =>
      h('button', { type: 'button', 'aria-pressed': String(ui.ordersFilter === k), on: { click: () => { ui.ordersFilter = k; App.render(); } } }, l, k === 'aperti' && counts.aperti ? ` · ${counts.aperti}` : '')))),
    list.length ? [...groups.entries()].map(([g, os]) => h('section.day-group',
      h('div.day-head', h('h3', { style: g === 'In ritardo' ? 'color:var(--bad)' : '' }, g), h('span', `${os.length}`)),
      h('div.grid.stagger', os.map((o, i) => orderCard(o, today, i)))))
      : h('div.empty', icon('orders', 40), h('h3', ui.ordersFilter === 'aperti' ? 'Nessun ordine da fare' : 'Nessun ordine'), h('button.btn.accent', { type: 'button', on: { click: () => orderDialog(null) } }, icon('plus', 18), 'Nuovo ordine')));
}

    body);
}

function auditDetail(a) {
  const pick = (o) => o ? (o.lotCode || o.title || o.name || '') : '';
  const name = pick(a.after) || pick(a.before);
  if (a.before && a.after) {
    const changes = Object.keys(a.after).filter((k) => a.before[k] !== a.after[k] && !['updatedAt'].includes(k)).slice(0, 4)
      .map((k) => `${k}: ${a.before[k] ?? '—'} → ${a.after[k] ?? '—'}`);
    return [name, changes.join(' · ')].filter(Boolean).join(' — ');
  }
  return name;
}

const monthFmt = new Intl.DateTimeFormat('it-IT', { month: 'long', year: 'numeric', timeZone: 'UTC' });

function renderCalendar(s) {
  const today = App.store.today();
  ui.calMonth ||= today.slice(0, 7);
  ui.calSel ||= today;
  const [y, m] = ui.calMonth.split('-').map(Number);
  const first = `${ui.calMonth}-01`;
  const dow = (new Date(`${first}T00:00:00Z`).getUTCDay() + 6) % 7;
  const start = addDays(first, -dow);
  const days = Array.from({ length: 42 }, (_, i) => addDays(start, i));
  const evBy = new Map();
  const add = (d, item) => { if (!evBy.has(d)) evBy.set(d, []); evBy.get(d).push(item); };
  for (const e of s.events) add(e.date, { kind: e.kind, title: e.title, time: e.time, ev: e });
  for (const o of s.orders) if (o.status !== 'Annullato') add(o.date, { kind: 'ordine', title: o.title, time: o.time, order: o });
  for (const p of openPlans(s)) for (const r of planSchedule(p, today)) if (r.inc > 0 && r.date >= today) add(r.date, { kind: 'arrivo', title: `${getLocation(p.locationId).name}: +${r.inc} container`, time: '', plan: p });
  const sortItems = (a, b) => (a.time || '99').localeCompare(b.time || '99');
  const shift = (n) => {
    const d = new Date(Date.UTC(y, m - 1 + n, 1));
    ui.calMonth = d.toISOString().slice(0, 7);
    App.render();
  };
  const selItems = (evBy.get(ui.calSel) || []).sort(sortItems);
  return h('div',
    pageHead('Pianificazione', 'Calendario', 'Eventi, ordini e arrivi previsti per giorno.',
      h('button.btn-forge', { type: 'button', on: { click: () => eventDialog(null, { date: ui.calSel }) } }, icon('plus', 20), 'Nuovo evento')),
    h('div.cal-head',
      h('button.icon-btn', { type: 'button', 'aria-label': 'Mese precedente', on: { click: () => shift(-1) } }, icon('chevL')),
      h('h2.cal-month', monthFmt.format(new Date(`${first}T00:00:00Z`))),
      h('button.icon-btn', { type: 'button', 'aria-label': 'Mese successivo', on: { click: () => shift(1) } }, icon('chevR')),
      h('button.btn.sm', { type: 'button', on: { click: () => { ui.calMonth = today.slice(0, 7); ui.calSel = today; App.render(); } } }, 'Oggi')),
    h('div.cal-layout',
      h('div.card.cal',
        h('div.cal-dow', ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].map((d) => h('div', d))),
        h('div.cal-grid', days.map((d) => {
          const items = (evBy.get(d) || []).sort(sortItems);
          return h(`button.cal-day${d.slice(0, 7) !== ui.calMonth ? '.other' : ''}${d === today ? '.today' : ''}${d === ui.calSel ? '.sel' : ''}`, {
            type: 'button', 'aria-label': `${fmtDayLong(d)}${items.length ? `, ${items.length} elementi` : ''}`, 'aria-pressed': String(d === ui.calSel),
            on: { click: () => { ui.calSel = d; App.render(); }, dblclick: () => eventDialog(null, { date: d }) } },
          h('span.cal-num', String(Number(d.slice(8)))),
          items.slice(0, 3).map((it) => h(`span.cal-ev.k-${it.kind === 'arrivo' ? 'Carico' : it.kind}`, it.time ? `${it.time} ${it.title}` : it.title)),
          items.length > 3 ? h('span.muted', { style: 'font-size:11px' }, `+${items.length - 3}`) : null,
          items.length ? h('span.cal-dots', items.slice(0, 4).map(() => h('i'))) : null);
        }))),
      h('aside.card.cal-side',
        h('h3', fmtDayLong(ui.calSel)),
        h('div', { style: 'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap' },
          h('button.btn.sm', { type: 'button', on: { click: () => eventDialog(null, { date: ui.calSel }) } }, icon('plus', 16), 'Evento'),
          h('button.btn.sm', { type: 'button', on: { click: () => orderDialog(null, { date: ui.calSel }) } }, icon('plus', 16), 'Ordine')),
        selItems.length ? h('div.agenda', selItems.map((it) => h('div.agenda-item',
          h('span.agenda-time', it.time || '—'),
          h('div', { style: 'min-width:0' }, h('b', { style: 'display:block;overflow-wrap:anywhere' }, it.title),
            h('span.muted', { style: 'font-size:12.5px' }, it.kind === 'ordine' ? `Ordine · ${it.order.status}` : it.kind === 'arrivo' ? 'Arrivo previsto dal piano' : it.kind)),
          it.ev ? h('button.icon-btn', { type: 'button', 'aria-label': `Modifica ${it.title}`, on: { click: () => eventDialog(it.ev) } }, icon('edit', 18))
            : it.order ? h('button.icon-btn', { type: 'button', 'aria-label': `Modifica ${it.title}`, on: { click: () => orderDialog(it.order) } }, icon('edit', 18))
              : h('button.icon-btn', { type: 'button', 'aria-label': 'Apri posizione', on: { click: () => App.navigate(`pos-${it.plan.locationId}`) } }, icon('chevR', 18)))))
          : h('p.muted', { style: 'margin-top:14px' }, 'Nessun evento in questa giornata.'))));
}

function download(text, name) {
  try {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name });
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    if (App.store.mode === 'demo') toast('Se il download non parte (anteprima protetta), usa “Mostra e copia”.', { kind: 'warn' });
  } catch {
    showJson(text);
  }
}

  const area = textarea({ id: 'json-out', readonly: true, class: 'mono', style: 'min-height:320px;font-size:12px' });

// ---- app.js ----
// Guscio dell'applicazione: accesso, menu, router, palette comandi, preferenze.







/* Preferenze (solo comodità del singolo dispositivo) ---------------- */

const PREF_KEY = 'magazzino-prefs';
const prefs = {
  theme: 'system',
  motion: 'auto',
  load() {
    try { Object.assign(this, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch { /* niente */ }
    this.apply();
  },
  set(patch) {
    Object.assign(this, patch);
    try { localStorage.setItem(PREF_KEY, JSON.stringify({ theme: this.theme, motion: this.motion })); } catch { /* niente */ }
    this.apply();
    render();
  },
  apply() {
    const root = document.documentElement;
    const map = { system: [null, null], forgia: ['dark', null], acciaio: ['light', null], cobalto: ['light', 'cobalto'], sole: ['light', 'sole'] };
    const [theme, palette] = map[this.theme] || map.system;
    // Con "Sistema" non tocchiamo un tema impostato da chi ospita la pagina.
    if (theme) { root.dataset.theme = theme; this.ownsTheme = true; } else if (this.ownsTheme) { delete root.dataset.theme; this.ownsTheme = false; }
    if (palette) root.dataset.palette = palette; else delete root.dataset.palette;
    if (this.motion === 'reduced') root.dataset.motion = 'reduced'; else delete root.dataset.motion;
  },
};

/* Navigazione -------------------------------------------------------- */

const NAV = [
  { id: 'ricerca', label: 'Ricerca', icon: 'search' },
  { id: 'ordini', label: 'Ordini di lavoro', icon: 'orders' },
  { id: 'materiali', label: 'Materiali e lotti', icon: 'layers' },
  { id: 'movimenti', label: 'Movimenti', icon: 'moves' },
  { id: 'appunti', label: 'Appunti', icon: 'note' },
  { id: 'storico', label: 'Storico', icon: 'history' },
  { id: 'calendario', label: 'Calendario', icon: 'calendar' },
  { id: 'impostazioni', label: 'Impostazioni', icon: 'settings' },
];

let route = parseHash();
let root, shell, mainEl, mainInner, sidebarEl, scrimEl, topbarEl, tabbarEl;

function parseHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  if (raw.startsWith('pos-') && getLocation(raw.slice(4))) return raw;
  return NAV.some((n) => n.id === raw) ? raw : 'ricerca';
}

function navigate(to) {
  closeDrawer();
  if (to === route) { mainEl?.scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' }); return; }
  route = to;
  try { history.pushState(null, '', `#${to}`); } catch { location.hash = to; }
  const run = () => { render({ nav: true }); mainEl.scrollTop = 0; };
  if (document.startViewTransition && !reducedMotion()) document.startViewTransition(run);
  else run();
}
App.navigate = navigate;
addEventListener('popstate', () => { route = parseHash(); render({ nav: true }); });
addEventListener('hashchange', () => { const r = parseHash(); if (r !== route) { route = r; render({ nav: true }); } });

/* Rendering ---------------------------------------------------------- */

let pending = false;
function render(opts = {}) {
  const store = App.store;
  if (!store) return;
  if (!store.user || !store.state) { renderLogin(); return; }
  if (!shell || !shell.isConnected) buildShell();

  // Non ridisegnare mentre si scrive in un campo della pagina: aggiorna appena si esce.
  const activeEl = document.activeElement;
  const typing = activeEl && mainEl.contains(activeEl) && activeEl.matches('input, textarea, select');
  if (typing && !opts.keepFocus && !opts.nav) {
    if (!pending) { pending = true; activeEl.addEventListener('blur', () => { pending = false; setTimeout(() => render(), 0); }, { once: true }); }
    updateChrome();
    return;
  }
  const focusId = typing ? activeEl.id : null;
  const sel = typing && activeEl.selectionStart != null ? [activeEl.selectionStart, activeEl.selectionEnd] : null;
  const scroll = mainEl.scrollTop;

  const s = store.state;
  let view;
  try {
    if (route.startsWith('pos-')) view = renderPosition(s, route.slice(4));
    else view = ({
      ricerca: renderSearch, ordini: renderOrders, materiali: renderMaterials, movimenti: renderMovements, appunti: renderNotes,
      storico: renderHistory, calendario: renderCalendar, impostazioni: (st) => renderSettings(st, prefs),
    }[route] || renderSearch)(s);
  } catch (e) {
    console.error(e);
    view = h('div.empty', icon('alert', 40), h('h3', 'Questa pagina non si è caricata'), h('p', String(e.message || e)), h('button.btn', { on: { click: () => navigate('ricerca') } }, 'Torna alla ricerca'));
  }
  fill(mainInner, view);
  if (!opts.nav) mainEl.scrollTop = scroll;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(...sel); } catch { /* niente */ } }
  }
  updateChrome();
}
App.render = render;

function buildShell() {
  root = document.getElementById('app');
  clear(root);
  sidebarEl = h('aside.sidebar', { id: 'sidebar', 'aria-label': 'Menu principale' });
  scrimEl = h('div.scrim', { on: { click: closeDrawer } });
  topbarEl = h('header.topbar');
  mainInner = h('div.main-inner', { style: 'view-transition-name: main-content' });
  mainEl = h('main.main', { id: 'main', tabindex: '-1' }, topbarEl, mainInner);
  tabbarEl = h('nav.tabbar', { 'aria-label': 'Navigazione rapida' });
  shell = h('div.shell.grain', sidebarEl, mainEl, scrimEl, tabbarEl);
  root.append(h('a.sr-only', { href: '#main', on: { focus: (e) => e.target.classList.remove('sr-only'), blur: (e) => e.target.classList.add('sr-only') } }, 'Vai al contenuto'), shell);
}

function counts() {
  const s = App.store.state;
  const today = App.store.today();
  return {
    orders: s.orders.filter((o) => (o.status === 'Da fare' || o.status === 'Programmato') && o.date <= today).length,
    notes: s.notes.filter((n) => n.status !== 'Risolto').length,
  };
}

function statusInfo() {
  const store = App.store;
  const st = store.status;
  if (st.saving) return { cls: 'busy', title: 'Salvataggio…', sub: 'Attendi la conferma' };
  if (!st.online) return { cls: 'bad', title: 'Non connesso', sub: 'Le modifiche NON vengono salvate' };
  if (store.mode === 'demo') return { cls: 'demo', title: 'Demo locale', sub: 'Dati solo in questo browser' };
  return { cls: 'ok', title: 'Online · condiviso', sub: `Aggiornato alle ${fmtTime(st.lastSync)}` };
}

  const store = App.store;
  const user = store.user;
  const c = counts();
  const st = statusInfo();
  const current = route.startsWith('pos-') ? 'ricerca' : route;

      h('span.brand-text', h('span.brand-title', 'MAGAZZINO'), h('span.brand-sub', 'Ferroleghe · MPR Logistics'))),
    h('button.btn-forge', { type: 'button', on: { click: () => { closeDrawer(); addMaterialDialog({ locationId: route.startsWith('pos-') ? route.slice(4) : null }); } } }, icon('plus', 20), 'Aggiungi materiale'),
    h('nav.nav', h('div.nav-label', 'Lavoro'),

        icon(n.icon, 19), n.label,
        n.id === 'ordini' && c.orders ? h('span.badge', { title: 'Ordini aperti per oggi o in ritardo' }, String(c.orders)) : null,
        n.id === 'appunti' && c.notes ? h('span.badge.soft', String(c.notes)) : null))),
    h('div.sidebar-foot',
      h('div.conn', { role: 'status' }, h('span.dot.' + st.cls), h('span', h('b', st.title), st.sub)),
      h('div.profile', h('div.avatar', initials(user.name)),
        h('div.profile-text', h('div.profile-name', user.name), h('div.profile-role', ROLES[user.role] || user.role)),
        h('button.icon-btn', { type: 'button', 'aria-label': 'Cambia tema', title: 'Cambia tema', on: { click: cycleTheme } }, icon(isDark() ? 'sun' : 'moon', 18)),
        h('button.icon-btn', { type: 'button', 'aria-label': 'Esci', title: 'Esci', on: { click: logout } }, icon('logout', 18)))));

  const crumbs = route.startsWith('pos-')
    ? [h('a.crumb-parent', { href: '#ricerca', on: { click: (e) => { e.preventDefault(); navigate('ricerca'); } } }, 'Ricerca'), h('span.crumb-parent', '/'), h('b', getLocation(route.slice(4)).name)]
    : [h('b', NAV.find((n) => n.id === route)?.label || 'Ricerca')];
  const off = store.mode === 'demo' ? store.offsetDays : 0;
  fill(topbarEl, 
    h('button.icon-btn.menu-btn', { type: 'button', 'aria-label': 'Apri menu', 'aria-controls': 'sidebar', 'aria-expanded': String(sidebarEl.classList.contains('open')), on: { click: openDrawer } }, icon('menu', 22)),
    h('div.crumbs', crumbs),
    off ? h('button.clock-chip', { type: 'button', title: 'Data simulata dalla demo', on: { click: () => navigate('impostazioni') } }, icon('clock', 14), `Data demo: ${fmtDayShort(store.today())}`) : null,
    h('span.top-status', { title: `${st.title} · ${st.sub}` }, h('span.dot.' + st.cls), h('span.sr-only', st.title)),
    h('button.kbd-btn', { type: 'button', on: { click: openPalette } }, icon('search', 16), 'Cerca ovunque', h('kbd', '⌘K')),
    store.status.saving ? h('div.save-lane', { 'aria-hidden': 'true' }, vehicle('forklift', { load: true })) : null,
    h('button.icon-btn.top-avatar', { type: 'button', 'aria-label': `Profilo di ${user.name}`, on: { click: (e) => openMenu(e.currentTarget, [
      { label: `${user.name} · ${ROLES[user.role]}`, icon: 'user', run: () => navigate('impostazioni') },
      { label: isDark() ? 'Tema chiaro' : 'Tema scuro', icon: isDark() ? 'sun' : 'moon', run: cycleTheme },
      { label: 'Cerca ovunque', icon: 'search', run: openPalette },
      '-',
      { label: 'Esci', icon: 'logout', run: logout },
    ]) } }, h('span.avatar', initials(user.name))));

  const tab = (id, label, ic, badge) => h('a', { href: `#${id}`, 'aria-current': current === id ? 'page' : null, on: { click: (e) => { e.preventDefault(); navigate(id); } } }, icon(ic, 22), label);
  fill(tabbarEl, 
    tab('ricerca', 'Ricerca', 'search'),
    tab('materiali', 'Materiali', 'layers'),
    h('div.fab-wrap', h('button.fab', { type: 'button', 'aria-label': 'Aggiungi materiale', on: { click: () => addMaterialDialog({ locationId: route.startsWith('pos-') ? route.slice(4) : null }) } }, icon('plus', 28))),
    tab('ordini', c.orders ? `Ordini · ${c.orders}` : 'Ordini', 'orders'),
    tab('appunti', 'Appunti', 'note'));
}

function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function cycleTheme() { prefs.set({ theme: isDark() ? 'acciaio' : 'forgia' }); }

function openDrawer() {
  sidebarEl.classList.add('open');
  scrimEl.classList.add('open');
  sidebarEl.querySelector('a[aria-current], a')?.focus();
}
function closeDrawer() {
  sidebarEl?.classList.remove('open');
  scrimEl?.classList.remove('open');
}

async function logout() {
  await App.store.logout();
  shell = null;
  render();
}

/* Accesso ------------------------------------------------------------ */

let stopForge = null;
function renderLogin() {
  shell = null;
  root = document.getElementById('app');
  stopForge?.();
  const store = App.store;
  const canvas = h('canvas', { 'aria-hidden': 'true' });
  const card = h('div.login-card');
  const art = h('div.login-art', canvas, h('div.glow'),
    h('div', { style: 'position:relative;display:flex;align-items:center;gap:12px' }, brandMark(44),
      h('span', { style: 'font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--on-steel-2)' }, 'MPR Logistics')),
    h('h1.login-word', h('span', 'MAGAZZINO'), h('span', 'FERROLEGHE')),
    h('p.login-tag', 'Baie, mucchi e tettoia. Che materiale c\'è, dove si trova, quanto ne resta: dal telefono, senza passare in ufficio.'),
    scene(store.state?.fleet || DEFAULT_FLEET.map((v) => ({ ...v, status: 'Disponibile' })), { wrenchIcon: () => icon('settings', 14) }));
  fill(root, h('div.login', art, h('div.login-panel', card)));
  requestAnimationFrame(() => { stopForge = forge(canvas); });

  if (store.mode === 'demo') {
    card.append(
      h('div', h('div.eyebrow', 'Versione dimostrativa'), h('h2', { style: 'margin-top:6px' }, 'Chi sta lavorando?')),
      h('div.demo-banner', icon('alert', 20), h('span', 'Accesso dimostrativo: nessuna password e nessuna sicurezza. I dati sono inventati e restano solo in questo browser. Il server incluso nel progetto ha account veri.')),
      h('div', { style: 'display:grid;gap:10px' }, store.users.map((u, i) => h('button.persona', { type: 'button', style: `animation:rise 600ms ${300 + i * 90}ms both`, on: { click: () => { store.login(u.id); stopForge?.(); render({ nav: true }); toast(`Ciao ${u.name}: lavori come ${ROLES[u.role]}.`); } } },
        h('span.avatar', initials(u.name)), h('span', h('b', u.name), h('span', ROLES[u.role])), icon('chevR', 20)))));
    return;
  }

  // Server reale
  const err = h('div', { role: 'alert' });
  const fail = (e) => fill(err, h('div.form-error', icon('alert', 18), e.message));
  if (store.needsSetup) {
    const code = input({ id: 'su-code', autocomplete: 'off', class: 'mono' });
    const name = input({ id: 'su-name', autocomplete: 'name' });
    const user = input({ id: 'su-user', autocomplete: 'username', autocapitalize: 'none' });
    const pass = input({ id: 'su-pass', type: 'password', autocomplete: 'new-password' });
    card.append(h('div', h('div.eyebrow', 'Prima configurazione'), h('h2', { style: 'margin-top:6px' }, 'Crea l\'amministratore')), err,
      h('form', { style: 'display:grid;gap:14px', on: { submit: async (e) => { e.preventDefault(); try { await store.setup({ setupCode: code.value, name: name.value, username: user.value.trim().toLowerCase(), password: pass.value }); stopForge?.(); render({ nav: true }); } catch (x) { fail(x); } } } },
        field('Codice di configurazione', code, { hint: 'Lo trovi nella console del server all\'avvio.' }), field('Nome', name), field('Nome utente', user), field('Password (min. 8 caratteri)', pass),
        h('button.btn-forge', { type: 'submit' }, 'Crea e accedi')));
    return;
  }
  let mode = 'login';
  const body = h('div', { style: 'display:grid;gap:14px' });
  const tabs = h('div.seg', { role: 'tablist' });
  const draw = () => {
    fill(tabs, 
      h('button', { type: 'button', 'aria-pressed': String(mode === 'login'), on: { click: () => { mode = 'login'; draw(); } } }, 'Accedi'),
      h('button', { type: 'button', 'aria-pressed': String(mode === 'invite'), on: { click: () => { mode = 'invite'; draw(); } } }, 'Ho un invito'));
    clear(err);
    clear(body);
    if (mode === 'login') {
      const user = input({ id: 'li-user', autocomplete: 'username', autocapitalize: 'none' });
      const pass = input({ id: 'li-pass', type: 'password', autocomplete: 'current-password' });
      body.append(h('form', { style: 'display:grid;gap:14px', on: { submit: async (e) => { e.preventDefault(); try { await store.login(user.value, pass.value); stopForge?.(); render({ nav: true }); } catch (x) { fail(x); } } } },
        field('Nome utente', user), field('Password', pass), h('button.btn-forge', { type: 'submit' }, 'Entra')));
    } else {
      const inv = input({ id: 'rg-inv', class: 'mono', autocomplete: 'off' });
      const name = input({ id: 'rg-name', autocomplete: 'name' });
      const user = input({ id: 'rg-user', autocomplete: 'username', autocapitalize: 'none' });
      const pass = input({ id: 'rg-pass', type: 'password', autocomplete: 'new-password' });
      body.append(h('form', { style: 'display:grid;gap:14px', on: { submit: async (e) => { e.preventDefault(); try { await store.register({ invite: inv.value, name: name.value, username: user.value, password: pass.value }); stopForge?.(); render({ nav: true }); } catch (x) { fail(x); } } } },
        field('Codice d\'invito', inv), field('Nome e cognome', name), field('Nome utente', user, { hint: 'Minuscole, numeri, punto o trattino.' }), field('Password (min. 8 caratteri)', pass),
        h('button.btn-forge', { type: 'submit' }, 'Crea account')));
    }
  };
  card.append(h('div', h('div.eyebrow', 'Area riservata'), h('h2', { style: 'margin-top:6px' }, 'Accedi al magazzino')), tabs, err, body);
  draw();
}

/* Palette comandi ---------------------------------------------------- */

function openPalette() {
  if (document.querySelector('.palette')) return;
  const s = App.store.state;
  const inp = h('input', { id: 'pal-q', type: 'search', placeholder: 'Posizione, lotto, materiale o comando…', autocomplete: 'off', role: 'combobox', 'aria-controls': 'pal-list', 'aria-expanded': 'true' });
  const list = h('div.palette-list', { id: 'pal-list', role: 'listbox' });
  let items = [];
  let active = 0;
  let dlg;
  const commands = [
    { label: 'Aggiungi materiale', kind: 'Comando', icon: 'plus', run: () => addMaterialDialog() },
    { label: 'Nuovo arrivo su più giorni', kind: 'Comando', icon: 'truck', run: () => addMaterialDialog({ tab: 'plan' }) },
    { label: 'Nuovo ordine di lavoro', kind: 'Comando', icon: 'orders', run: () => orderDialog(null) },
    { label: 'Nuovo appunto', kind: 'Comando', icon: 'note', run: () => noteDialog(null) },
    { label: 'Nuovo evento', kind: 'Comando', icon: 'calendar', run: () => eventDialog(null) },
    ...NAV.map((n) => ({ label: n.label, kind: 'Pagina', icon: n.icon, run: () => navigate(n.id) })),
  ];
  function compute() {
    const q = inp.value.trim().toLowerCase();
    const locs = (q ? suggestLocations(q, 5) : LOCATIONS.slice(0, 0)).map((l) => {
      const st = positionStats(s, l.id);
      return { label: l.name, kind: `${KIND_LABEL[l.kind]} · ${st.present ? fmtTons(st.present) : 'vuota'}`, icon: 'pin', run: () => navigate(`pos-${l.id}`) };
    });
    const lots = q ? presentLots(s).filter((l) => `${l.lotCode} ${l.material} ${l.client}`.toLowerCase().includes(q)).slice(0, 6)
      .map((l) => ({ label: `${l.lotCode} · ${l.material}`, kind: `${getLocation(l.locationId).name} · ${fmtTons(l.tons)}`, icon: 'ingot', run: () => navigate(`pos-${l.locationId}`) })) : [];
    const plans = q ? openPlans(s).filter((p) => `${p.lotCode} ${p.material}`.toLowerCase().includes(q)).slice(0, 3)
      .map((p) => ({ label: `${p.lotCode} · in arrivo`, kind: getLocation(p.locationId).name, icon: 'truck', run: () => navigate(`pos-${p.locationId}`) })) : [];
    const cmds = commands.filter((c) => !q || c.label.toLowerCase().includes(q));
    items = [...locs, ...lots, ...plans, ...cmds].slice(0, 14);
    active = Math.min(active, Math.max(0, items.length - 1));
    clear(list);
    items.forEach((it, i) => list.append(h('div', { role: 'option', id: `pal-${i}`, 'aria-selected': String(i === active), on: { pointerdown: (e) => { e.preventDefault(); choose(i); }, pointermove: () => { if (active !== i) { active = i; mark(); } } } },
      icon(it.icon, 18), h('span', it.label), h('span.p-kind', it.kind))));
    if (!items.length) list.append(h('p.muted', { style: 'padding:14px' }, 'Nessun risultato.'));
    inp.setAttribute('aria-activedescendant', items.length ? `pal-${active}` : '');
  }
  function mark() {
    [...list.children].forEach((c, i) => c.setAttribute?.('aria-selected', String(i === active)));
    list.children[active]?.scrollIntoView?.({ block: 'nearest' });
    inp.setAttribute('aria-activedescendant', `pal-${active}`);
  }
  function choose(i) {
    const it = items[i];
    if (!it) return;
    dlg.close();
    setTimeout(() => it.run(), 60);
  }
  inp.addEventListener('input', () => { active = 0; compute(); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % Math.max(1, items.length); mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = (active - 1 + items.length) % Math.max(1, items.length); mark(); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
  });
  dlg = openDialog({
    className: 'palette', labelledBy: 'pal-q',
    body: h('div', { style: 'display:grid;margin:-4px -20px -20px' }, h('div.search-field', icon('search', 22), inp), list,
      h('div.palette-foot', h('span', h('kbd', '↑↓'), ' scegli'), h('span', h('kbd', 'Invio'), ' apri'), h('span', h('kbd', 'Esc'), ' chiudi'))),
  });
  compute();
}

addEventListener('keydown', (e) => {
  if (!App.store?.user) return;
  const typing = e.target.matches?.('input, textarea, select, [contenteditable]');
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing && !dialogOpen())) {
    e.preventDefault();
    openPalette();
  }
  if (e.key === 'Escape' && sidebarEl?.classList.contains('open')) closeDrawer();
});

/* Avvio -------------------------------------------------------------- */

async function boot() {
  prefs.load();
  const host = document.getElementById('app');
  try {
    App.store = await createStore();
  } catch (e) {
    host.textContent = `Impossibile avviare: ${e.message}`;
    return;
  }
  const store = App.store;
  store.subscribe((kind) => {
    if (kind === 'status') { if (shell) updateChrome(); return; }
    if (kind === 'auth') { shell = null; }
    if (kind === 'remote' && store.user && shell) {
      // un altro dispositivo ha salvato: aggiornamento silenzioso
    }
    render();
  });
  if (store.mode === 'demo') setInterval(() => store.tick(), (store.state.settings.reconcileSeconds || 30) * 1000);
  addEventListener('online', () => store.mode === 'server' && store.pull?.().catch(() => {}));
  addEventListener('offline', () => store.setStatus({ online: false, error: 'Rete assente' }));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (store.mode === 'demo') store.tick(); else store.pull?.().catch((e) => reportError(e));
  });
  render({ nav: true });
}

boot();

</script>
